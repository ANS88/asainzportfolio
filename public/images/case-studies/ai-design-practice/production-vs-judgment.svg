<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" fill="none">
  <style>
    text { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .col-title { font-size: 13px; font-weight: 600; fill: #ffffff; letter-spacing: 0.08em; text-transform: uppercase; }
    .col-sub { font-size: 10px; fill: #707078; }
    .item-text { font-size: 11px; fill: #d0d0d4; }
    .line-num { font-size: 10px; fill: #505058; }
    .tag { font-size: 9px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
    .tag-ai { fill: #707078; }
    .tag-human { fill: #ffffff; }
    .gate-label { font-size: 11px; font-weight: 600; fill: #ffffff; text-anchor: middle; letter-spacing: 0.08em; text-transform: uppercase; }
    .gate-sub { font-size: 9px; fill: #888890; text-anchor: middle; }
  </style>

  <!-- Left column: Production -->
  <text x="60" y="40" class="col-title">Production</text>
  <text x="60" y="56" class="col-sub">AI accelerates these</text>

  <line x1="60" y1="70" x2="390" y2="70" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>

  <!-- Production items -->
  <text x="60" y="104" class="line-num">01</text>
  <text x="92" y="104" class="item-text">Transcription &amp; first-pass coding</text>
  <text x="370" y="104" class="tag tag-ai">AI</text>

  <text x="60" y="142" class="line-num">02</text>
  <text x="92" y="142" class="item-text">Affinity clusters &amp; theme drafts</text>
  <text x="370" y="142" class="tag tag-ai">AI</text>

  <text x="60" y="180" class="line-num">03</text>
  <text x="92" y="180" class="item-text">Prototype scaffolding &amp; boilerplate</text>
  <text x="370" y="180" class="tag tag-ai">AI</text>

  <text x="60" y="218" class="line-num">04</text>
  <text x="92" y="218" class="item-text">Component variants &amp; documentation</text>
  <text x="370" y="218" class="tag tag-ai">AI</text>

  <text x="60" y="256" class="line-num">05</text>
  <text x="92" y="256" class="item-text">Report drafts &amp; meeting notes</text>
  <text x="370" y="256" class="tag tag-ai">AI</text>

  <!-- Center gate -->
  <line x1="480" y1="30" x2="480" y2="300" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <circle cx="480" cy="170" r="36" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <circle cx="480" cy="170" r="28" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <text x="480" y="166" class="gate-label">Review</text>
  <text x="480" y="182" class="gate-sub">Gate</text>

  <!-- Flow arrows -->
  <line x1="400" y1="104" x2="444" y2="150" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
  <line x1="400" y1="142" x2="444" y2="158" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
  <line x1="400" y1="180" x2="444" y2="170" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
  <line x1="400" y1="218" x2="444" y2="182" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
  <line x1="400" y1="256" x2="444" y2="194" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>

  <line x1="516" y1="150" x2="560" y2="104" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
  <line x1="516" y1="158" x2="560" y2="142" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
  <line x1="516" y1="170" x2="560" y2="180" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
  <line x1="516" y1="182" x2="560" y2="218" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
  <line x1="516" y1="194" x2="560" y2="256" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>

  <!-- Right column: Judgment -->
  <text x="560" y="40" class="col-title">Judgment</text>
  <text x="560" y="56" class="col-sub">Humans own these</text>

  <line x1="560" y1="70" x2="900" y2="70" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>

  <!-- Judgment items -->
  <text x="560" y="104" class="line-num">01</text>
  <text x="592" y="104" class="item-text">What to build &amp; what evidence means</text>
  <text x="870" y="104" class="tag tag-human">Human</text>

  <text x="560" y="142" class="line-num">02</text>
  <text x="592" y="142" class="item-text">Theme validation against field memory</text>
  <text x="870" y="142" class="tag tag-human">Human</text>

  <text x="560" y="180" class="line-num">03</text>
  <text x="592" y="180" class="item-text">Interaction refinement &amp; craft</text>
  <text x="870" y="180" class="tag tag-human">Human</text>

  <text x="560" y="218" class="line-num">04</text>
  <text x="592" y="218" class="item-text">Quality standards &amp; what ships</text>
  <text x="870" y="218" class="tag tag-human">Human</text>

  <text x="560" y="256" class="line-num">05</text>
  <text x="592" y="256" class="item-text">Domain review &amp; final authority</text>
  <text x="870" y="256" class="tag tag-human">Human</text>

  <!-- Bottom divider -->
  <line x1="60" y1="340" x2="900" y2="340" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>
  <text x="480" y="370" class="gate-sub" text-anchor="middle">AI handles volume; humans hold the line on meaning, craft, and consequence</text>
</svg>