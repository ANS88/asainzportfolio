<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" fill="none">
  <style>
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
    .sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .title { font-size: 22px; font-weight: 400; fill: #ffffff; }
    .sub { font-size: 11px; fill: #777; letter-spacing: 0.06em; text-transform: uppercase; }
    .item { font-size: 13px; fill: #aaa; }
    .time { font-size: 36px; font-weight: 400; fill: #ffffff; }
    .time-label { font-size: 11px; fill: #666; letter-spacing: 0.06em; text-transform: uppercase; }
    .arrow { font-size: 28px; fill: #ffffff; text-anchor: middle; }
    .note { font-size: 12px; fill: #555; text-anchor: middle; font-style: italic; }
  </style>

  <!-- Dot texture -->
  <circle cx="120" cy="40" r="1.5" fill="#ffffff" opacity="0.04"/>
  <circle cx="860" cy="60" r="1.5" fill="#ffffff" opacity="0.04"/>
  <circle cx="480" cy="340" r="1.5" fill="#ffffff" opacity="0.04"/>

  <!-- BEFORE column -->
  <text x="60" y="42" class="serif title">Before</text>
  <text x="60" y="60" class="sans sub">Manual synthesis</text>
  <path d="M58,48 C105,45 160,50 220,47" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2" stroke-linecap="round"/>

  <!-- Steps -->
  <text x="60" y="104" class="sans item">Transcribe hours of recordings</text>
  <text x="60" y="136" class="sans item">Hand-code affinity clusters</text>
  <text x="60" y="168" class="sans item">Draft themes from scratch</text>
  <text x="60" y="200" class="sans item">Chase quote provenance</text>
  <text x="60" y="232" class="sans item">Write up findings</text>

  <!-- Time -->
  <text x="60" y="300" class="serif time">2–3 wks</text>
  <text x="60" y="320" class="sans time-label">Per study</text>

  <!-- Arrow -->
  <text x="420" y="190" class="serif arrow">→</text>
  <path d="M380,186 C400,183 440,183 460,186" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.15" stroke-linecap="round"/>

  <!-- AFTER column -->
  <text x="530" y="42" class="serif title">After</text>
  <text x="530" y="60" class="sans sub">AI-assisted synthesis</text>
  <path d="M528,48 C575,45 630,50 690,47" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2" stroke-linecap="round"/>

  <!-- Steps with role tags -->
  <text x="530" y="104" class="sans item">Auto-transcription</text>
  <text x="788" y="104" class="sans sub" style="fill:#555">AI</text>

  <text x="530" y="136" class="sans item">First-pass clusters + quote banks</text>
  <text x="788" y="136" class="sans sub" style="fill:#555">AI</text>

  <text x="530" y="168" class="sans item">Validate against field memory</text>
  <text x="788" y="168" class="sans sub" style="fill:#ddd">Human</text>

  <text x="530" y="200" class="sans item">Pressure-test interpretations</text>
  <text x="788" y="200" class="sans sub" style="fill:#ddd">Human</text>

  <text x="530" y="232" class="sans item">Trace findings to evidence</text>
  <text x="788" y="232" class="sans sub" style="fill:#ddd">Human</text>

  <!-- Time -->
  <text x="530" y="300" class="serif time">1–2 days</text>
  <text x="530" y="320" class="sans time-label">Per study</text>

  <!-- Bottom note -->
  <path d="M200,352 C320,348 460,356 600,350 C700,346 760,352 800,349" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1" stroke-linecap="round"/>
  <text x="480" y="372" class="serif note">speed changes; rigor doesn't — AI-generated synthesis is a draft, never a finding</text>
</svg>
