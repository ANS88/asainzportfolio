<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" fill="none">
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .rule-num { font-size: 9px; fill: #3a6a8a; letter-spacing: 0.1em; }
    .rule-title { font-size: 11px; font-weight: 700; fill: #7dd3fc; letter-spacing: 0.08em; }
    .rule-desc { font-size: 9px; fill: #5a9abf; }
    .comment { font-size: 9px; fill: #2a5070; }
    .status { font-size: 8px; font-weight: 700; fill: #3a8a5a; letter-spacing: 0.1em; }
    .header { font-size: 10px; font-weight: 700; fill: #5a9abf; letter-spacing: 0.15em; text-transform: uppercase; }
    .ln { font-size: 9px; fill: #1e3a5c; text-anchor: end; }
  </style>

  <!-- Dot grid background -->
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.6" fill="#1e3a5c" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="960" height="520" fill="url(#dots)"/>

  <!-- Outer terminal frame -->
  <rect x="60" y="20" width="840" height="480" fill="#0a1520" stroke="#1e3a5c" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="60" y="20" width="840" height="28" fill="#0e1c2c" stroke="#1e3a5c" stroke-width="1"/>
  <circle cx="80" cy="34" r="4" fill="#1e3a5c" opacity="0.6"/>
  <circle cx="94" cy="34" r="4" fill="#1e3a5c" opacity="0.6"/>
  <circle cx="108" cy="34" r="4" fill="#1e3a5c" opacity="0.6"/>
  <text x="480" y="38" class="header" text-anchor="middle">governance.config</text>

  <!-- Line number gutter -->
  <rect x="60" y="48" width="36" height="452" fill="#0c1825"/>
  <line x1="96" y1="48" x2="96" y2="500" stroke="#1e3a5c" stroke-width="0.5"/>

  <!-- File content as code -->
  <text x="88" y="72" class="ln">1</text>
  <text x="108" y="72" class="comment">// AI Governance Framework — Design Practice</text>

  <text x="88" y="88" class="ln">2</text>
  <text x="108" y="88" class="comment">// Five non-negotiable rules</text>

  <text x="88" y="104" class="ln">3</text>

  <!-- Rule 1 -->
  <text x="88" y="122" class="ln">4</text>
  <text x="108" y="122" class="rule-num">RULE_01</text>
  <text x="870" y="122" class="status">ENFORCED</text>
  <rect x="100" y="128" width="760" height="1" fill="#1e3a5c" opacity="0.3"/>

  <text x="88" y="140" class="ln">5</text>
  <text x="120" y="140" class="rule-title">Data Boundaries Are Absolute</text>

  <text x="88" y="156" class="ln">6</text>
  <text x="120" y="156" class="rule-desc">No PHI, patient data, or sensitive lab data enters any AI tool.</text>

  <text x="88" y="172" class="ln">7</text>
  <text x="120" y="172" class="rule-desc">Research data de-identified before processing. All tools run</text>

  <text x="88" y="188" class="ln">8</text>
  <text x="120" y="188" class="rule-desc">through company-approved accounts under data handling policy.</text>

  <text x="88" y="204" class="ln">9</text>

  <!-- Rule 2 -->
  <text x="88" y="222" class="ln">10</text>
  <text x="108" y="222" class="rule-num">RULE_02</text>
  <text x="870" y="222" class="status">ENFORCED</text>
  <rect x="100" y="228" width="760" height="1" fill="#1e3a5c" opacity="0.3"/>

  <text x="88" y="240" class="ln">11</text>
  <text x="120" y="240" class="rule-title">AI Output Is Always a Draft</text>

  <text x="88" y="256" class="ln">12</text>
  <text x="120" y="256" class="rule-desc">Findings, copy, code, documentation require human review by</text>

  <text x="88" y="272" class="ln">13</text>
  <text x="120" y="272" class="rule-desc">someone accountable for the result. No exceptions.</text>

  <text x="88" y="288" class="ln">14</text>

  <!-- Rule 3 -->
  <text x="88" y="306" class="ln">15</text>
  <text x="108" y="306" class="rule-num">RULE_03</text>
  <text x="870" y="306" class="status">ENFORCED</text>
  <rect x="100" y="312" width="760" height="1" fill="#1e3a5c" opacity="0.3"/>

  <text x="88" y="324" class="ln">16</text>
  <text x="120" y="324" class="rule-title">Provenance Is Tracked</text>

  <text x="88" y="340" class="ln">17</text>
  <text x="120" y="340" class="rule-desc">Reports and deliverables note where AI assisted, so review</text>

  <text x="88" y="356" class="ln">18</text>
  <text x="120" y="356" class="rule-desc">effort can be calibrated honestly.</text>

  <text x="88" y="372" class="ln">19</text>

  <!-- Rule 4 -->
  <text x="88" y="390" class="ln">20</text>
  <text x="108" y="390" class="rule-num">RULE_04</text>
  <text x="870" y="390" class="status">ENFORCED</text>
  <rect x="100" y="396" width="760" height="1" fill="#1e3a5c" opacity="0.3"/>

  <text x="88" y="408" class="ln">21</text>
  <text x="120" y="408" class="rule-title">Centrally Approved, Individually Explored</text>

  <text x="88" y="424" class="ln">22</text>
  <text x="120" y="424" class="rule-desc">Short list of sanctioned tools with lightweight process for</text>

  <text x="88" y="440" class="ln">23</text>
  <text x="120" y="440" class="rule-desc">proposing new ones. Experimentation without shadow-IT sprawl.</text>

  <text x="88" y="456" class="ln">24</text>

  <!-- Rule 5 -->
  <text x="88" y="470" class="ln">25</text>
  <text x="108" y="470" class="rule-num">RULE_05</text>
  <text x="870" y="470" class="status">ENFORCED</text>
  <rect x="100" y="476" width="760" height="1" fill="#1e3a5c" opacity="0.3"/>

  <text x="88" y="488" class="ln">26</text>
  <text x="120" y="488" class="rule-title">Skill-Building Is Deliberate</text>

  <!-- Blinking cursor at bottom -->
  <rect x="120" y="494" width="7" height="12" fill="#7dd3fc" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0;0.4" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>