<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <style>
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
    .sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .header { font-size: 28px; font-weight: 400; fill: #ffffff; }
    .header-sub { font-size: 11px; fill: #777; letter-spacing: 0.06em; text-transform: uppercase; }
    .num { font-size: 13px; fill: #444; letter-spacing: 0.02em; }
    .rule-title { font-size: 17px; font-weight: 400; fill: #ffffff; }
    .rule-desc { font-size: 12px; fill: #888; line-height: 1.5; }
    .check { font-size: 14px; fill: #777; }
  </style>

  <!-- Dot texture -->
  <circle cx="900" cy="50" r="1.5" fill="#ffffff" opacity="0.04"/>
  <circle cx="50" cy="500" r="1.5" fill="#ffffff" opacity="0.04"/>
  <circle cx="700" cy="480" r="1.5" fill="#ffffff" opacity="0.04"/>

  <!-- Header -->
  <text x="60" y="52" class="serif header">Governance Framework</text>
  <path d="M58,58 C150,54 300,62 440,55" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.2" stroke-linecap="round"/>
  <text x="60" y="78" class="sans header-sub">5 non-negotiable rules for AI in design</text>

  <!-- Rule 1 -->
  <g transform="rotate(-0.3, 400, 130)">
    <text x="60" y="132" class="sans num">01</text>
    <text x="100" y="132" class="serif rule-title">Data Boundaries Are Absolute</text>
    <text x="860" y="132" class="sans check">&#10003;</text>
    <text x="100" y="156" class="sans rule-desc">No PHI or patient data enters any AI tool.</text>
    <text x="100" y="174" class="sans rule-desc">Research data de-identified before processing.</text>
  </g>
  <path d="M95,188 C280,184 480,192 700,186" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.1" stroke-linecap="round"/>

  <!-- Rule 2 -->
  <g transform="rotate(0.2, 400, 222)">
    <text x="60" y="222" class="sans num">02</text>
    <text x="100" y="222" class="serif rule-title">AI Output Is Always a Draft</text>
    <text x="860" y="222" class="sans check">&#10003;</text>
    <text x="100" y="246" class="sans rule-desc">Everything requires human review by someone</text>
    <text x="100" y="264" class="sans rule-desc">accountable for the result. No exceptions.</text>
  </g>
  <path d="M95,278 C280,274 480,282 700,276" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.1" stroke-linecap="round"/>

  <!-- Rule 3 -->
  <g transform="rotate(-0.4, 400, 312)">
    <text x="60" y="312" class="sans num">03</text>
    <text x="100" y="312" class="serif rule-title">Provenance Is Tracked</text>
    <text x="860" y="312" class="sans check">&#10003;</text>
    <text x="100" y="336" class="sans rule-desc">Deliverables note where AI assisted, so review</text>
    <text x="100" y="354" class="sans rule-desc">effort can be calibrated honestly.</text>
  </g>
  <path d="M95,368 C280,364 480,372 700,366" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.1" stroke-linecap="round"/>

  <!-- Rule 4 -->
  <g transform="rotate(0.3, 400, 402)">
    <text x="60" y="402" class="sans num">04</text>
    <text x="100" y="402" class="serif rule-title">Centrally Approved, Individually Explored</text>
    <text x="860" y="402" class="sans check">&#10003;</text>
    <text x="100" y="426" class="sans rule-desc">Sanctioned tools + lightweight process for new ones.</text>
    <text x="100" y="444" class="sans rule-desc">Experimentation without shadow-IT sprawl.</text>
  </g>
  <path d="M95,458 C280,454 480,462 700,456" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.1" stroke-linecap="round"/>

  <!-- Rule 5 -->
  <g transform="rotate(-0.2, 400, 492)">
    <text x="60" y="492" class="sans num">05</text>
    <text x="100" y="492" class="serif rule-title">Skill-Building Is Deliberate</text>
    <text x="860" y="492" class="sans check">&#10003;</text>
    <text x="100" y="516" class="sans rule-desc">AI fluency is a team competency. Structured learning,</text>
    <text x="100" y="534" class="sans rule-desc">shared prompts, regular retros on what worked.</text>
  </g>
</svg>