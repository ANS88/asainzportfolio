<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" fill="none">
  <style>
    text { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .header { font-size: 12px; font-weight: 600; fill: #ffffff; letter-spacing: 0.1em; text-transform: uppercase; }
    .header-sub { font-size: 10px; fill: #707078; }
    .rule-num { font-size: 10px; fill: #505058; letter-spacing: 0.06em; font-weight: 500; }
    .rule-title { font-size: 12px; font-weight: 600; fill: #ffffff; }
    .rule-desc { font-size: 10px; fill: #888890; }
    .status { font-size: 9px; font-weight: 500; fill: #888890; letter-spacing: 0.08em; text-transform: uppercase; }
  </style>

  <!-- Header -->
  <text x="60" y="44" class="header">Governance Framework</text>
  <text x="60" y="62" class="header-sub">Five non-negotiable rules for AI in design practice</text>
  <line x1="60" y1="78" x2="900" y2="78" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>

  <!-- Rule 1 -->
  <text x="60" y="116" class="rule-num">01</text>
  <text x="100" y="116" class="rule-title">Data Boundaries Are Absolute</text>
  <text x="860" y="116" class="status">Enforced</text>
  <text x="100" y="136" class="rule-desc">No PHI, patient data, or sensitive lab data enters any AI tool. Research data de-identified</text>
  <text x="100" y="152" class="rule-desc">before processing. All tools run through company-approved accounts.</text>
  <line x1="60" y1="170" x2="900" y2="170" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>

  <!-- Rule 2 -->
  <text x="60" y="198" class="rule-num">02</text>
  <text x="100" y="198" class="rule-title">AI Output Is Always a Draft</text>
  <text x="860" y="198" class="status">Enforced</text>
  <text x="100" y="218" class="rule-desc">Findings, copy, code, documentation require human review by someone accountable</text>
  <text x="100" y="234" class="rule-desc">for the result. No exceptions.</text>
  <line x1="60" y1="252" x2="900" y2="252" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>

  <!-- Rule 3 -->
  <text x="60" y="280" class="rule-num">03</text>
  <text x="100" y="280" class="rule-title">Provenance Is Tracked</text>
  <text x="860" y="280" class="status">Enforced</text>
  <text x="100" y="300" class="rule-desc">Reports and deliverables note where AI assisted, so review effort can be</text>
  <text x="100" y="316" class="rule-desc">calibrated honestly.</text>
  <line x1="60" y1="334" x2="900" y2="334" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>

  <!-- Rule 4 -->
  <text x="60" y="362" class="rule-num">04</text>
  <text x="100" y="362" class="rule-title">Centrally Approved, Individually Explored</text>
  <text x="860" y="362" class="status">Enforced</text>
  <text x="100" y="382" class="rule-desc">Short list of sanctioned tools with lightweight process for proposing new ones.</text>
  <text x="100" y="398" class="rule-desc">Experimentation without shadow-IT sprawl.</text>
  <line x1="60" y1="416" x2="900" y2="416" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>

  <!-- Rule 5 -->
  <text x="60" y="444" class="rule-num">05</text>
  <text x="100" y="444" class="rule-title">Skill-Building Is Deliberate</text>
  <text x="860" y="444" class="status">Enforced</text>
  <text x="100" y="464" class="rule-desc">AI fluency is a team competency, not an individual hobby. Structured learning, shared prompts,</text>
  <text x="100" y="480" class="rule-desc">regular retrospectives on what worked.</text>
</svg>