<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" fill="none">
  <style>
    text { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .hub-label { font-size: 12px; font-weight: 600; fill: #ffffff; text-anchor: middle; letter-spacing: 0.12em; text-transform: uppercase; }
    .hub-sub { font-size: 10px; fill: #888890; text-anchor: middle; }
    .node-label { font-size: 11px; font-weight: 600; fill: #ffffff; letter-spacing: 0.04em; }
    .node-desc { font-size: 10px; fill: #888890; }
    .tag { font-size: 9px; font-weight: 500; fill: #b0b0b8; letter-spacing: 0.06em; text-transform: uppercase; }
    .gov-label { font-size: 10px; fill: #707078; text-anchor: middle; letter-spacing: 0.06em; }
  </style>

  <!-- Center hub -->
  <circle cx="480" cy="240" r="52" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>
  <circle cx="480" cy="240" r="44" fill="none" stroke="#ffffff" stroke-width="1"/>
  <text x="480" y="236" class="hub-label">Judgment</text>
  <text x="480" y="252" class="hub-sub">Humans own</text>

  <!-- Outer ring -->
  <circle cx="480" cy="240" r="160" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>

  <!-- Connection lines -->
  <line x1="480" y1="196" x2="480" y2="90" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <line x1="520" y1="212" x2="700" y2="130" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <line x1="520" y1="268" x2="700" y2="360" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <line x1="440" y1="268" x2="260" y2="360" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <line x1="440" y1="212" x2="260" y2="130" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>

  <!-- Small dots at endpoints -->
  <circle cx="480" cy="90" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="700" cy="130" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="700" cy="360" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="260" cy="360" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="260" cy="130" r="3" fill="#ffffff" opacity="0.3"/>

  <!-- Node 1: Research Synthesis (top) -->
  <line x1="380" y1="40" x2="420" y2="40" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <text x="380" y="60" class="node-label">Research Synthesis</text>
  <text x="380" y="76" class="node-desc">AI drafts themes; researchers adjudicate</text>
  <text x="380" y="92" class="tag">Highest leverage</text>

  <!-- Node 2: Prototyping (right-top) -->
  <line x1="700" y1="100" x2="740" y2="100" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <text x="700" y="120" class="node-label">Prototyping</text>
  <text x="700" y="136" class="node-desc">AI scaffolds code; designers refine craft</text>
  <text x="700" y="152" class="tag">Interactive builds</text>

  <!-- Node 3: Design Systems (right-bottom) -->
  <line x1="700" y1="330" x2="740" y2="330" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <text x="700" y="350" class="node-label">Design Systems</text>
  <text x="700" y="366" class="node-desc">AI generates variants; designers ship diffs</text>
  <text x="700" y="382" class="tag">Reviewable changes</text>

  <!-- Node 4: Content (left-bottom) -->
  <line x1="60" y1="330" x2="100" y2="330" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <text x="60" y="350" class="node-label">Content &amp; Comms</text>
  <text x="60" y="366" class="node-desc">AI drafts copy; humans review with context</text>
  <text x="60" y="382" class="tag">Domain-specific</text>

  <!-- Node 5: Design Ops (left-top) -->
  <line x1="60" y1="100" x2="100" y2="100" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <text x="60" y="120" class="node-label">Design Operations</text>
  <text x="60" y="136" class="node-desc">AI automates notes, tagging, onboarding</text>
  <text x="60" y="152" class="tag">Lowest risk</text>

  <!-- Bottom governance strip -->
  <line x1="120" y1="490" x2="840" y2="490" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <text x="480" y="510" class="gov-label">data boundaries · draft never final · provenance tracking · approved tooling · skill building</text>
  <line x1="120" y1="522" x2="840" y2="522" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
</svg>