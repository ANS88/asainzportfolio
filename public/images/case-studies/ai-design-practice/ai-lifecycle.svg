<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" fill="none">
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .hub-label { font-size: 11px; font-weight: 700; fill: #7dd3fc; text-anchor: middle; letter-spacing: 0.15em; text-transform: uppercase; }
    .hub-sub { font-size: 9px; fill: #5a9abf; text-anchor: middle; letter-spacing: 0.05em; }
    .node-label { font-size: 10px; font-weight: 600; fill: #d4e8f5; letter-spacing: 0.08em; text-transform: uppercase; }
    .node-desc { font-size: 9px; fill: #6a96b8; }
    .tag { font-size: 8px; font-weight: 700; fill: #7dd3fc; letter-spacing: 0.1em; }
    .gov-label { font-size: 9px; fill: #5a9abf; text-anchor: middle; letter-spacing: 0.05em; }
  </style>

  <!-- Dot grid background texture -->
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.6" fill="#1e3a5c" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="960" height="560" fill="url(#dots)"/>

  <!-- Center hexagon hub -->
  <polygon points="480,190 530,215 530,265 480,290 430,265 430,215" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.3"/>
  <polygon points="480,200 522,220 522,260 480,280 438,260 438,220" fill="#0a1520" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="480" y="244" class="hub-label">Judgment</text>
  <text x="480" y="258" class="hub-sub">Humans own</text>

  <!-- Outer hex ring (faint) -->
  <polygon points="480,100 580,146 580,238 480,284 380,238 380,146" fill="none" stroke="#1e3a5c" stroke-width="0.5" stroke-dasharray="3 5" opacity="0.4"/>

  <!-- Connection lines — thin, precise -->
  <line x1="480" y1="200" x2="480" y2="108" stroke="#1e3a5c" stroke-width="1"/>
  <line x1="522" y1="220" x2="700" y2="140" stroke="#1e3a5c" stroke-width="1"/>
  <line x1="522" y1="260" x2="700" y2="360" stroke="#1e3a5c" stroke-width="1"/>
  <line x1="438" y1="260" x2="260" y2="360" stroke="#1e3a5c" stroke-width="1"/>
  <line x1="438" y1="220" x2="260" y2="140" stroke="#1e3a5c" stroke-width="1"/>

  <!-- Small diamonds at connection endpoints -->
  <polygon points="480,108 484,100 480,92 476,100" fill="#7dd3fc" opacity="0.5"/>
  <polygon points="700,140 704,132 700,124 696,132" fill="#7dd3fc" opacity="0.5"/>
  <polygon points="700,360 704,352 700,344 696,352" fill="#7dd3fc" opacity="0.5"/>
  <polygon points="260,360 264,352 260,344 256,352" fill="#7dd3fc" opacity="0.5"/>
  <polygon points="260,140 264,132 260,124 256,132" fill="#7dd3fc" opacity="0.5"/>

  <!-- Node 1: Research Synthesis (top) -->
  <line x1="380" y1="42" x2="380" y2="42" stroke="none"/>
  <rect x="380" y="32" width="200" height="54" fill="none" stroke="#1e3a5c" stroke-width="1"/>
  <line x1="380" y1="32" x2="396" y2="32" stroke="#7dd3fc" stroke-width="2"/>
  <text x="392" y="52" class="node-label">Research Synthesis</text>
  <text x="392" y="66" class="node-desc">AI drafts themes; researchers adjudicate</text>
  <text x="392" y="78" class="tag">// HIGHEST LEVERAGE</text>

  <!-- Node 2: Prototyping (right-top) -->
  <rect x="700" y="100" width="220" height="54" fill="none" stroke="#1e3a5c" stroke-width="1"/>
  <line x1="700" y1="100" x2="716" y2="100" stroke="#7dd3fc" stroke-width="2"/>
  <text x="712" y="120" class="node-label">Prototyping</text>
  <text x="712" y="134" class="node-desc">AI scaffolds code; designers refine craft</text>
  <text x="712" y="146" class="tag">// INTERACTIVE BUILDS</text>

  <!-- Node 3: Design Systems (right-bottom) -->
  <rect x="700" y="330" width="220" height="54" fill="none" stroke="#1e3a5c" stroke-width="1"/>
  <line x1="700" y1="330" x2="716" y2="330" stroke="#7dd3fc" stroke-width="2"/>
  <text x="712" y="350" class="node-label">Design Systems</text>
  <text x="712" y="364" class="node-desc">AI generates variants; designers ship diffs</text>
  <text x="712" y="376" class="tag">// REVIEWABLE CHANGES</text>

  <!-- Node 4: Content (left-bottom) -->
  <rect x="40" y="330" width="220" height="54" fill="none" stroke="#1e3a5c" stroke-width="1"/>
  <line x1="40" y1="330" x2="56" y2="330" stroke="#7dd3fc" stroke-width="2"/>
  <text x="52" y="350" class="node-label">Content &amp; Comms</text>
  <text x="52" y="364" class="node-desc">AI drafts copy; humans review with context</text>
  <text x="52" y="376" class="tag">// DOMAIN-SPECIFIC</text>

  <!-- Node 5: Design Ops (left-top) -->
  <rect x="40" y="100" width="220" height="54" fill="none" stroke="#1e3a5c" stroke-width="1"/>
  <line x1="40" y1="100" x2="56" y2="100" stroke="#7dd3fc" stroke-width="2"/>
  <text x="52" y="120" class="node-label">Design Operations</text>
  <text x="52" y="134" class="node-desc">AI automates notes, tagging, onboarding</text>
  <text x="52" y="146" class="tag">// LOWEST RISK</text>

  <!-- Bottom governance strip -->
  <line x1="80" y1="480" x2="880" y2="480" stroke="#1e3a5c" stroke-width="1"/>
  <text x="480" y="500" class="gov-label">data_boundaries · draft_never_final · provenance_tracking · approved_tooling · skill_building</text>
  <line x1="80" y1="510" x2="880" y2="510" stroke="#1e3a5c" stroke-width="1"/>
</svg>