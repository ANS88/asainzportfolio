<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" fill="none">
  <style>
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
    .sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .area { font-size: 18px; font-weight: 400; fill: #ffffff; }
    .ai-does { font-size: 12px; fill: #888; }
    .human-owns { font-size: 12px; fill: #ccc; }
    .col-head { font-size: 10px; fill: #666; letter-spacing: 0.08em; text-transform: uppercase; }
    .divider { stroke: #ffffff; stroke-width: 1; opacity: 0.08; }
    .note { font-size: 12px; fill: #555; text-anchor: middle; font-style: italic; }
  </style>

  <!-- Dot texture -->
  <circle cx="80" cy="30" r="1.5" fill="#ffffff" opacity="0.04"/>
  <circle cx="900" cy="50" r="1.5" fill="#ffffff" opacity="0.04"/>
  <circle cx="460" cy="490" r="1.5" fill="#ffffff" opacity="0.04"/>

  <!-- Column headers -->
  <text x="60" y="40" class="sans col-head">Practice area</text>
  <text x="380" y="40" class="sans col-head">AI accelerates</text>
  <text x="680" y="40" class="sans col-head">Humans own</text>
  <line x1="60" y1="52" x2="900" y2="52" class="divider"/>

  <!-- Row 1: Research Synthesis -->
  <text x="60" y="96" class="serif area">Research Synthesis</text>
  <text x="380" y="88" class="sans ai-does">Transcription, affinity clusters,</text>
  <text x="380" y="106" class="sans ai-does">theme drafts, quote banks</text>
  <text x="680" y="88" class="sans human-owns">Theme validation, interpretation,</text>
  <text x="680" y="106" class="sans human-owns">tracing to source evidence</text>
  <line x1="60" y1="126" x2="900" y2="126" class="divider"/>

  <!-- Row 2: Prototyping -->
  <text x="60" y="170" class="serif area">Prototyping</text>
  <text x="380" y="162" class="sans ai-does">Code scaffolding, boilerplate,</text>
  <text x="380" y="180" class="sans ai-does">component generation</text>
  <text x="680" y="162" class="sans human-owns">Interaction refinement,</text>
  <text x="680" y="180" class="sans human-owns">design craft, usability decisions</text>
  <line x1="60" y1="200" x2="900" y2="200" class="divider"/>

  <!-- Row 3: Design Systems -->
  <text x="60" y="244" class="serif area">Design Systems</text>
  <text x="380" y="236" class="sans ai-does">Variant generation, docs,</text>
  <text x="380" y="254" class="sans ai-does">accessibility checks, codebase reads</text>
  <text x="680" y="236" class="sans human-owns">Standards, quality bar,</text>
  <text x="680" y="254" class="sans human-owns">review authority on production diffs</text>
  <line x1="60" y1="274" x2="900" y2="274" class="divider"/>

  <!-- Row 4: Content -->
  <text x="60" y="318" class="serif area">Content &amp; Comms</text>
  <text x="380" y="310" class="sans ai-does">Report drafts, UX copy variants,</text>
  <text x="380" y="328" class="sans ai-does">annotations, release notes</text>
  <text x="680" y="310" class="sans human-owns">Domain review, clinical accuracy,</text>
  <text x="680" y="328" class="sans human-owns">final editorial authority</text>
  <line x1="60" y1="348" x2="900" y2="348" class="divider"/>

  <!-- Row 5: Ops -->
  <text x="60" y="392" class="serif area">Design Ops</text>
  <text x="380" y="384" class="sans ai-does">Meeting notes, research tagging,</text>
  <text x="380" y="402" class="sans ai-does">onboarding material updates</text>
  <text x="680" y="384" class="sans human-owns">Decision confirmation,</text>
  <text x="680" y="402" class="sans human-owns">process design, team rituals</text>
  <line x1="60" y1="422" x2="900" y2="422" class="divider"/>

  <!-- Bottom tagline -->
  <path d="M180,465 C300,460 460,470 600,463 C720,458 800,464 840,461" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.12" stroke-linecap="round"/>
  <text x="480" y="492" class="serif note">same framework, same boundary: production accelerates, judgment stays human</text>
</svg>
