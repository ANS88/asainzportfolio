<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" fill="none">
  <style>
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
    .sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .area { font-size: 18px; font-weight: 400; fill: #ffffff; }
    .ai-does { font-size: 12px; fill: #888; }
    .human-owns { font-size: 12px; fill: #ccc; }
    .col-head { font-size: 10px; fill: #666; letter-spacing: 0.08em; text-transform: uppercase; }
    .tool { font-size: 10px; fill: #555; font-style: italic; }
    .divider { stroke: #ffffff; stroke-width: 1; opacity: 0.08; }
    .note { font-size: 12px; fill: #555; text-anchor: middle; font-style: italic; }
  </style>

  <!-- Dot texture -->
  <circle cx="80" cy="30" r="1.5" fill="#ffffff" opacity="0.04"/>
  <circle cx="900" cy="50" r="1.5" fill="#ffffff" opacity="0.04"/>
  <circle cx="460" cy="530" r="1.5" fill="#ffffff" opacity="0.04"/>

  <!-- Column headers -->
  <text x="60" y="40" class="sans col-head">Practice area</text>
  <text x="340" y="40" class="sans col-head">AI accelerates</text>
  <text x="650" y="40" class="sans col-head">Humans own</text>
  <line x1="60" y1="52" x2="900" y2="52" class="divider"/>

  <!-- Row 1: Research Synthesis -->
  <text x="60" y="96" class="serif area">Research Synthesis</text>
  <text x="340" y="82" class="sans ai-does">Transcription (Whisper),</text>
  <text x="340" y="98" class="sans ai-does">affinity clusters, quote banks</text>
  <text x="340" y="114" class="sans ai-does">with source timestamps</text>
  <text x="340" y="130" class="sans tool">Claude · Dovetail</text>
  <text x="650" y="82" class="sans human-owns">Theme validation vs. field memory,</text>
  <text x="650" y="98" class="sans human-owns">interpretation, source trail</text>
  <text x="650" y="114" class="sans human-owns">verification, stakeholder readout</text>
  <line x1="60" y1="148" x2="900" y2="148" class="divider"/>

  <!-- Row 2: Prototyping -->
  <text x="60" y="188" class="serif area">Prototyping</text>
  <text x="340" y="176" class="sans ai-does">Code scaffolding against React</text>
  <text x="340" y="192" class="sans ai-does">component library, boilerplate,</text>
  <text x="340" y="208" class="sans ai-does">state machine stub generation</text>
  <text x="340" y="224" class="sans tool">Claude Code · Copilot</text>
  <text x="650" y="176" class="sans human-owns">Interaction logic, role-based</text>
  <text x="650" y="192" class="sans human-owns">view design, edge state handling,</text>
  <text x="650" y="208" class="sans human-owns">usability testing protocol</text>
  <line x1="60" y1="242" x2="900" y2="242" class="divider"/>

  <!-- Row 3: Design Systems -->
  <text x="60" y="282" class="serif area">Design Systems</text>
  <text x="340" y="270" class="sans ai-does">Token-based variant generation,</text>
  <text x="340" y="286" class="sans ai-does">WCAG 2.1 AA contrast checks,</text>
  <text x="340" y="302" class="sans ai-does">component API docs, codebase reads</text>
  <text x="340" y="318" class="sans tool">Copilot · Claude</text>
  <text x="650" y="270" class="sans human-owns">Quality bar, design token decisions,</text>
  <text x="650" y="286" class="sans human-owns">engineering MR review authority,</text>
  <text x="650" y="302" class="sans human-owns">pattern library governance</text>
  <line x1="60" y1="336" x2="900" y2="336" class="divider"/>

  <!-- Row 4: Content -->
  <text x="60" y="376" class="serif area">Content &amp; Comms</text>
  <text x="340" y="364" class="sans ai-does">UX copy variant generation,</text>
  <text x="340" y="380" class="sans ai-does">usability report drafts,</text>
  <text x="340" y="396" class="sans ai-does">heuristic pre-critique prompts</text>
  <text x="340" y="412" class="sans tool">Claude · structured prompts</text>
  <text x="650" y="364" class="sans human-owns">Clinical terminology review</text>
  <text x="650" y="380" class="sans human-owns">(heterozygous vs. carrier vs.</text>
  <text x="650" y="396" class="sans human-owns">one copy detected), final copy</text>
  <line x1="60" y1="430" x2="900" y2="430" class="divider"/>

  <!-- Row 5: Ops -->
  <text x="60" y="470" class="serif area">Design Ops</text>
  <text x="340" y="458" class="sans ai-does">Meeting notes auto-draft,</text>
  <text x="340" y="474" class="sans ai-does">research repo tagging + summaries,</text>
  <text x="340" y="490" class="sans ai-does">onboarding doc updates</text>
  <text x="340" y="506" class="sans tool">Claude · Notion AI</text>
  <text x="650" y="458" class="sans human-owns">Decision log confirmation,</text>
  <text x="650" y="474" class="sans human-owns">research taxonomy design,</text>
  <text x="650" y="490" class="sans human-owns">onboarding program structure</text>
  <line x1="60" y1="518" x2="900" y2="518" class="divider"/>

  <!-- Bottom tagline -->
  <text x="480" y="548" class="serif note">approved toolchain: Claude, GitHub Copilot, Whisper — RFC process for additions</text>
</svg>
