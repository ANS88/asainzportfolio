<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 660" width="1360" height="660">
  <defs>
    <style>
      text { font-family: 'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1360" height="660" fill="#ffffff" rx="0"/>

  <!-- Title -->
  <text x="60" y="55" font-size="32" font-weight="700" fill="#1a0a2e" letter-spacing="-0.02em">Design principles</text>
  <text x="60" y="85" font-size="16" fill="#6b5a7d" font-style="italic">Decision filters that governed every design choice in the redesign</text>

  <!-- ===== ROW 1: Cards 1-3 ===== -->

  <!-- Card 1: Scan-first interactions -->
  <rect x="60" y="120" width="393" height="230" rx="12" fill="#ffffff" stroke="#3d1f5c" stroke-width="2"/>
  <!-- Barcode scanner icon -->
  <g transform="translate(350, 140)">
    <rect x="0" y="0" width="28" height="20" rx="3" fill="none" stroke="#b8a0d4" stroke-width="2"/>
    <line x1="6" y1="6" x2="6" y2="14" stroke="#b8a0d4" stroke-width="2"/>
    <line x1="11" y1="4" x2="11" y2="16" stroke="#b8a0d4" stroke-width="1.5"/>
    <line x1="15" y1="6" x2="15" y2="14" stroke="#b8a0d4" stroke-width="2.5"/>
    <line x1="20" y1="4" x2="20" y2="16" stroke="#b8a0d4" stroke-width="1"/>
    <line x1="24" y1="6" x2="24" y2="14" stroke="#b8a0d4" stroke-width="2"/>
    <line x1="-8" y1="10" x2="0" y2="10" stroke="#b8a0d4" stroke-width="2"/>
    <polygon points="-8,6 -8,14 -14,10" fill="#b8a0d4"/>
  </g>
  <circle cx="92" cy="152" r="16" fill="#1a0a2e"/>
  <text x="92" y="158" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="120" y="158" font-size="15" font-weight="700" fill="#1a0a2e">Scan-first interactions</text>
  <line x1="80" y1="174" x2="433" y2="174" stroke="#d4cade" stroke-width="1"/>
  <text x="80" y="198" font-size="12" fill="#6b5a7d">Design to initiate workflows through</text>
  <text x="80" y="216" font-size="12" fill="#6b5a7d">barcode scanning. Minimize manual</text>
  <text x="80" y="234" font-size="12" fill="#6b5a7d">navigation by letting users trigger tasks</text>
  <text x="80" y="252" font-size="12" fill="#6b5a7d">by scanning a sample's barcode.</text>

  <!-- Card 2: Minimize friction between steps -->
  <rect x="483" y="120" width="393" height="230" rx="12" fill="#ffffff" stroke="#3d1f5c" stroke-width="2"/>
  <!-- Flowing arrows icon -->
  <g transform="translate(773, 140)">
    <line x1="0" y1="10" x2="20" y2="10" stroke="#b8a0d4" stroke-width="2"/>
    <polygon points="22,10 16,6 16,14" fill="#b8a0d4"/>
    <line x1="28" y1="10" x2="48" y2="10" stroke="#b8a0d4" stroke-width="2"/>
    <polygon points="50,10 44,6 44,14" fill="#b8a0d4"/>
    <line x1="56" y1="10" x2="76" y2="10" stroke="#b8a0d4" stroke-width="2"/>
    <polygon points="78,10 72,6 72,14" fill="#b8a0d4"/>
  </g>
  <circle cx="515" cy="152" r="16" fill="#1a0a2e"/>
  <text x="515" y="158" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="543" y="158" font-size="15" font-weight="700" fill="#1a0a2e">Minimize friction between steps</text>
  <line x1="503" y1="174" x2="856" y2="174" stroke="#d4cade" stroke-width="1"/>
  <text x="503" y="198" font-size="12" fill="#6b5a7d">Remove unnecessary confirmations and</text>
  <text x="503" y="216" font-size="12" fill="#6b5a7d">modal gatekeepers. Allow users to move</text>
  <text x="503" y="234" font-size="12" fill="#6b5a7d">fluidly between steps without disruptive</text>
  <text x="503" y="252" font-size="12" fill="#6b5a7d">messages.</text>

  <!-- Card 3: Minimize physical interaction -->
  <rect x="906" y="120" width="393" height="230" rx="12" fill="#ffffff" stroke="#3d1f5c" stroke-width="2"/>
  <!-- Hand with stop gesture icon -->
  <g transform="translate(1200, 132)">
    <path d="M14,26 C8,26 4,22 4,16 L4,10 C4,8 5.5,6.5 7,6.5 C8.5,6.5 10,8 10,10 L10,12" fill="none" stroke="#b8a0d4" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="10" y1="6" x2="10" y2="2" stroke="#b8a0d4" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="15" y1="4" x2="15" y2="0" stroke="#b8a0d4" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="5" x2="20" y2="1" stroke="#b8a0d4" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="25" y1="8" x2="25" y2="4" stroke="#b8a0d4" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M25,8 C27,10 28,14 28,16 C28,22 24,26 18,26" fill="none" stroke="#b8a0d4" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <circle cx="938" cy="152" r="16" fill="#1a0a2e"/>
  <text x="938" y="158" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="966" y="158" font-size="15" font-weight="700" fill="#1a0a2e">Minimize physical interaction</text>
  <line x1="926" y1="174" x2="1279" y2="174" stroke="#d4cade" stroke-width="1"/>
  <text x="926" y="198" font-size="12" fill="#6b5a7d">Reduce reliance on clicks and mouse.</text>
  <text x="926" y="216" font-size="12" fill="#6b5a7d">Design for hands-busy environments</text>
  <text x="926" y="234" font-size="12" fill="#6b5a7d">— prioritize keyboard shortcuts,</text>
  <text x="926" y="252" font-size="12" fill="#6b5a7d">scanning, and voice.</text>

  <!-- ===== ROW 2: Cards 4-5 (centered) ===== -->

  <!-- Card 4: Workflow visibility -->
  <rect x="270" y="380" width="393" height="230" rx="12" fill="#ffffff" stroke="#3d1f5c" stroke-width="2"/>
  <!-- Eye / visibility icon -->
  <g transform="translate(560, 398)">
    <path d="M0,12 Q16,-4 32,12 Q16,28 0,12 Z" fill="none" stroke="#b8a0d4" stroke-width="1.8"/>
    <circle cx="16" cy="12" r="5" fill="none" stroke="#b8a0d4" stroke-width="1.8"/>
    <circle cx="16" cy="12" r="2" fill="#b8a0d4"/>
  </g>
  <circle cx="302" cy="412" r="16" fill="#1a0a2e"/>
  <text x="302" y="418" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="330" y="418" font-size="15" font-weight="700" fill="#1a0a2e">Workflow visibility</text>
  <line x1="290" y1="434" x2="643" y2="434" stroke="#d4cade" stroke-width="1"/>
  <text x="290" y="458" font-size="12" fill="#6b5a7d">Incorporate clear, real-time</text>
  <text x="290" y="476" font-size="12" fill="#6b5a7d">visualizations showing where each</text>
  <text x="290" y="494" font-size="12" fill="#6b5a7d">sample or case is in the process.</text>
  <text x="290" y="512" font-size="12" fill="#6b5a7d">Use visual cues and status indicators.</text>

  <!-- Card 5: Automate data entry -->
  <rect x="693" y="380" width="393" height="230" rx="12" fill="#ffffff" stroke="#3d1f5c" stroke-width="2"/>
  <!-- Gear / automation icon -->
  <g transform="translate(983, 396)">
    <circle cx="16" cy="16" r="6" fill="none" stroke="#b8a0d4" stroke-width="1.8"/>
    <line x1="16" y1="0" x2="16" y2="5" stroke="#b8a0d4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="27" x2="16" y2="32" stroke="#b8a0d4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="16" x2="5" y2="16" stroke="#b8a0d4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="27" y1="16" x2="32" y2="16" stroke="#b8a0d4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="4.7" y1="4.7" x2="8.2" y2="8.2" stroke="#b8a0d4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="23.8" y1="23.8" x2="27.3" y2="27.3" stroke="#b8a0d4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="27.3" y1="4.7" x2="23.8" y2="8.2" stroke="#b8a0d4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8.2" y1="23.8" x2="4.7" y2="27.3" stroke="#b8a0d4" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <circle cx="725" cy="412" r="16" fill="#1a0a2e"/>
  <text x="725" y="418" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="753" y="418" font-size="15" font-weight="700" fill="#1a0a2e">Automate data entry</text>
  <line x1="713" y1="434" x2="1066" y2="434" stroke="#d4cade" stroke-width="1"/>
  <text x="713" y="458" font-size="12" fill="#6b5a7d">Eliminate manual inputs where possible.</text>
  <text x="713" y="476" font-size="12" fill="#6b5a7d">Automatically match IDs, populate</text>
  <text x="713" y="494" font-size="12" fill="#6b5a7d">fields, and minimize prompts for user</text>
  <text x="713" y="512" font-size="12" fill="#6b5a7d">choices.</text>

</svg>