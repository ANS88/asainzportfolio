<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 660" width="1360" height="660">
  <defs>
    <style>
      text { font-family: 'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1360" height="660" fill="#ffffff"/>

  <!-- Title -->
  <text x="60" y="55" font-size="32" font-weight="700" fill="#1a0a2e" letter-spacing="-0.02em">Histopathology pipeline, end-to-end</text>
  <text x="60" y="87" font-size="16" fill="#6b5a7d" font-style="italic">From tissue validation through micro dissection &#x2014; with branching logic for slides versus blocks</text>

  <!-- ===== PHASE LABELS ===== -->
  <text x="125" y="138" font-size="11" font-weight="600" fill="#6b5a7d" text-anchor="middle" letter-spacing="0.1em">VALIDATION</text>
  <text x="460" y="138" font-size="11" font-weight="600" fill="#6b5a7d" text-anchor="middle" letter-spacing="0.1em">SECTIONING</text>
  <text x="795" y="138" font-size="11" font-weight="600" fill="#6b5a7d" text-anchor="middle" letter-spacing="0.1em">STAINING</text>
  <text x="995" y="138" font-size="11" font-weight="600" fill="#6b5a7d" text-anchor="middle" letter-spacing="0.1em">PATHOLOGIST REVIEW</text>
  <text x="1205" y="138" font-size="11" font-weight="600" fill="#6b5a7d" text-anchor="middle" letter-spacing="0.1em">MICRO DISSECTION</text>

  <!-- Phase connecting arrows (secondary color) -->
  <line x1="275" y1="138" x2="303" y2="138" stroke="#b8a0d4" stroke-width="1.5"/>
  <polygon points="311,138 303,133 303,143" fill="#b8a0d4"/>

  <line x1="613" y1="138" x2="641" y2="138" stroke="#b8a0d4" stroke-width="1.5"/>
  <polygon points="649,138 641,133 641,143" fill="#b8a0d4"/>

  <line x1="860" y1="138" x2="888" y2="138" stroke="#b8a0d4" stroke-width="1.5"/>
  <polygon points="896,138 888,133 888,143" fill="#b8a0d4"/>

  <line x1="1086" y1="138" x2="1114" y2="138" stroke="#b8a0d4" stroke-width="1.5"/>
  <polygon points="1122,138 1114,133 1114,143" fill="#b8a0d4"/>

  <!-- ===== MAIN FLOW ===== -->

  <!-- Box 1: Validate tissue sample (lavender, major stage) -->
  <rect x="35" y="205" width="180" height="70" rx="12" fill="#f3ecf8" stroke="#3d1f5c" stroke-width="2"/>
  <text x="125" y="244" font-size="14" font-weight="700" fill="#1a0a2e" text-anchor="middle">Validate tissue sample</text>

  <!-- Arrow: Box 1 → Box 2 -->
  <line x1="215" y1="240" x2="228" y2="240" stroke="#1a0a2e" stroke-width="2"/>
  <polygon points="240,240 228,234 228,246" fill="#1a0a2e"/>

  <!-- Box 2: Create tissue sets (white, step) -->
  <rect x="240" y="205" width="155" height="70" rx="8" fill="#ffffff" stroke="#3d1f5c" stroke-width="2"/>
  <text x="318" y="244" font-size="14" font-weight="700" fill="#1a0a2e" text-anchor="middle">Create tissue sets</text>

  <!-- Arrow: Box 2 → Diamond -->
  <line x1="395" y1="240" x2="406" y2="240" stroke="#1a0a2e" stroke-width="2"/>
  <polygon points="418,240 406,234 406,246" fill="#1a0a2e"/>

  <!-- Diamond: Slides or blocks? -->
  <polygon points="460,198 502,240 460,282 418,240" fill="#ffffff" stroke="#3d1f5c" stroke-width="2"/>
  <text x="460" y="235" font-size="12" font-weight="600" fill="#1a0a2e" text-anchor="middle">Slides or</text>
  <text x="460" y="250" font-size="12" font-weight="600" fill="#1a0a2e" text-anchor="middle">blocks?</text>

  <!-- Branch: Diamond → Section slides (top path) -->
  <polyline points="502,240 520,240 520,168" fill="none" stroke="#1a0a2e" stroke-width="2"/>
  <line x1="520" y1="168" x2="528" y2="168" stroke="#1a0a2e" stroke-width="2"/>
  <polygon points="540,168 528,162 528,174" fill="#1a0a2e"/>
  <text x="528" y="202" font-size="11" fill="#6b5a7d" font-style="italic">Slides</text>

  <!-- Branch: Diamond → Section blocks (bottom path) -->
  <polyline points="502,240 520,240 520,315" fill="none" stroke="#1a0a2e" stroke-width="2"/>
  <line x1="520" y1="315" x2="528" y2="315" stroke="#1a0a2e" stroke-width="2"/>
  <polygon points="540,315 528,309 528,321" fill="#1a0a2e"/>
  <text x="528" y="284" font-size="11" fill="#6b5a7d" font-style="italic">Blocks</text>

  <!-- Section slides box (white, step) -->
  <rect x="540" y="142" width="140" height="52" rx="8" fill="#ffffff" stroke="#3d1f5c" stroke-width="2"/>
  <text x="610" y="173" font-size="14" font-weight="700" fill="#1a0a2e" text-anchor="middle">Section slides</text>

  <!-- Section blocks box (white, step) -->
  <rect x="540" y="289" width="140" height="52" rx="8" fill="#ffffff" stroke="#3d1f5c" stroke-width="2"/>
  <text x="610" y="320" font-size="14" font-weight="700" fill="#1a0a2e" text-anchor="middle">Section blocks</text>

  <!-- Rejoin: Section slides → convergence point -->
  <polyline points="680,168 698,168 698,240" fill="none" stroke="#1a0a2e" stroke-width="2"/>

  <!-- Rejoin: Section blocks → convergence point -->
  <polyline points="680,315 698,315 698,240" fill="none" stroke="#1a0a2e" stroke-width="2"/>

  <!-- Arrow: convergence → H&E staining -->
  <line x1="698" y1="240" x2="708" y2="240" stroke="#1a0a2e" stroke-width="2"/>
  <polygon points="720,240 708,234 708,246" fill="#1a0a2e"/>

  <!-- Box 4: H&E staining (white, step) -->
  <rect x="720" y="205" width="150" height="70" rx="8" fill="#ffffff" stroke="#3d1f5c" stroke-width="2"/>
  <text x="795" y="244" font-size="14" font-weight="700" fill="#1a0a2e" text-anchor="middle">H&amp;E staining</text>

  <!-- Arrow: H&E → Pathologist review -->
  <line x1="870" y1="240" x2="898" y2="240" stroke="#1a0a2e" stroke-width="2"/>
  <polygon points="910,240 898,234 898,246" fill="#1a0a2e"/>

  <!-- Box 5: Pathologist review (lavender, major stage) -->
  <rect x="910" y="205" width="170" height="70" rx="12" fill="#f3ecf8" stroke="#3d1f5c" stroke-width="2"/>
  <text x="995" y="244" font-size="14" font-weight="700" fill="#1a0a2e" text-anchor="middle">Pathologist review</text>

  <!-- Arrow: Pathologist review → Micro dissection -->
  <line x1="1080" y1="240" x2="1108" y2="240" stroke="#1a0a2e" stroke-width="2"/>
  <polygon points="1120,240 1108,234 1108,246" fill="#1a0a2e"/>

  <!-- Box 6: Micro dissection (lavender, major stage) -->
  <rect x="1120" y="205" width="170" height="70" rx="12" fill="#f3ecf8" stroke="#3d1f5c" stroke-width="2"/>
  <text x="1205" y="244" font-size="14" font-weight="700" fill="#1a0a2e" text-anchor="middle">Micro dissection</text>

  <!-- ===== SYSTEMS ROW ===== -->
  <text x="45" y="368" font-size="10" font-weight="600" fill="#6b5a7d" letter-spacing="0.08em">SYSTEMS</text>
  <line x1="40" y1="374" x2="1300" y2="374" stroke="#d4cade" stroke-width="1"/>

  <!-- Under Validation: LV -->
  <rect x="108" y="386" width="34" height="22" rx="11" fill="#f3ecf8" stroke="#3d1f5c" stroke-width="1.5"/>
  <text x="125" y="401" font-size="10" font-weight="600" fill="#3d1f5c" text-anchor="middle">LV</text>

  <!-- Under Sectioning: LV -->
  <rect x="443" y="386" width="34" height="22" rx="11" fill="#f3ecf8" stroke="#3d1f5c" stroke-width="1.5"/>
  <text x="460" y="401" font-size="10" font-weight="600" fill="#3d1f5c" text-anchor="middle">LV</text>

  <!-- Under Staining: LV + Philips -->
  <rect x="746" y="386" width="34" height="22" rx="11" fill="#f3ecf8" stroke="#3d1f5c" stroke-width="1.5"/>
  <text x="763" y="401" font-size="10" font-weight="600" fill="#3d1f5c" text-anchor="middle">LV</text>
  <rect x="788" y="386" width="56" height="22" rx="11" fill="#f3ecf8" stroke="#3d1f5c" stroke-width="1.5"/>
  <text x="816" y="401" font-size="10" font-weight="600" fill="#3d1f5c" text-anchor="middle">Philips</text>

  <!-- Under Pathologist Review: LV + Philips -->
  <rect x="946" y="386" width="34" height="22" rx="11" fill="#f3ecf8" stroke="#3d1f5c" stroke-width="1.5"/>
  <text x="963" y="401" font-size="10" font-weight="600" fill="#3d1f5c" text-anchor="middle">LV</text>
  <rect x="988" y="386" width="56" height="22" rx="11" fill="#f3ecf8" stroke="#3d1f5c" stroke-width="1.5"/>
  <text x="1016" y="401" font-size="10" font-weight="600" fill="#3d1f5c" text-anchor="middle">Philips</text>

  <!-- Under Micro Dissection: LV -->
  <rect x="1188" y="386" width="34" height="22" rx="11" fill="#f3ecf8" stroke="#3d1f5c" stroke-width="1.5"/>
  <text x="1205" y="401" font-size="10" font-weight="600" fill="#3d1f5c" text-anchor="middle">LV</text>

  <!-- ===== LEGEND ===== -->
  <line x1="60" y1="445" x2="1300" y2="445" stroke="#d4cade" stroke-width="1"/>

  <text x="60" y="478" font-size="18" font-weight="700" fill="#1a0a2e">What the research surfaced</text>

  <!-- Row 1 -->
  <circle cx="80" cy="518" r="15" fill="#1a0a2e"/>
  <text x="80" y="523" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="108" y="523" font-size="15" fill="#1a0a2e">Manual queue management at every stage</text>

  <circle cx="680" cy="518" r="15" fill="#1a0a2e"/>
  <text x="680" y="523" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="708" y="523" font-size="15" fill="#1a0a2e">Broken Bioanalyzer&#x2013;LabVantage integration</text>

  <!-- Row 2 -->
  <circle cx="80" cy="563" r="15" fill="#1a0a2e"/>
  <text x="80" y="568" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="108" y="568" font-size="15" fill="#1a0a2e">Pathology reports disconnected from cases</text>

  <circle cx="680" cy="563" r="15" fill="#1a0a2e"/>
  <text x="680" y="568" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="708" y="568" font-size="15" fill="#1a0a2e">Tube-label mismatch risk at micro dissection</text>

  <!-- Row 3 -->
  <circle cx="80" cy="608" r="15" fill="#1a0a2e"/>
  <text x="80" y="613" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="108" y="613" font-size="15" fill="#1a0a2e">Historical scanning not standardized</text>
</svg>