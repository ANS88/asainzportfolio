<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="500" fill="#2e1440" rx="16"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#c4a8f0" font-size="16" font-weight="600" letter-spacing="0.1em">TEAM STRUCTURE</text>

  <!-- Design Lead node -->
  <rect x="310" y="70" width="180" height="56" rx="28" fill="#c4a8f0" opacity="0.15" stroke="#c4a8f0" stroke-width="1.5"/>
  <circle cx="360" cy="98" r="14" fill="#c4a8f0" opacity="0.3"/>
  <text x="360" y="103" text-anchor="middle" fill="#c4a8f0" font-size="14">👤</text>
  <text x="415" y="95" fill="#c4a8f0" font-size="12" font-weight="600">Design Lead</text>
  <text x="415" y="110" fill="#b8a9e0" font-size="10" opacity="0.7">Lab Operations</text>

  <!-- Connector lines -->
  <line x1="360" y1="126" x2="220" y2="180" stroke="#4a2d6b" stroke-width="1.5"/>
  <line x1="440" y1="126" x2="580" y2="180" stroke="#4a2d6b" stroke-width="1.5"/>

  <!-- Wet Lab branch -->
  <rect x="100" y="175" width="240" height="44" rx="22" fill="#8a6ebf" opacity="0.12" stroke="#8a6ebf" stroke-width="1"/>
  <text x="220" y="195" text-anchor="middle" fill="#c4a8f0" font-size="13" font-weight="600">🧪  Wet Lab — Execution</text>
  <text x="220" y="210" text-anchor="middle" fill="#b8a9e0" font-size="10" opacity="0.7">Physical sample processing</text>

  <!-- Dry Lab branch -->
  <rect x="460" y="175" width="240" height="44" rx="22" fill="#8a6ebf" opacity="0.12" stroke="#8a6ebf" stroke-width="1"/>
  <text x="580" y="195" text-anchor="middle" fill="#c4a8f0" font-size="13" font-weight="600">🧬  Dry Lab — Analysis</text>
  <text x="580" y="210" text-anchor="middle" fill="#b8a9e0" font-size="10" opacity="0.7">Results &amp; reporting</text>

  <!-- Wet Lab roles -->
  <line x1="160" y1="219" x2="160" y2="255" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="280" y1="219" x2="280" y2="255" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="90" y="255" width="140" height="70" rx="12" fill="#2a1239" stroke="#4a2d6b" stroke-width="1"/>
  <circle cx="120" cy="280" r="10" fill="#c4a8f0" opacity="0.2"/>
  <text x="120" y="284" text-anchor="middle" fill="#c4a8f0" font-size="11">👤</text>
  <text x="170" y="280" fill="#b8a9e0" font-size="11" font-weight="500">Product</text>
  <text x="170" y="295" fill="#b8a9e0" font-size="11" font-weight="500">Designer</text>
  <text x="160" y="315" text-anchor="middle" fill="#7a6aad" font-size="9">Histopathology, QC</text>

  <rect x="248" y="255" width="140" height="70" rx="12" fill="#2a1239" stroke="#4a2d6b" stroke-width="1"/>
  <circle cx="278" cy="280" r="10" fill="#c4a8f0" opacity="0.2"/>
  <text x="278" y="284" text-anchor="middle" fill="#c4a8f0" font-size="11">👤</text>
  <text x="328" y="280" fill="#b8a9e0" font-size="11" font-weight="500">UX</text>
  <text x="328" y="295" fill="#b8a9e0" font-size="11" font-weight="500">Researcher</text>
  <text x="318" y="315" text-anchor="middle" fill="#7a6aad" font-size="9">Ethnography, lab visits</text>

  <!-- Dry Lab roles -->
  <line x1="520" y1="219" x2="520" y2="255" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="640" y1="219" x2="640" y2="255" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="450" y="255" width="140" height="70" rx="12" fill="#2a1239" stroke="#4a2d6b" stroke-width="1"/>
  <circle cx="480" cy="280" r="10" fill="#c4a8f0" opacity="0.2"/>
  <text x="480" y="284" text-anchor="middle" fill="#c4a8f0" font-size="11">👤</text>
  <text x="530" y="280" fill="#b8a9e0" font-size="11" font-weight="500">Product</text>
  <text x="530" y="295" fill="#b8a9e0" font-size="11" font-weight="500">Designer</text>
  <text x="520" y="315" text-anchor="middle" fill="#7a6aad" font-size="9">Clinical Review, Portal</text>

  <rect x="608" y="255" width="140" height="70" rx="12" fill="#2a1239" stroke="#4a2d6b" stroke-width="1"/>
  <circle cx="638" cy="280" r="10" fill="#c4a8f0" opacity="0.2"/>
  <text x="638" y="284" text-anchor="middle" fill="#c4a8f0" font-size="11">👤</text>
  <text x="688" y="280" fill="#b8a9e0" font-size="11" font-weight="500">Content</text>
  <text x="688" y="295" fill="#b8a9e0" font-size="11" font-weight="500">Designer</text>
  <text x="678" y="315" text-anchor="middle" fill="#7a6aad" font-size="9">Reports, patient comms</text>

  <!-- Shared layer -->
  <rect x="150" y="370" width="500" height="50" rx="25" fill="#c4a8f0" opacity="0.06" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="400" y="392" text-anchor="middle" fill="#8a6ebf" font-size="11" font-weight="500">Shared: design system  ·  research ops  ·  critique rituals  ·  cross-domain reviews</text>
  <text x="400" y="408" text-anchor="middle" fill="#7a6aad" font-size="10">Embedded in squads, connected through practice</text>

  <!-- Connection dots from roles to shared layer -->
  <line x1="160" y1="325" x2="250" y2="370" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="318" y1="325" x2="320" y2="370" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="520" y1="325" x2="480" y2="370" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="678" y1="325" x2="550" y2="370" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Caption -->
  <text x="400" y="465" text-anchor="middle" fill="#7a6aad" font-size="10" opacity="0.7">Designers embedded in domain squads, united by shared practice rituals</text>
</svg>
