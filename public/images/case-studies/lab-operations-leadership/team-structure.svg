<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" fill="none">
  <style>
    text { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .lead-title { font-size: 16px; font-weight: 600; fill: #ffffff; text-anchor: middle; letter-spacing: 0.04em; }
    .lead-sub { font-size: 11px; fill: #707078; text-anchor: middle; }
    .domain-label { font-size: 14px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
    .domain-sub { font-size: 10px; fill: #707078; text-anchor: middle; }
    .role-name { font-size: 12px; font-weight: 500; fill: #d0d0d4; text-anchor: middle; }
    .role-focus { font-size: 10px; fill: #707078; text-anchor: middle; }
    .shared-text { font-size: 11px; fill: #888890; text-anchor: middle; letter-spacing: 0.06em; }
    .shared-sub { font-size: 10px; fill: #707078; text-anchor: middle; }
  </style>

  <!-- Design Lead at top -->
  <text x="480" y="52" class="lead-title">Design Lead</text>
  <text x="480" y="72" class="lead-sub">Lab Operations</text>

  <!-- Lines from lead down -->
  <line x1="480" y1="82" x2="480" y2="116" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
  <line x1="480" y1="116" x2="280" y2="116" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
  <line x1="480" y1="116" x2="680" y2="116" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>

  <!-- Wet Lab circle -->
  <circle cx="280" cy="240" r="130" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>

  <line x1="280" y1="116" x2="280" y2="148" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
  <text x="280" y="172" class="domain-label">Wet Lab</text>
  <text x="280" y="190" class="domain-sub">Physical sample processing</text>

  <!-- Wet Lab roles -->
  <circle cx="230" cy="240" r="3" fill="#ffffff" opacity="0.2"/>
  <text x="230" y="264" class="role-name">Product Designer</text>
  <text x="230" y="280" class="role-focus">Histopathology, QC</text>

  <circle cx="330" cy="280" r="3" fill="#ffffff" opacity="0.2"/>
  <text x="330" y="304" class="role-name">UX Researcher</text>
  <text x="330" y="320" class="role-focus">Ethnography, lab visits</text>

  <!-- Dry Lab circle -->
  <circle cx="680" cy="240" r="150" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>

  <line x1="680" y1="116" x2="680" y2="148" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
  <text x="680" y="172" class="domain-label">Dry Lab</text>
  <text x="680" y="190" class="domain-sub">Results &amp; reporting</text>

  <!-- Dry Lab roles -->
  <circle cx="610" cy="236" r="3" fill="#ffffff" opacity="0.2"/>
  <text x="610" y="260" class="role-name">Product Designer</text>
  <text x="610" y="276" class="role-focus">Clinical Review, Portal</text>

  <circle cx="700" cy="266" r="3" fill="#ffffff" opacity="0.2"/>
  <text x="700" y="290" class="role-name">UX Designer</text>
  <text x="700" y="306" class="role-focus">Workflows, usability</text>

  <circle cx="770" cy="236" r="3" fill="#ffffff" opacity="0.2"/>
  <text x="770" y="260" class="role-name">Content Designer</text>
  <text x="770" y="276" class="role-focus">Reports, patient comms</text>

  <!-- Shared practice layer -->
  <line x1="120" y1="430" x2="840" y2="430" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>

  <!-- Connectors from roles to shared layer -->
  <line x1="230" y1="282" x2="300" y2="430" stroke="#ffffff" stroke-width="0.5" opacity="0.05" stroke-dasharray="2 4"/>
  <line x1="330" y1="322" x2="380" y2="430" stroke="#ffffff" stroke-width="0.5" opacity="0.05" stroke-dasharray="2 4"/>
  <line x1="610" y1="278" x2="540" y2="430" stroke="#ffffff" stroke-width="0.5" opacity="0.05" stroke-dasharray="2 4"/>
  <line x1="700" y1="308" x2="600" y2="430" stroke="#ffffff" stroke-width="0.5" opacity="0.05" stroke-dasharray="2 4"/>
  <line x1="770" y1="278" x2="660" y2="430" stroke="#ffffff" stroke-width="0.5" opacity="0.05" stroke-dasharray="2 4"/>

  <text x="480" y="456" class="shared-text">design system · research ops · critique rituals · cross-domain reviews</text>
  <text x="480" y="476" class="shared-sub">Embedded in squads, connected through practice</text>

  <text x="480" y="510" class="shared-sub" opacity="0.4">Designers embedded in domain squads, united by shared practice rituals</text>
</svg>