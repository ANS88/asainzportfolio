<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="520" fill="#2e1440" rx="16"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#c4a8f0" font-size="14" font-weight="600" letter-spacing="0.1em">TEAM STRUCTURE</text>

  <!-- ====== Design Lead node ====== -->
  <rect x="295" y="60" width="210" height="64" rx="32" fill="#c4a8f0" opacity="0.12" stroke="#c4a8f0" stroke-width="1.5"/>
  <!-- Portrait: curly hair, smile -->
  <g transform="translate(340, 92)">
    <ellipse cx="0" cy="0" rx="10" ry="12" fill="none" stroke="#c4a8f0" stroke-width="1.3"/>
    <path d="M-10 -5 Q-10 -16 -4 -16 Q0 -18 4 -16 Q10 -16 10 -5" fill="none" stroke="#c4a8f0" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="-3" cy="-2" r="1.2" fill="#c4a8f0"/>
    <circle cx="3" cy="-2" r="1.2" fill="#c4a8f0"/>
    <path d="M-3 5 Q0 8 3 5" fill="none" stroke="#c4a8f0" stroke-width="1" stroke-linecap="round"/>
  </g>
  <text x="415" y="88" fill="#c4a8f0" font-size="12" font-weight="600">Design Lead</text>
  <text x="415" y="103" fill="#b8a9e0" font-size="10" opacity="0.7">Lab Operations</text>

  <!-- Connector lines -->
  <path d="M350 124 Q300 150 220 180" stroke="#4a2d6b" stroke-width="1.5" fill="none"/>
  <path d="M450 124 Q500 150 580 180" stroke="#4a2d6b" stroke-width="1.5" fill="none"/>

  <!-- ====== Wet Lab branch ====== -->
  <rect x="95" y="180" width="250" height="42" rx="21" fill="#8a6ebf" opacity="0.12" stroke="#8a6ebf" stroke-width="1"/>
  <!-- Test tube icon - hand drawn -->
  <g transform="translate(130, 196)">
    <path d="M-4 -6 L-4 4 Q-4 8 0 8 Q4 8 4 4 L4 -6" fill="none" stroke="#c4a8f0" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="-6" y1="-6" x2="6" y2="-6" stroke="#c4a8f0" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M-3 2 Q0 4 3 2" fill="none" stroke="#c4a8f0" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  </g>
  <text x="230" y="198" text-anchor="middle" fill="#c4a8f0" font-size="12" font-weight="600">Wet Lab — Execution</text>
  <text x="230" y="213" text-anchor="middle" fill="#b8a9e0" font-size="9" opacity="0.7">Physical sample processing</text>

  <!-- ====== Dry Lab branch ====== -->
  <rect x="455" y="180" width="250" height="42" rx="21" fill="#8a6ebf" opacity="0.12" stroke="#8a6ebf" stroke-width="1"/>
  <!-- DNA icon - hand drawn -->
  <g transform="translate(490, 196)">
    <path d="M-4 -7 Q4 -3 -4 1 Q4 5 -4 9" fill="none" stroke="#c4a8f0" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M4 -7 Q-4 -3 4 1 Q-4 5 4 9" fill="none" stroke="#c4a8f0" stroke-width="1.1" stroke-linecap="round"/>
  </g>
  <text x="590" y="198" text-anchor="middle" fill="#c4a8f0" font-size="12" font-weight="600">Dry Lab — Analysis</text>
  <text x="590" y="213" text-anchor="middle" fill="#b8a9e0" font-size="9" opacity="0.7">Results &amp; reporting</text>

  <!-- Dashed lines to role cards -->
  <line x1="160" y1="222" x2="160" y2="260" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="280" y1="222" x2="280" y2="260" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="520" y1="222" x2="520" y2="260" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="640" y1="222" x2="640" y2="260" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ====== Wet Lab roles ====== -->
  <!-- Product Designer card -->
  <rect x="90" y="260" width="140" height="80" rx="12" fill="#2a1239" stroke="#4a2d6b" stroke-width="1"/>
  <!-- Portrait: short hair, focused -->
  <g transform="translate(120, 284)">
    <ellipse cx="0" cy="0" rx="8" ry="10" fill="none" stroke="#c4a8f0" stroke-width="1.2"/>
    <path d="M-8 -4 Q-8 -14 0 -14 Q8 -14 8 -4" fill="none" stroke="#c4a8f0" stroke-width="1.1" stroke-linecap="round"/>
    <circle cx="-3" cy="-2" r="1" fill="#c4a8f0"/>
    <circle cx="3" cy="-2" r="1" fill="#c4a8f0"/>
    <path d="M-2 4 Q0 6 2 4" fill="none" stroke="#c4a8f0" stroke-width="0.9" stroke-linecap="round"/>
  </g>
  <text x="170" y="280" fill="#b8a9e0" font-size="11" font-weight="500">Product</text>
  <text x="170" y="295" fill="#b8a9e0" font-size="11" font-weight="500">Designer</text>
  <text x="160" y="330" text-anchor="middle" fill="#7a6aad" font-size="9">Histopathology, QC</text>

  <!-- UX Researcher card -->
  <rect x="248" y="260" width="140" height="80" rx="12" fill="#2a1239" stroke="#4a2d6b" stroke-width="1"/>
  <!-- Portrait: bun, glasses -->
  <g transform="translate(278, 284)">
    <ellipse cx="0" cy="0" rx="8" ry="10" fill="none" stroke="#c4a8f0" stroke-width="1.2"/>
    <circle cx="-1" cy="-14" r="4" fill="none" stroke="#c4a8f0" stroke-width="1" stroke-linecap="round"/>
    <path d="M-8 -4 Q-7 -10 -1 -10" fill="none" stroke="#c4a8f0" stroke-width="1" stroke-linecap="round"/>
    <path d="M8 -4 Q7 -10 1 -10" fill="none" stroke="#c4a8f0" stroke-width="1" stroke-linecap="round"/>
    <circle cx="-3" cy="-2" r="3" fill="none" stroke="#c4a8f0" stroke-width="0.8" opacity="0.7"/>
    <circle cx="3" cy="-2" r="3" fill="none" stroke="#c4a8f0" stroke-width="0.8" opacity="0.7"/>
    <circle cx="-3" cy="-2" r="1" fill="#c4a8f0"/>
    <circle cx="3" cy="-2" r="1" fill="#c4a8f0"/>
    <path d="M-2 5 Q0 7 2 5" fill="none" stroke="#c4a8f0" stroke-width="0.9" stroke-linecap="round"/>
  </g>
  <text x="328" y="280" fill="#b8a9e0" font-size="11" font-weight="500">UX</text>
  <text x="328" y="295" fill="#b8a9e0" font-size="11" font-weight="500">Researcher</text>
  <text x="318" y="330" text-anchor="middle" fill="#7a6aad" font-size="9">Ethnography, lab visits</text>

  <!-- ====== Dry Lab roles ====== -->
  <!-- Product Designer card -->
  <rect x="450" y="260" width="140" height="80" rx="12" fill="#2a1239" stroke="#4a2d6b" stroke-width="1"/>
  <!-- Portrait: wavy hair -->
  <g transform="translate(480, 284)">
    <ellipse cx="0" cy="0" rx="8" ry="10" fill="none" stroke="#c4a8f0" stroke-width="1.2"/>
    <path d="M-8 -4 Q-10 -14 -4 -14 Q0 -16 4 -14 Q10 -14 8 -4" fill="none" stroke="#c4a8f0" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M-8 -4 Q-10 4 -9 8" fill="none" stroke="#c4a8f0" stroke-width="1" stroke-linecap="round"/>
    <path d="M8 -4 Q10 4 9 8" fill="none" stroke="#c4a8f0" stroke-width="1" stroke-linecap="round"/>
    <circle cx="-3" cy="-2" r="1" fill="#c4a8f0"/>
    <circle cx="3" cy="-2" r="1" fill="#c4a8f0"/>
    <path d="M-2 4 Q0 6 2 4" fill="none" stroke="#c4a8f0" stroke-width="0.9" stroke-linecap="round"/>
  </g>
  <text x="530" y="280" fill="#b8a9e0" font-size="11" font-weight="500">Product</text>
  <text x="530" y="295" fill="#b8a9e0" font-size="11" font-weight="500">Designer</text>
  <text x="520" y="330" text-anchor="middle" fill="#7a6aad" font-size="9">Clinical Review, Portal</text>

  <!-- Content Designer card -->
  <rect x="608" y="260" width="140" height="80" rx="12" fill="#2a1239" stroke="#4a2d6b" stroke-width="1"/>
  <!-- Portrait: neat hair, collar -->
  <g transform="translate(638, 284)">
    <ellipse cx="0" cy="0" rx="8" ry="10" fill="none" stroke="#c4a8f0" stroke-width="1.2"/>
    <path d="M-7 -6 Q-6 -14 0 -15 Q6 -14 7 -6" fill="none" stroke="#c4a8f0" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M-4 -15 Q-2 -18 0 -15" fill="none" stroke="#c4a8f0" stroke-width="0.9" stroke-linecap="round"/>
    <circle cx="-3" cy="-2" r="1" fill="#c4a8f0"/>
    <circle cx="3" cy="-2" r="1" fill="#c4a8f0"/>
    <path d="M-2 4 Q0 7 2 4" fill="none" stroke="#c4a8f0" stroke-width="0.9" stroke-linecap="round"/>
  </g>
  <text x="688" y="280" fill="#b8a9e0" font-size="11" font-weight="500">Content</text>
  <text x="688" y="295" fill="#b8a9e0" font-size="11" font-weight="500">Designer</text>
  <text x="678" y="330" text-anchor="middle" fill="#7a6aad" font-size="9">Reports, patient comms</text>

  <!-- Dashed lines to shared layer -->
  <line x1="160" y1="340" x2="250" y2="390" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="318" y1="340" x2="320" y2="390" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="520" y1="340" x2="480" y2="390" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="678" y1="340" x2="550" y2="390" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Shared layer -->
  <rect x="150" y="390" width="500" height="50" rx="25" fill="#c4a8f0" opacity="0.06" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="400" y="412" text-anchor="middle" fill="#8a6ebf" font-size="11" font-weight="500">Shared: design system  ·  research ops  ·  critique rituals  ·  cross-domain reviews</text>
  <text x="400" y="428" text-anchor="middle" fill="#7a6aad" font-size="10">Embedded in squads, connected through practice</text>

  <!-- Caption -->
  <text x="400" y="485" text-anchor="middle" fill="#7a6aad" font-size="10" opacity="0.7">Designers embedded in domain squads, united by shared practice rituals</text>
</svg>
