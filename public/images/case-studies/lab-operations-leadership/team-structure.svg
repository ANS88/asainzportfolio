<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="500" fill="#2e1440" rx="16"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#c4a8f0" font-size="14" font-weight="600" letter-spacing="0.1em">TEAM STRUCTURE</text>

  <!-- ====== Design Lead ====== -->
  <rect x="300" y="60" width="200" height="56" rx="28" fill="#c4a8f0" opacity="0.12" stroke="#c4a8f0" stroke-width="1.5"/>
  <!-- Silhouette -->
  <g transform="translate(345, 88)">
    <circle cx="0" cy="-6" r="7" fill="#c4a8f0" opacity="0.25"/>
    <path d="M-10 12 Q-8 2 0 0 Q8 2 10 12" fill="#c4a8f0" opacity="0.25"/>
  </g>
  <text x="420" y="85" fill="#c4a8f0" font-size="12" font-weight="600">Design Lead</text>
  <text x="420" y="100" fill="#b8a9e0" font-size="10" opacity="0.7">Lab Operations</text>

  <!-- Connectors -->
  <path d="M360 116 Q320 145 220 175" stroke="#4a2d6b" stroke-width="1.5" fill="none"/>
  <path d="M440 116 Q480 145 580 175" stroke="#4a2d6b" stroke-width="1.5" fill="none"/>

  <!-- ====== Wet Lab ====== -->
  <rect x="100" y="175" width="240" height="40" rx="20" fill="#8a6ebf" opacity="0.12" stroke="#8a6ebf" stroke-width="1"/>
  <text x="220" y="194" text-anchor="middle" fill="#c4a8f0" font-size="12" font-weight="600">Wet Lab — Execution</text>
  <text x="220" y="208" text-anchor="middle" fill="#b8a9e0" font-size="9" opacity="0.7">Physical sample processing</text>

  <!-- ====== Dry Lab ====== -->
  <rect x="460" y="175" width="240" height="40" rx="20" fill="#8a6ebf" opacity="0.12" stroke="#8a6ebf" stroke-width="1"/>
  <text x="580" y="194" text-anchor="middle" fill="#c4a8f0" font-size="12" font-weight="600">Dry Lab — Analysis</text>
  <text x="580" y="208" text-anchor="middle" fill="#b8a9e0" font-size="9" opacity="0.7">Results &amp; reporting</text>

  <!-- Dashed connectors -->
  <line x1="160" y1="215" x2="160" y2="248" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="280" y1="215" x2="280" y2="248" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="520" y1="215" x2="520" y2="248" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="640" y1="215" x2="640" y2="248" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ====== Role cards ====== -->
  <!-- Product Designer (wet) -->
  <rect x="92" y="248" width="136" height="72" rx="12" fill="#2a1239" stroke="#4a2d6b" stroke-width="1"/>
  <g transform="translate(122, 274)">
    <circle cx="0" cy="-4" r="6" fill="#c4a8f0" opacity="0.2"/>
    <path d="M-8 10 Q-6 2 0 0 Q6 2 8 10" fill="#c4a8f0" opacity="0.2"/>
  </g>
  <text x="170" y="273" fill="#b8a9e0" font-size="11" font-weight="500">Product</text>
  <text x="170" y="287" fill="#b8a9e0" font-size="11" font-weight="500">Designer</text>
  <text x="160" y="310" text-anchor="middle" fill="#7a6aad" font-size="9">Histopathology, QC</text>

  <!-- UX Researcher -->
  <rect x="248" y="248" width="136" height="72" rx="12" fill="#2a1239" stroke="#4a2d6b" stroke-width="1"/>
  <g transform="translate(278, 274)">
    <circle cx="0" cy="-4" r="6" fill="#c4a8f0" opacity="0.2"/>
    <path d="M-8 10 Q-6 2 0 0 Q6 2 8 10" fill="#c4a8f0" opacity="0.2"/>
  </g>
  <text x="326" y="273" fill="#b8a9e0" font-size="11" font-weight="500">UX</text>
  <text x="326" y="287" fill="#b8a9e0" font-size="11" font-weight="500">Researcher</text>
  <text x="316" y="310" text-anchor="middle" fill="#7a6aad" font-size="9">Ethnography, lab visits</text>

  <!-- Product Designer (dry) -->
  <rect x="452" y="248" width="136" height="72" rx="12" fill="#2a1239" stroke="#4a2d6b" stroke-width="1"/>
  <g transform="translate(482, 274)">
    <circle cx="0" cy="-4" r="6" fill="#c4a8f0" opacity="0.2"/>
    <path d="M-8 10 Q-6 2 0 0 Q6 2 8 10" fill="#c4a8f0" opacity="0.2"/>
  </g>
  <text x="530" y="273" fill="#b8a9e0" font-size="11" font-weight="500">Product</text>
  <text x="530" y="287" fill="#b8a9e0" font-size="11" font-weight="500">Designer</text>
  <text x="520" y="310" text-anchor="middle" fill="#7a6aad" font-size="9">Clinical Review, Portal</text>

  <!-- Content Designer -->
  <rect x="608" y="248" width="136" height="72" rx="12" fill="#2a1239" stroke="#4a2d6b" stroke-width="1"/>
  <g transform="translate(638, 274)">
    <circle cx="0" cy="-4" r="6" fill="#c4a8f0" opacity="0.2"/>
    <path d="M-8 10 Q-6 2 0 0 Q6 2 8 10" fill="#c4a8f0" opacity="0.2"/>
  </g>
  <text x="686" y="273" fill="#b8a9e0" font-size="11" font-weight="500">Content</text>
  <text x="686" y="287" fill="#b8a9e0" font-size="11" font-weight="500">Designer</text>
  <text x="676" y="310" text-anchor="middle" fill="#7a6aad" font-size="9">Reports, patient comms</text>

  <!-- Dashed lines to shared layer -->
  <line x1="160" y1="320" x2="250" y2="365" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="316" y1="320" x2="320" y2="365" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="520" y1="320" x2="480" y2="365" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="676" y1="320" x2="550" y2="365" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Shared layer -->
  <rect x="150" y="365" width="500" height="50" rx="25" fill="#c4a8f0" opacity="0.06" stroke="#4a2d6b" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="400" y="387" text-anchor="middle" fill="#8a6ebf" font-size="11" font-weight="500">Shared: design system  ·  research ops  ·  critique rituals  ·  cross-domain reviews</text>
  <text x="400" y="403" text-anchor="middle" fill="#7a6aad" font-size="10">Embedded in squads, connected through practice</text>

  <!-- Caption -->
  <text x="400" y="455" text-anchor="middle" fill="#7a6aad" font-size="10" opacity="0.7">Designers embedded in domain squads, united by shared practice rituals</text>
</svg>
