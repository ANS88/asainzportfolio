<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" fill="none">
  <style>
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
    .sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .title { font-size: 28px; font-weight: 400; fill: #ffffff; text-anchor: middle; }
    .sub { font-size: 12px; font-weight: 400; fill: #777; text-anchor: middle; letter-spacing: 0.08em; text-transform: uppercase; }
    .domain { font-size: 22px; font-weight: 400; fill: #ffffff; text-anchor: middle; }
    .domain-sub { font-size: 11px; fill: #666; text-anchor: middle; letter-spacing: 0.05em; text-transform: uppercase; }
    .role { font-size: 13px; font-weight: 500; fill: #ccc; text-anchor: middle; }
    .focus { font-size: 11px; fill: #777; text-anchor: middle; }
    .shared { font-size: 12px; fill: #888; text-anchor: middle; letter-spacing: 0.04em; }
    .shared-sub { font-size: 11px; fill: #666; text-anchor: middle; font-style: italic; }
  </style>

  <!-- Subtle dot texture -->
  <circle cx="120" cy="80" r="1.5" fill="#ffffff" opacity="0.04"/>
  <circle cx="340" cy="460" r="1.5" fill="#ffffff" opacity="0.04"/>
  <circle cx="780" cy="90" r="1.5" fill="#ffffff" opacity="0.04"/>
  <circle cx="620" cy="450" r="1.5" fill="#ffffff" opacity="0.04"/>
  <circle cx="150" cy="380" r="1.5" fill="#ffffff" opacity="0.04"/>
  <circle cx="860" cy="320" r="1.5" fill="#ffffff" opacity="0.04"/>

  <!-- Design Lead -->
  <text x="480" y="46" class="serif title">Design Lead</text>
  <text x="480" y="68" class="sans sub">Lab Operations</text>

  <!-- Connector down -->
  <path d="M480,76 C477,92 483,108 479,120" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.25" stroke-linecap="round"/>
  <!-- Branch left -->
  <path d="M479,120 C440,122 380,118 280,121" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.2" stroke-linecap="round"/>
  <!-- Branch right -->
  <path d="M479,120 C520,118 600,122 680,119" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.2" stroke-linecap="round"/>

  <!-- Wet Lab - wobbly organic blob -->
  <path d="M280,108 C355,96 425,155 418,240 C411,325 345,380 262,374 C179,368 135,298 144,225 C153,152 205,118 280,108Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.12" stroke-linecap="round"/>

  <path d="M280,121 C278,134 282,146 279,155" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.2" stroke-linecap="round"/>
  <text x="280" y="180" class="serif domain">Wet Lab</text>
  <text x="280" y="198" class="sans domain-sub">Physical sample processing</text>

  <!-- Wet Lab roles -->
  <g transform="translate(225, 245) rotate(-1.5)">
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" opacity="0.15"/>
    <text x="0" y="22" class="sans role">Product Designer</text>
    <text x="0" y="38" class="sans focus">Histopathology, QC</text>
  </g>

  <g transform="translate(335, 285) rotate(1)">
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" opacity="0.15"/>
    <text x="0" y="22" class="sans role">UX Researcher</text>
    <text x="0" y="38" class="sans focus">Ethnography, lab visits</text>
  </g>

  <!-- Dry Lab - wobbly organic blob -->
  <path d="M680,98 C770,88 842,155 837,248 C832,341 762,398 668,392 C574,386 522,312 532,228 C542,144 592,108 680,98Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.12" stroke-linecap="round"/>

  <path d="M680,119 C678,132 682,144 679,155" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.2" stroke-linecap="round"/>
  <text x="680" y="180" class="serif domain">Dry Lab</text>
  <text x="680" y="198" class="sans domain-sub">Results &amp; reporting</text>

  <!-- Dry Lab roles -->
  <g transform="translate(608, 238) rotate(1.2)">
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" opacity="0.15"/>
    <text x="0" y="22" class="sans role">Product Designer</text>
    <text x="0" y="38" class="sans focus">Clinical Review, Portal</text>
  </g>

  <g transform="translate(700, 268) rotate(-0.8)">
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" opacity="0.15"/>
    <text x="0" y="22" class="sans role">UX Designer</text>
    <text x="0" y="38" class="sans focus">Workflows, usability</text>
  </g>

  <g transform="translate(775, 238) rotate(0.6)">
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" opacity="0.15"/>
    <text x="0" y="22" class="sans role">Content Designer</text>
    <text x="0" y="38" class="sans focus">Reports, patient comms</text>
  </g>

  <!-- Dashed connectors to shared layer -->
  <path d="M225,305 C230,360 270,400 315,430" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.12" stroke-linecap="round" stroke-dasharray="3 5"/>
  <path d="M335,325 C338,368 358,400 398,430" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.12" stroke-linecap="round" stroke-dasharray="3 5"/>
  <path d="M608,278 C605,338 578,400 548,430" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.12" stroke-linecap="round" stroke-dasharray="3 5"/>
  <path d="M700,308 C698,358 668,400 628,430" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.12" stroke-linecap="round" stroke-dasharray="3 5"/>
  <path d="M775,278 C772,338 728,400 688,430" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.12" stroke-linecap="round" stroke-dasharray="3 5"/>

  <!-- Shared practice - wobbly line -->
  <path d="M130,432 C240,426 370,438 480,430 C590,422 710,438 830,432" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.15" stroke-linecap="round"/>

  <text x="480" y="460" class="sans shared">design system  ·  research ops  ·  critique rituals  ·  cross-domain reviews</text>
  <text x="480" y="482" class="serif shared-sub">embedded in squads, connected through practice</text>

  <text x="480" y="510" class="sans focus" opacity="0.35">designers embedded in domain squads, united by shared practice rituals</text>
</svg>