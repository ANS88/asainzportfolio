<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" fill="none">
  <style>
    text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .title { font-size: 13px; font-weight: 600; fill: #c4a8f0; letter-spacing: 0.1em; text-anchor: middle; }
    .lead-title { font-size: 13px; font-weight: 700; fill: #c4a8f0; text-anchor: middle; }
    .lead-sub { font-size: 11px; fill: #8a6ebf; text-anchor: middle; }
    .domain-label { font-size: 13px; font-weight: 700; fill: #c4a8f0; text-anchor: middle; }
    .domain-sub { font-size: 10px; fill: #8a6ebf; text-anchor: middle; }
    .role-title { font-size: 12px; font-weight: 600; fill: #b8a9e0; text-anchor: middle; }
    .role-focus { font-size: 10px; fill: #7a6aad; text-anchor: middle; }
    .shared-label { font-size: 11px; font-weight: 500; fill: #8a6ebf; text-anchor: middle; }
    .shared-sub { font-size: 10px; fill: #7a6aad; text-anchor: middle; }
    .connector { stroke: #4a2d6b; stroke-width: 1.5; fill: none; }
    .connector-dash { stroke: #4a2d6b; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
  </style>

  <!-- ===== Design Lead (top) ===== -->
  <rect x="360" y="30" width="240" height="52" rx="26" fill="#c4a8f0" opacity="0.12" stroke="#c4a8f0" stroke-width="1.5"/>
  <text x="480" y="54" class="lead-title">Design Lead</text>
  <text x="480" y="70" class="lead-sub">Lab Operations</text>

  <!-- Connector lines from lead to domains -->
  <line x1="400" y1="82" x2="260" y2="130" class="connector"/>
  <line x1="560" y1="82" x2="700" y2="130" class="connector"/>

  <!-- ===== Wet Lab domain ===== -->
  <rect x="120" y="130" width="280" height="44" rx="22" fill="#8a6ebf" opacity="0.1" stroke="#8a6ebf" stroke-width="1"/>
  <text x="260" y="151" class="domain-label">Wet Lab</text>
  <text x="260" y="165" class="domain-sub">Physical sample processing</text>

  <!-- ===== Dry Lab domain ===== -->
  <rect x="560" y="130" width="280" height="44" rx="22" fill="#8a6ebf" opacity="0.1" stroke="#8a6ebf" stroke-width="1"/>
  <text x="700" y="151" class="domain-label">Dry Lab</text>
  <text x="700" y="165" class="domain-sub">Results &amp; reporting</text>

  <!-- Dashed connectors to role cards -->
  <line x1="180" y1="174" x2="180" y2="212" class="connector-dash"/>
  <line x1="340" y1="174" x2="340" y2="212" class="connector-dash"/>
  <line x1="620" y1="174" x2="620" y2="212" class="connector-dash"/>
  <line x1="780" y1="174" x2="780" y2="212" class="connector-dash"/>

  <!-- ===== Role cards ===== -->
  <!-- Card 1: Product Designer (Wet) -->
  <rect x="100" y="212" width="160" height="80" rx="10" fill="#2a1239" stroke="#3a1d5b" stroke-width="1"/>
  <text x="180" y="244" class="role-title">Product Designer</text>
  <text x="180" y="276" class="role-focus">Histopathology, QC</text>

  <!-- Card 2: UX Researcher -->
  <rect x="260" y="212" width="160" height="80" rx="10" fill="#2a1239" stroke="#3a1d5b" stroke-width="1"/>
  <text x="340" y="244" class="role-title">UX Researcher</text>
  <text x="340" y="276" class="role-focus">Ethnography, lab visits</text>

  <!-- Card 3: Product Designer (Dry) -->
  <rect x="540" y="212" width="160" height="80" rx="10" fill="#2a1239" stroke="#3a1d5b" stroke-width="1"/>
  <text x="620" y="244" class="role-title">Product Designer</text>
  <text x="620" y="276" class="role-focus">Clinical Review, Portal</text>

  <!-- Card 4: Content Designer -->
  <rect x="700" y="212" width="160" height="80" rx="10" fill="#2a1239" stroke="#3a1d5b" stroke-width="1"/>
  <text x="780" y="244" class="role-title">Content Designer</text>
  <text x="780" y="276" class="role-focus">Reports, patient comms</text>

  <!-- Dashed lines to shared layer -->
  <line x1="180" y1="292" x2="300" y2="340" class="connector-dash" opacity="0.5"/>
  <line x1="340" y1="292" x2="400" y2="340" class="connector-dash" opacity="0.5"/>
  <line x1="620" y1="292" x2="560" y2="340" class="connector-dash" opacity="0.5"/>
  <line x1="780" y1="292" x2="660" y2="340" class="connector-dash" opacity="0.5"/>

  <!-- ===== Shared layer ===== -->
  <rect x="180" y="340" width="600" height="52" rx="26" fill="#c4a8f0" opacity="0.06" stroke="#3a1d5b" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="480" y="363" class="shared-label">design system  ·  research ops  ·  critique rituals  ·  cross-domain reviews</text>
  <text x="480" y="380" class="shared-sub">Embedded in squads, connected through practice</text>

  <!-- Caption -->
  <text x="480" y="430" class="shared-sub" opacity="0.7">Designers embedded in domain squads, united by shared practice rituals</text>
</svg>
