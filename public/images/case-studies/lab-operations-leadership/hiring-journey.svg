<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" fill="none">
  <style>
    text { font-family: 'Caveat', 'Segoe Script', 'Bradley Hand', 'Marker Felt', cursive; }
    .phase-num { font-size: 56px; font-weight: 700; fill: #ffffff; opacity: 0.08; }
    .phase-name { font-size: 20px; font-weight: 700; fill: #ffffff; }
    .phase-sub { font-size: 14px; fill: #888; }
    .detail { font-size: 14px; fill: #aaa; }
    .note { font-size: 14px; fill: #666; text-anchor: middle; }
  </style>

  <!-- Wobbly connecting path -->
  <path d="M115,200 C180,185 240,215 320,195 C400,175 440,210 530,200 C620,190 660,215 750,195 C800,185 840,200 880,195" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.18" stroke-linecap="round"/>

  <!-- Phase 1: Solo -->
  <text x="55" y="140" class="phase-num">1</text>
  <!-- Sketchy circle -->
  <path d="M120,175 C145,168 152,185 148,205 C144,225 125,235 108,228 C91,221 85,200 92,185 C99,170 115,172 120,175Z" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35" stroke-linecap="round"/>
  <circle cx="118" cy="200" r="4" fill="#ffffff" opacity="0.3"/>
  <text x="78" y="264" class="phase-name">Solo</text>
  <text x="78" y="284" class="phase-sub">ship &amp; learn</text>
  <path d="M76,292 C100,290 140,294 168,291" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2" stroke-linecap="round"/>
  <text x="78" y="314" class="detail">Audit the landscape</text>
  <text x="78" y="336" class="detail">Build credibility</text>
  <text x="78" y="358" class="detail">Define the gaps</text>

  <!-- Phase 2: First Hires -->
  <text x="295" y="120" class="phase-num">2</text>
  <path d="M380,170 C415,162 430,182 426,210 C422,238 395,252 370,244 C345,236 335,210 342,188 C349,166 375,168 380,170Z" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35" stroke-linecap="round"/>
  <circle cx="370" cy="198" r="4" fill="#ffffff" opacity="0.3"/>
  <circle cx="390" cy="208" r="4" fill="#ffffff" opacity="0.3"/>
  <text x="338" y="275" class="phase-name">First Hires</text>
  <text x="338" y="295" class="phase-sub">split the domains</text>
  <path d="M336,303 C370,300 420,304 448,301" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2" stroke-linecap="round"/>
  <text x="338" y="324" class="detail">Hire for domain fit</text>
  <text x="338" y="346" class="detail">Embed in squads</text>
  <text x="338" y="368" class="detail">Establish rituals</text>

  <!-- Phase 3: Practice -->
  <text x="565" y="108" class="phase-num">3</text>
  <path d="M660,160 C705,150 725,178 720,215 C715,252 685,272 652,265 C619,258 605,225 612,192 C619,159 650,155 660,160Z" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35" stroke-linecap="round"/>
  <circle cx="640" cy="198" r="4" fill="#ffffff" opacity="0.3"/>
  <circle cx="660" cy="212" r="4" fill="#ffffff" opacity="0.3"/>
  <circle cx="680" cy="198" r="4" fill="#ffffff" opacity="0.3"/>
  <circle cx="650" cy="225" r="4" fill="#ffffff" opacity="0.3"/>
  <circle cx="672" cy="228" r="4" fill="#ffffff" opacity="0.3"/>
  <text x="618" y="290" class="phase-name">Practice</text>
  <text x="618" y="310" class="phase-sub">compound &amp; scale</text>
  <path d="M616,318 C650,315 700,319 728,316" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2" stroke-linecap="round"/>
  <text x="618" y="338" class="detail">Add research capacity</text>
  <text x="618" y="360" class="detail">Cross-pollinate domains</text>
  <text x="618" y="382" class="detail">Design influences roadmap</text>

  <!-- Phase 4: Growing (faded) -->
  <text x="830" y="108" class="phase-num" opacity="0.04">4</text>
  <path d="M880,155 C920,150 940,190 935,225 C930,260 905,285 875,280 C845,275 830,240 835,205 C840,170 865,155 880,155Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.15" stroke-linecap="round" stroke-dasharray="6 8"/>
  <text x="848" y="280" class="phase-name" opacity="0.25">Growing...</text>

  <!-- Bottom note -->
  <text x="480" y="425" class="note">every hire shipped within their first month</text>
</svg>