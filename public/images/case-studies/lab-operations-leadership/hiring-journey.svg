<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="340" fill="#2e1440" rx="16"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#c4a8f0" font-size="16" font-weight="600" letter-spacing="0.1em">GROWING THE PRACTICE</text>

  <!-- Timeline line -->
  <line x1="100" y1="160" x2="700" y2="160" stroke="#4a2d6b" stroke-width="2"/>

  <!-- Phase 1: Solo -->
  <circle cx="150" cy="160" r="24" fill="#c4a8f0" opacity="0.12" stroke="#c4a8f0" stroke-width="1.5"/>
  <text x="150" y="155" text-anchor="middle" fill="#c4a8f0" font-size="20">🙋</text>
  <text x="150" y="175" text-anchor="middle" fill="#c4a8f0" font-size="9" font-weight="600">1</text>
  <text x="150" y="110" text-anchor="middle" fill="#c4a8f0" font-size="12" font-weight="600">Solo</text>
  <text x="150" y="125" text-anchor="middle" fill="#b8a9e0" font-size="10" opacity="0.7">Ship &amp; learn</text>
  <text x="150" y="205" text-anchor="middle" fill="#7a6aad" font-size="9">Audit the landscape</text>
  <text x="150" y="218" text-anchor="middle" fill="#7a6aad" font-size="9">Build credibility</text>
  <text x="150" y="231" text-anchor="middle" fill="#7a6aad" font-size="9">Define the gaps</text>

  <!-- Arrow -->
  <text x="250" y="165" text-anchor="middle" fill="#4a2d6b" font-size="18">→</text>

  <!-- Phase 2: First hires -->
  <circle cx="350" cy="160" r="24" fill="#c4a8f0" opacity="0.12" stroke="#c4a8f0" stroke-width="1.5"/>
  <text x="340" y="155" text-anchor="middle" fill="#c4a8f0" font-size="16">🙋🙋</text>
  <text x="350" y="175" text-anchor="middle" fill="#c4a8f0" font-size="9" font-weight="600">2-3</text>
  <text x="350" y="110" text-anchor="middle" fill="#c4a8f0" font-size="12" font-weight="600">First hires</text>
  <text x="350" y="125" text-anchor="middle" fill="#b8a9e0" font-size="10" opacity="0.7">Split the domains</text>
  <text x="350" y="205" text-anchor="middle" fill="#7a6aad" font-size="9">Hire for domain fit</text>
  <text x="350" y="218" text-anchor="middle" fill="#7a6aad" font-size="9">Embed in squads</text>
  <text x="350" y="231" text-anchor="middle" fill="#7a6aad" font-size="9">Establish rituals</text>

  <!-- Arrow -->
  <text x="450" y="165" text-anchor="middle" fill="#4a2d6b" font-size="18">→</text>

  <!-- Phase 3: Practice -->
  <circle cx="550" cy="160" r="24" fill="#c4a8f0" opacity="0.12" stroke="#c4a8f0" stroke-width="1.5"/>
  <text x="535" y="155" text-anchor="middle" fill="#c4a8f0" font-size="14">🙋🙋🙋</text>
  <text x="550" y="175" text-anchor="middle" fill="#c4a8f0" font-size="9" font-weight="600">4+</text>
  <text x="550" y="110" text-anchor="middle" fill="#c4a8f0" font-size="12" font-weight="600">Practice</text>
  <text x="550" y="125" text-anchor="middle" fill="#b8a9e0" font-size="10" opacity="0.7">Compound &amp; scale</text>
  <text x="550" y="205" text-anchor="middle" fill="#7a6aad" font-size="9">Add research capacity</text>
  <text x="550" y="218" text-anchor="middle" fill="#7a6aad" font-size="9">Cross-pollinate domains</text>
  <text x="550" y="231" text-anchor="middle" fill="#7a6aad" font-size="9">Design influences roadmap</text>

  <!-- Arrow -->
  <text x="645" y="165" text-anchor="middle" fill="#4a2d6b" font-size="18">→</text>

  <!-- Phase 4: Ongoing -->
  <circle cx="700" cy="160" r="20" fill="#c4a8f0" opacity="0.08" stroke="#c4a8f0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="700" y="165" text-anchor="middle" fill="#c4a8f0" font-size="16">🚀</text>
  <text x="700" y="110" text-anchor="middle" fill="#8a6ebf" font-size="11" font-weight="500">Growing</text>

  <!-- Bottom note -->
  <rect x="180" y="275" width="440" height="36" rx="18" fill="#c4a8f0" opacity="0.06" stroke="#4a2d6b" stroke-width="1"/>
  <text x="400" y="298" text-anchor="middle" fill="#8a6ebf" font-size="11">Every hire shipped within their first month — learning by doing, not onboarding decks</text>
</svg>
