<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="380" fill="#2e1440" rx="16"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#c4a8f0" font-size="14" font-weight="600" letter-spacing="0.1em">GROWING THE PRACTICE</text>

  <!-- Timeline -->
  <line x1="80" y1="195" x2="720" y2="195" stroke="#4a2d6b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ====== Phase 1: Solo ====== -->
  <!-- Single person silhouette -->
  <g transform="translate(140, 148)">
    <circle cx="0" cy="-14" r="9" fill="#c4a8f0" opacity="0.18"/>
    <path d="M-14 18 Q-12 4 0 2 Q12 4 14 18" fill="#c4a8f0" opacity="0.18"/>
    <!-- Curly hair hint -->
    <path d="M-7 -20 Q-3 -26 3 -24 Q8 -22 7 -18" fill="none" stroke="#c4a8f0" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  </g>
  <text x="140" y="76" text-anchor="middle" fill="#c4a8f0" font-size="13" font-weight="600">Solo</text>
  <text x="140" y="90" text-anchor="middle" fill="#b8a9e0" font-size="10" opacity="0.7">Ship &amp; learn</text>
  <circle cx="140" cy="195" r="4" fill="#c4a8f0" opacity="0.4"/>
  <text x="140" y="222" text-anchor="middle" fill="#7a6aad" font-size="9">Audit the landscape</text>
  <text x="140" y="236" text-anchor="middle" fill="#7a6aad" font-size="9">Build credibility</text>
  <text x="140" y="250" text-anchor="middle" fill="#7a6aad" font-size="9">Define the gaps</text>

  <!-- Arrow 1 -->
  <path d="M240 190 L248 195 L240 200" stroke="#4a2d6b" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- ====== Phase 2: First hires ====== -->
  <!-- Two people -->
  <g transform="translate(310, 148)">
    <!-- Person 1 -->
    <circle cx="-14" cy="-14" r="8" fill="#c4a8f0" opacity="0.18"/>
    <path d="M-26 18 Q-24 4 -14 2 Q-4 4 -2 18" fill="#c4a8f0" opacity="0.18"/>
    <!-- Straight hair -->
    <path d="M-22 -16 Q-22 -24 -14 -24 Q-6 -24 -6 -16" fill="none" stroke="#c4a8f0" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <!-- Person 2 -->
    <circle cx="14" cy="-14" r="8" fill="#c4a8f0" opacity="0.18"/>
    <path d="M2 18 Q4 4 14 2 Q24 4 26 18" fill="#c4a8f0" opacity="0.18"/>
    <!-- Short wavy hair -->
    <path d="M7 -18 Q10 -25 14 -24 Q18 -25 21 -18" fill="none" stroke="#c4a8f0" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  </g>
  <text x="310" y="76" text-anchor="middle" fill="#c4a8f0" font-size="13" font-weight="600">First hires</text>
  <text x="310" y="90" text-anchor="middle" fill="#b8a9e0" font-size="10" opacity="0.7">Split the domains</text>
  <circle cx="310" cy="195" r="4" fill="#c4a8f0" opacity="0.4"/>
  <text x="310" y="222" text-anchor="middle" fill="#7a6aad" font-size="9">Hire for domain fit</text>
  <text x="310" y="236" text-anchor="middle" fill="#7a6aad" font-size="9">Embed in squads</text>
  <text x="310" y="250" text-anchor="middle" fill="#7a6aad" font-size="9">Establish rituals</text>

  <!-- Arrow 2 -->
  <path d="M410 190 L418 195 L410 200" stroke="#4a2d6b" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- ====== Phase 3: Practice ====== -->
  <!-- Four people -->
  <g transform="translate(530, 148)">
    <!-- Person 1 -->
    <circle cx="-36" cy="-14" r="7" fill="#c4a8f0" opacity="0.18"/>
    <path d="M-46 18 Q-44 6 -36 4 Q-28 6 -26 18" fill="#c4a8f0" opacity="0.18"/>
    <path d="M-42 -17 Q-36 -24 -30 -17" fill="none" stroke="#c4a8f0" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <!-- Person 2 -->
    <circle cx="-12" cy="-14" r="7" fill="#c4a8f0" opacity="0.18"/>
    <path d="M-22 18 Q-20 6 -12 4 Q-4 6 -2 18" fill="#c4a8f0" opacity="0.18"/>
    <!-- Bun -->
    <circle cx="-12" cy="-24" r="3.5" fill="none" stroke="#c4a8f0" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <!-- Person 3 -->
    <circle cx="12" cy="-14" r="7" fill="#c4a8f0" opacity="0.18"/>
    <path d="M2 18 Q4 6 12 4 Q20 6 22 18" fill="#c4a8f0" opacity="0.18"/>
    <path d="M5 -17 Q12 -24 19 -17" fill="none" stroke="#c4a8f0" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <!-- Person 4 -->
    <circle cx="36" cy="-14" r="7" fill="#c4a8f0" opacity="0.18"/>
    <path d="M26 18 Q28 6 36 4 Q44 6 46 18" fill="#c4a8f0" opacity="0.18"/>
    <path d="M29 -18 Q33 -26 36 -24 Q39 -26 43 -18" fill="none" stroke="#c4a8f0" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  </g>
  <text x="530" y="76" text-anchor="middle" fill="#c4a8f0" font-size="13" font-weight="600">Practice</text>
  <text x="530" y="90" text-anchor="middle" fill="#b8a9e0" font-size="10" opacity="0.7">Compound &amp; scale</text>
  <circle cx="530" cy="195" r="4" fill="#c4a8f0" opacity="0.4"/>
  <text x="530" y="222" text-anchor="middle" fill="#7a6aad" font-size="9">Add research capacity</text>
  <text x="530" y="236" text-anchor="middle" fill="#7a6aad" font-size="9">Cross-pollinate domains</text>
  <text x="530" y="250" text-anchor="middle" fill="#7a6aad" font-size="9">Design influences roadmap</text>

  <!-- Arrow 3 -->
  <path d="M630 190 L638 195 L630 200" stroke="#4a2d6b" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- ====== Phase 4: Growing ====== -->
  <g transform="translate(700, 150)">
    <!-- Upward arrow -->
    <line x1="0" y1="16" x2="0" y2="-8" stroke="#c4a8f0" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
    <path d="M-6 -2 L0 -10 L6 -2" fill="none" stroke="#c4a8f0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
    <!-- Small dots -->
    <circle cx="-10" cy="2" r="2" fill="#c4a8f0" opacity="0.15"/>
    <circle cx="10" cy="-4" r="1.5" fill="#c4a8f0" opacity="0.12"/>
    <circle cx="8" cy="10" r="1" fill="#c4a8f0" opacity="0.1"/>
  </g>
  <text x="700" y="80" text-anchor="middle" fill="#8a6ebf" font-size="12" font-weight="500">Growing</text>
  <circle cx="700" cy="195" r="4" fill="#c4a8f0" opacity="0.2" stroke="#c4a8f0" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Bottom note -->
  <rect x="180" y="285" width="440" height="36" rx="18" fill="#c4a8f0" opacity="0.06" stroke="#4a2d6b" stroke-width="1"/>
  <text x="400" y="308" text-anchor="middle" fill="#8a6ebf" font-size="11">Every hire shipped within their first month — learning by doing, not onboarding decks</text>
</svg>
