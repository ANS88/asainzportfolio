<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" fill="none">
  <style>
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
    .sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .phase-num { font-size: 64px; font-weight: 400; fill: #ffffff; opacity: 0.06; }
    .phase-name { font-size: 22px; font-weight: 400; fill: #ffffff; }
    .phase-sub { font-size: 11px; fill: #777; letter-spacing: 0.06em; text-transform: uppercase; }
    .detail { font-size: 13px; fill: #aaa; }
    .note { font-size: 12px; fill: #666; text-anchor: middle; font-style: italic; }
  </style>

  <!-- Dot texture -->
  <circle cx="200" cy="100" r="1.5" fill="#ffffff" opacity="0.04"/>
  <circle cx="500" cy="380" r="1.5" fill="#ffffff" opacity="0.04"/>
  <circle cx="750" cy="130" r="1.5" fill="#ffffff" opacity="0.04"/>
  <circle cx="900" cy="350" r="1.5" fill="#ffffff" opacity="0.04"/>

  <!-- Wobbly connecting path -->
  <path d="M115,200 C175,188 235,212 320,196 C405,180 445,208 530,198 C615,188 660,212 750,194 C800,186 845,198 885,193" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.15" stroke-linecap="round"/>

  <!-- Phase 1: Solo -->
  <text x="52" y="142" class="serif phase-num">1</text>
  <path d="M122,174 C148,166 156,186 151,208 C146,230 126,240 108,232 C90,224 82,202 90,186 C98,170 116,170 122,174Z" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.3" stroke-linecap="round"/>
  <circle cx="118" cy="200" r="3.5" fill="#ffffff" opacity="0.25"/>

  <g transform="translate(0, 0) rotate(-0.5, 78, 270)">
    <text x="78" y="268" class="serif phase-name">Solo</text>
    <text x="78" y="286" class="sans phase-sub">Ship &amp; learn</text>
  </g>
  <path d="M76,294 C105,291 145,295 172,292" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.18" stroke-linecap="round"/>
  <text x="78" y="316" class="sans detail">Audit the landscape</text>
  <text x="78" y="338" class="sans detail">Build credibility</text>
  <text x="78" y="360" class="sans detail">Define the gaps</text>

  <!-- Phase 2: First Hires -->
  <text x="292" y="120" class="serif phase-num">2</text>
  <path d="M382,168 C418,160 434,182 428,212 C422,242 394,256 368,248 C342,240 332,212 340,188 C348,164 376,164 382,168Z" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.3" stroke-linecap="round"/>
  <circle cx="370" cy="198" r="3.5" fill="#ffffff" opacity="0.25"/>
  <circle cx="392" cy="210" r="3.5" fill="#ffffff" opacity="0.25"/>

  <g transform="rotate(0.8, 338, 280)">
    <text x="338" y="278" class="serif phase-name">First Hires</text>
    <text x="338" y="296" class="sans phase-sub">Split the domains</text>
  </g>
  <path d="M336,304 C375,301 425,305 453,302" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.18" stroke-linecap="round"/>
  <text x="338" y="326" class="sans detail">Hire for domain fit</text>
  <text x="338" y="348" class="sans detail">Embed in squads</text>
  <text x="338" y="370" class="sans detail">Establish rituals</text>

  <!-- Phase 3: Practice -->
  <text x="562" y="108" class="serif phase-num">3</text>
  <path d="M662,158 C708,148 728,178 722,218 C716,258 688,278 652,270 C616,262 602,228 610,192 C618,156 652,152 662,158Z" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.3" stroke-linecap="round"/>
  <circle cx="640" cy="196" r="3.5" fill="#ffffff" opacity="0.25"/>
  <circle cx="662" cy="212" r="3.5" fill="#ffffff" opacity="0.25"/>
  <circle cx="682" cy="198" r="3.5" fill="#ffffff" opacity="0.25"/>
  <circle cx="648" cy="228" r="3.5" fill="#ffffff" opacity="0.25"/>
  <circle cx="674" cy="230" r="3.5" fill="#ffffff" opacity="0.25"/>

  <g transform="rotate(-0.6, 618, 294)">
    <text x="618" y="294" class="serif phase-name">Practice</text>
    <text x="618" y="312" class="sans phase-sub">Compound &amp; scale</text>
  </g>
  <path d="M616,320 C655,317 705,321 733,318" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.18" stroke-linecap="round"/>
  <text x="618" y="342" class="sans detail">Add research capacity</text>
  <text x="618" y="364" class="sans detail">Cross-pollinate domains</text>
  <text x="618" y="386" class="sans detail">Design influences roadmap</text>

  <!-- Phase 4: Growing (faded) -->
  <text x="828" y="108" class="serif phase-num" opacity="0.03">4</text>
  <path d="M882,154 C922,148 944,190 938,228 C932,266 906,290 876,284 C846,278 828,242 834,206 C840,170 868,154 882,154Z" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.1" stroke-linecap="round" stroke-dasharray="5 7"/>
  <text x="848" y="282" class="serif phase-name" opacity="0.2">Growing...</text>

  <!-- Bottom note -->
  <path d="M200,405 C320,400 460,410 600,404 C700,400 760,406 800,403" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1" stroke-linecap="round"/>
  <text x="480" y="428" class="serif note">every hire shipped within their first month</text>
</svg>