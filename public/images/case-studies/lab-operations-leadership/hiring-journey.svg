<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" fill="none">
  <style>
    text { font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif; }
    .phase-num { font-size: 64px; font-weight: 700; fill: #ffffff; opacity: 0.06; }
    .phase-name { font-size: 16px; font-weight: 600; fill: #ffffff; }
    .phase-sub { font-size: 11px; fill: #707078; }
    .detail { font-size: 11px; fill: #888890; }
    .note { font-size: 11px; fill: #707078; text-anchor: middle; }
  </style>

  <!-- Connecting line -->
  <line x1="120" y1="200" x2="860" y2="200" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>

  <!-- Phase 1: Solo -->
  <text x="60" y="140" class="phase-num">1</text>
  <circle cx="120" cy="200" r="24" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <circle cx="120" cy="200" r="4" fill="#ffffff" opacity="0.3"/>
  <text x="80" y="256" class="phase-name">Solo</text>
  <text x="80" y="274" class="phase-sub">Ship &amp; learn</text>
  <line x1="80" y1="286" x2="170" y2="286" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <text x="80" y="308" class="detail">Audit the landscape</text>
  <text x="80" y="326" class="detail">Build credibility</text>
  <text x="80" y="344" class="detail">Define the gaps</text>

  <!-- Phase 2: First Hires -->
  <text x="300" y="120" class="phase-num">2</text>
  <circle cx="380" cy="200" r="36" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <circle cx="372" cy="196" r="4" fill="#ffffff" opacity="0.3"/>
  <circle cx="388" cy="204" r="4" fill="#ffffff" opacity="0.3"/>
  <text x="338" y="256" class="phase-name">First Hires</text>
  <text x="338" y="274" class="phase-sub">Split the domains</text>
  <line x1="338" y1="286" x2="440" y2="286" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <text x="338" y="308" class="detail">Hire for domain fit</text>
  <text x="338" y="326" class="detail">Embed in squads</text>
  <text x="338" y="344" class="detail">Establish rituals</text>

  <!-- Phase 3: Practice -->
  <text x="560" y="110" class="phase-num">3</text>
  <circle cx="660" cy="200" r="52" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <circle cx="642" cy="190" r="4" fill="#ffffff" opacity="0.3"/>
  <circle cx="660" cy="206" r="4" fill="#ffffff" opacity="0.3"/>
  <circle cx="678" cy="190" r="4" fill="#ffffff" opacity="0.3"/>
  <circle cx="650" cy="210" r="4" fill="#ffffff" opacity="0.3"/>
  <circle cx="672" cy="210" r="4" fill="#ffffff" opacity="0.3"/>
  <text x="620" y="272" class="phase-name">Practice</text>
  <text x="620" y="290" class="phase-sub">Compound &amp; scale</text>
  <line x1="620" y1="302" x2="720" y2="302" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <text x="620" y="324" class="detail">Add research capacity</text>
  <text x="620" y="342" class="detail">Cross-pollinate domains</text>
  <text x="620" y="360" class="detail">Design influences roadmap</text>

  <!-- Phase 4: Growing (faded) -->
  <text x="830" y="110" class="phase-num" opacity="0.03">4</text>
  <circle cx="880" cy="200" r="64" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.06" stroke-dasharray="4 6"/>
  <text x="852" y="272" class="phase-name" opacity="0.3">Growing</text>
  <text x="852" y="290" class="phase-sub" opacity="0.2">Expanding scope</text>

  <!-- Bottom note -->
  <text x="480" y="420" class="note">Every hire shipped within their first month — learning by doing, not onboarding decks</text>
</svg>