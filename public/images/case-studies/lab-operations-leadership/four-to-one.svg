<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" fill="none">
  <style>
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
    .sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .legacy { font-size: 14px; font-weight: 400; fill: #999; }
    .legacy-sub { font-size: 11px; fill: #555; }
    .legacy-pain { font-size: 10px; fill: #664444; font-style: italic; }
    .unified { font-size: 22px; font-weight: 400; fill: #ffffff; }
    .unified-sub { font-size: 12px; fill: #888; }
    .result { font-size: 32px; font-weight: 400; fill: #ffffff; }
    .result-label { font-size: 11px; fill: #666; letter-spacing: 0.06em; text-transform: uppercase; }
    .reframe { font-size: 13px; fill: #aaa; }
    .reframe-sub { font-size: 11px; fill: #666; }
    .note { font-size: 12px; fill: #555; text-anchor: middle; font-style: italic; }
  </style>

  <!-- Dot texture -->
  <circle cx="100" cy="40" r="1.5" fill="#ffffff" opacity="0.04"/>
  <circle cx="860" cy="60" r="1.5" fill="#ffffff" opacity="0.04"/>

  <!-- Legacy systems (left) -->
  <path d="M68,44 C72,40 252,39 256,44 C260,48 262,98 256,102 C250,106 74,107 68,102 C62,97 64,48 68,44Z" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15" stroke-linecap="round"/>
  <text x="84" y="66" class="sans legacy">Variant review tool</text>
  <text x="84" y="82" class="sans legacy-sub">Pathogenicity classification UI</text>
  <text x="84" y="96" class="sans legacy-pain">Copy patient ID to clipboard →</text>

  <path d="M68,122 C72,118 252,117 256,122 C260,126 262,176 256,180 C250,184 74,185 68,180 C62,175 64,126 68,122Z" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15" stroke-linecap="round"/>
  <text x="84" y="144" class="sans legacy">Report generation system</text>
  <text x="84" y="160" class="sans legacy-sub">Clinical report templating</text>
  <text x="84" y="174" class="sans legacy-pain">Paste patient ID, re-enter context →</text>

  <path d="M68,200 C72,196 252,195 256,200 C260,204 262,254 256,258 C250,262 74,263 68,258 C62,253 64,204 68,200Z" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15" stroke-linecap="round"/>
  <text x="84" y="222" class="sans legacy">QC dashboard</text>
  <text x="84" y="238" class="sans legacy-sub">Pipeline metrics, batch status</text>
  <text x="84" y="252" class="sans legacy-pain">Different login, no shared state →</text>

  <path d="M68,278 C72,274 252,273 256,278 C260,282 262,332 256,336 C250,340 74,341 68,336 C62,331 64,282 68,278Z" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15" stroke-linecap="round"/>
  <text x="84" y="300" class="sans legacy">Lab tracking spreadsheet</text>
  <text x="84" y="316" class="sans legacy-sub">Manual case tracking in Excel</text>
  <text x="84" y="330" class="sans legacy-pain">Version conflicts, no audit trail</text>

  <!-- Arrows converging -->
  <path d="M264,72 C300,78 340,120 380,155" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.18" stroke-linecap="round"/>
  <path d="M264,150 C300,158 340,168 380,180" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.18" stroke-linecap="round"/>
  <path d="M264,228 C300,225 340,218 380,210" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.18" stroke-linecap="round"/>
  <path d="M264,306 C300,298 340,268 380,240" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.18" stroke-linecap="round"/>

  <!-- Unified system -->
  <path d="M395,100 C400,94 660,92 665,100 C670,108 674,290 665,298 C656,306 404,308 395,298 C386,288 390,106 395,100Z" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.25" stroke-linecap="round"/>

  <text x="420" y="144" class="serif unified">Clinical Review</text>
  <text x="420" y="166" class="sans unified-sub">Variant review + report gen + QC + tracking</text>
  <text x="420" y="184" class="sans unified-sub">One view per case, one context, one login</text>

  <path d="M418,196 C445,194 550,198 630,194" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" stroke-linecap="round"/>

  <text x="420" y="228" class="serif result">50%</text>
  <text x="420" y="248" class="sans result-label">Faster turnaround</text>

  <text x="560" y="228" class="serif result">88</text>
  <text x="560" y="248" class="sans result-label">SUS score</text>

  <text x="420" y="286" class="sans unified-sub">3.5M+ tests reported/year · 3 divisions · 15 user roles</text>

  <!-- Right side: the reframe -->
  <text x="720" y="130" class="serif" style="font-size:16px;fill:#ffffff">The reframe</text>
  <path d="M718,138 C750,136 830,140 870,137" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" stroke-linecap="round"/>

  <text x="720" y="166" class="sans reframe">Came in as:</text>
  <text x="720" y="184" class="sans reframe-sub">"Improve the variant review UI"</text>

  <text x="720" y="216" class="sans reframe">Reframed to:</text>
  <text x="720" y="234" class="sans reframe-sub">Distributed cognition problem —</text>
  <text x="720" y="250" class="sans reframe-sub">4 tools, context fragmented,</text>
  <text x="720" y="266" class="sans reframe-sub">patient IDs copy-pasted between</text>
  <text x="720" y="282" class="sans reframe-sub">tabs per case</text>

  <text x="720" y="314" class="sans reframe">Method:</text>
  <text x="720" y="332" class="sans reframe-sub">Contextual inquiry, 2,000+ hrs</text>
  <text x="720" y="348" class="sans reframe-sub">accumulated observation</text>

  <!-- Bottom note -->
  <path d="M200,388 C320,384 460,392 600,386 C720,382 800,388 840,385" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1" stroke-linecap="round"/>
  <text x="480" y="412" class="serif note">clinical scientists were switching between 4 applications per case, mentally stitching context</text>
</svg>
