<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>femswarm Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #F1F2F6;
  --surface: #FFFFFF;
  --sunk: #E6E8EF;
  --ink: #1C1F2E;
  --muted: #5B6078;
  --line: #D9DBE5;
  --ok: #2E7D4F;
  --warn: #A65B00;
  --display: "Gloock", "Iowan Old Style", Georgia, serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --tint: 100%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #12141C; --surface: #1A1D28; --sunk: #232735; --ink: #E8E9F0;
    --muted: #9CA1B8; --line: #2C3040; --ok: #6FCF97; --warn: #F2B35B; --tint: 55%;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #12141C; --surface: #1A1D28; --sunk: #232735; --ink: #E8E9F0;
  --muted: #9CA1B8; --line: #2C3040; --ok: #6FCF97; --warn: #F2B35B; --tint: 55%;
}
* { box-sizing: border-box; }
body {
  background: var(--ground); color: var(--ink); font: 15px/1.55 var(--body);
  padding-inline: 16px; padding-block: 0 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ac, var(--ink)); outline-offset: 2px; }
/* each agent's accent: her own color in light mode, lifted toward white in dark mode */
[data-agent] { --ac: color-mix(in oklab, var(--c) var(--tint), #FFFFFF); }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; padding-block: 28px 20px; }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 { font: 400 40px/1 var(--display); margin: 0; letter-spacing: -0.01em; }
.brand p { margin: 0; color: var(--muted); }
.brand em { font-style: italic; color: var(--ink); }
.stamp { font: 12px/1.4 var(--mono); color: var(--muted); }

/* the line-up */
.lineup { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.desk > *, .find, .find * { min-width: 0; overflow-wrap: anywhere; }
.agent {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 14px; padding: 0; text-align: left; cursor: pointer; overflow: hidden;
  display: flex; flex-direction: column; font: inherit; transition: transform .15s ease, border-color .15s ease;
}
.agent:hover { transform: translateY(-2px); border-color: var(--ac); }
.agent[aria-pressed="true"] { border-color: var(--ac); box-shadow: 0 0 0 2px var(--ac); }
.agent .portrait { display: block; aspect-ratio: 1; width: 100%; max-width: 100%; }
.agent .portrait svg { display: block; width: 100%; height: 100%; }
.agent .who { padding: 10px 12px 12px; display: grid; gap: 2px; }
.agent .name { font: 400 22px/1.1 var(--display); color: var(--ac); }
.agent .role { font-size: 13px; color: var(--muted); }
.agent .meta { display: flex; align-items: center; gap: 6px; font: 12px/1.3 var(--mono); color: var(--muted); margin-top: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.warn { background: var(--warn); }
.dot.idle { background: var(--line); }

/* the desk */
.desk { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 28px; margin-top: 28px; align-items: start; }
.profile { display: grid; gap: 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.id { display: grid; grid-template-columns: 88px 1fr; gap: 14px; align-items: center; }
.id .face { width: 88px; height: 88px; border-radius: 50%; overflow: hidden; border: 3px solid var(--ac); }
.id .face svg { width: 100%; height: 100%; display: block; }
.id h2 { font: 400 32px/1 var(--display); margin: 0; color: var(--ac); }
.id .role { color: var(--muted); font-size: 14px; }
.namesake { margin: 0; font-size: 14px; color: var(--muted); }
.namesake b { color: var(--ink); font-weight: 600; }
.letter { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 16px 16px 16px; padding: 16px 18px; }
.letter .label { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ac); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
.letter .label span:last-child { color: var(--muted); }
.letter p { margin: 0; font-size: 15.5px; }
.letter.greeting p { font-style: italic; color: var(--muted); }
details.about { font-size: 14px; color: var(--muted); }
details.about summary { cursor: pointer; color: var(--ink); font-weight: 500; }
details.about p { margin: 8px 0 0; }
.panel-title { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.history svg { width: 100%; height: auto; display: block; }
.history .legend { display: flex; gap: 14px; font: 11px/1 var(--mono); color: var(--muted); margin-top: 6px; }
.history .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.problem { font-size: 13px; color: var(--warn); margin: 8px 0 0; }

/* roundup (Wells) */
.roundup { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
.roundup section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.roundup h3 { font: 400 20px/1.2 var(--display); margin: 0 0 10px; }
.roundup ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 14px; }
.roundup .caveat { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
.team { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.team .chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
.team .chip span.mini { width: 26px; height: 26px; border-radius: 50%; overflow: hidden; display: block; }
.team .chip svg { width: 100%; height: 100%; display: block; }
.team .chip b { font: 500 13px var(--mono); color: var(--ac); }

/* finds */
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.tools h3 { font: 400 26px/1 var(--display); margin: 0 auto 0 0; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; }
.seg button { appearance: none; border: 0; background: none; font: 500 13px var(--body); color: var(--muted); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tools select, .tools input { font: 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.tools input { width: 200px; max-width: 100%; }
.finds { display: grid; gap: 12px; }
.find { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 8px; }
.find .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 12.5px; color: var(--muted); }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.pips i.on { background: var(--ac); }
.find .by { display: inline-flex; align-items: center; gap: 6px; color: var(--ac); font-weight: 600; }
.find .by span.mini { width: 20px; height: 20px; border-radius: 50%; overflow: hidden; display: block; }
.find .by svg { width: 100%; height: 100%; display: block; }
.find h4 { margin: 0; font: 600 16.5px/1.35 var(--body); text-wrap: balance; }
.find h4 a { text-decoration: none; }
.find h4 a:hover { text-decoration: underline; text-decoration-color: var(--ac); text-underline-offset: 3px; }
.find p { margin: 0; max-width: 72ch; }
.find .why { color: var(--muted); font-size: 14px; }
.find .why b { color: var(--ink); font-weight: 600; }
.flag { font: 500 11px/1 var(--mono); padding: 4px 7px; border-radius: 5px; background: var(--sunk); color: var(--ink); }
.flag.caution { background: color-mix(in oklab, var(--warn) 18%, transparent); color: var(--warn); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font: 11px/1 var(--mono); color: var(--muted); }
.tags span::before { content: "#"; opacity: .6; }
.status { font: 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.empty { padding: 28px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.num { font-variant-numeric: tabular-nums; }
footer { margin-top: 40px; font-size: 12px; color: var(--muted); }

@media (max-width: 900px) {
  .desk { grid-template-columns: minmax(0, 1fr); }
  .profile { position: static; }
  .roundup { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .lineup { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .agent { flex-direction: row; align-items: center; }
  .agent .portrait { width: 64px; flex: none; }
  .agent .who { padding: 8px 12px; }
  .agent .meta { margin-top: 2px; }
  .brand h1 { font-size: 32px; }
}
@media (prefers-reduced-motion: reduce) { .agent { transition: none; } .agent:hover { transform: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>femswarm</h1>
      <p>The research desk behind <em>Women's Health, Computed</em></p>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>
  <nav class="lineup" id="lineup" aria-label="Agents"></nav>
  <main class="desk" id="desk"></main>
  <footer id="foot"></footer>
</div>

<script>
const DATA = {"built": "2026-10-05", "agents": {"trota": {"name": "Trota", "role": "Literature", "namesake": "Trota of Salerno, 12th-century physician whose texts on women's medicine were copied across Europe for centuries", "color": "#8E2F3C", "greeting": "I have read the week's journals and preprints. Here is what holds up.", "personality": "A physician and teacher first. Patient, exact, and quietly unimpressed by hype. She has spent a lifetime watching women's complaints go unrecorded, so she notices what a study leaves out as much as what it finds. She respects a good randomized trial and says plainly when evidence is thin, early, or not yet peer reviewed.", "how i write to adriana": "Like a trusted senior colleague handing over a reading list. Warm but brief. Points to the one or two papers most worth her time and says why in plain words. Names the weak spots (small samples, preprints, missing abstracts) without lecturing.", "avatar": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\" role=\"img\" aria-label=\"Portrait of Trota\">\n<title>Portrait of Trota<\/title>\n<rect width=\"200\" height=\"200\" fill=\"#F3DDE0\"/>\n\n<path d=\"M28 200 C32 162 64 146 100 146 C136 146 168 162 172 200 Z\" fill=\"#6E2330\"/>\n<path d=\"M46 108 C40 44 160 44 154 108 L166 200 L34 200 Z\" fill=\"#8E2F3C\"/>\n<path d=\"M60 96 C58 50 142 50 140 96 L142 150 C128 164 72 164 58 150 Z\" fill=\"#F4EEE4\"/>\n<rect x=\"88\" y=\"112\" width=\"24\" height=\"36\" rx=\"10\" fill=\"#B7825A\"/>\n<ellipse cx=\"100\" cy=\"94\" rx=\"31\" ry=\"37\" fill=\"#D9A77C\"/>\n<path d=\"M84 86 q6 -4 12 -1 M104 85 q6 -3 12 1\" stroke=\"#2A1A14\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\"/>\n<ellipse cx=\"89\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/><ellipse cx=\"111\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/>\n<path d=\"M100 99 q-3 9 1 11 q2 1 4 0\" stroke=\"#B7825A\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/>\n<path d=\"M91 117 q9 4 18 0 q-9 7 -18 0 z\" fill=\"#9A4A45\"/>\n<ellipse cx=\"80\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#9A4A45\" opacity=\".18\"/><ellipse cx=\"120\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#9A4A45\" opacity=\".18\"/>\n<path d=\"M66 72 C74 50 126 50 134 72 C122 64 78 64 66 72 Z\" fill=\"#E6DDCF\"/>\n<path d=\"M78 170 L100 186 L122 170\" stroke=\"#C9A24A\" stroke-width=\"3\" fill=\"none\"/>\n<\/svg>\n"}, "elion": {"name": "Elion", "role": "Pharma and trials", "namesake": "Gertrude Elion, Nobel laureate who designed drugs for leukemia, herpes, and organ transplant rejection without ever finishing a PhD", "color": "#0F766E", "greeting": "New trials registered, old ones finished. I keep the lab notebook.", "personality": "A bench scientist who learned by doing. Methodical, practical, and dryly funny. She treats every trial like an experiment: what is being tested, on whom, and when will we know. She is interested in results, not announcements, and tracks what changed since last week.", "how i write to adriana": "Like a lab notebook entry with a bit of personality. Leads with what changed (new, completed, results posted). Short sentences. Flags which trials are worth watching and why.", "avatar": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\" role=\"img\" aria-label=\"Portrait of Elion\">\n<title>Portrait of Elion<\/title>\n<rect width=\"200\" height=\"200\" fill=\"#D5EEEA\"/>\n\n<path d=\"M28 200 C32 162 64 146 100 146 C136 146 168 162 172 200 Z\" fill=\"#F7F7F4\"/>\n<path d=\"M84 148 L100 178 L116 148 Z\" fill=\"#1F3A3A\"/>\n<path d=\"M72 150 L100 200 L64 200 L56 158 Z M128 150 L100 200 L136 200 L144 158 Z\" fill=\"#E4E6E2\"/>\n<rect x=\"88\" y=\"112\" width=\"24\" height=\"36\" rx=\"10\" fill=\"#C99A76\"/>\n<ellipse cx=\"100\" cy=\"94\" rx=\"31\" ry=\"37\" fill=\"#EDC3A0\"/>\n<path d=\"M84 86 q6 -4 12 -1 M104 85 q6 -3 12 1\" stroke=\"#2A1A14\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\"/>\n<ellipse cx=\"89\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/><ellipse cx=\"111\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/>\n<path d=\"M100 99 q-3 9 1 11 q2 1 4 0\" stroke=\"#C99A76\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/>\n<path d=\"M91 117 q9 4 18 0 q-9 7 -18 0 z\" fill=\"#A4524E\"/>\n<ellipse cx=\"80\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#A4524E\" opacity=\".18\"/><ellipse cx=\"120\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#A4524E\" opacity=\".18\"/>\n<g fill=\"#2B211C\">\n<circle cx=\"74\" cy=\"72\" r=\"14\"/><circle cx=\"88\" cy=\"60\" r=\"15\"/><circle cx=\"104\" cy=\"57\" r=\"15\"/><circle cx=\"120\" cy=\"63\" r=\"14\"/>\n<circle cx=\"130\" cy=\"78\" r=\"12\"/><circle cx=\"69\" cy=\"88\" r=\"10\"/><circle cx=\"131\" cy=\"93\" r=\"9\"/><circle cx=\"96\" cy=\"66\" r=\"12\"/>\n<\/g>\n<g fill=\"#FFFFFF\" stroke=\"#D8D4CC\" stroke-width=\".8\">\n<circle cx=\"88\" cy=\"146\" r=\"3\"/><circle cx=\"94\" cy=\"149\" r=\"3\"/><circle cx=\"100\" cy=\"150\" r=\"3\"/><circle cx=\"106\" cy=\"149\" r=\"3\"/><circle cx=\"112\" cy=\"146\" r=\"3\"/>\n<\/g>\n<rect x=\"132\" y=\"170\" width=\"14\" height=\"4\" rx=\"2\" fill=\"#0F766E\"/>\n<\/svg>\n"}, "lamarr": {"name": "Lamarr", "role": "Commercial and innovation", "namesake": "Hedy Lamarr, film star who co-invented frequency hopping, a foundation of modern wireless technology", "color": "#6D3FB0", "greeting": "Everyone is launching something. I look at what is actually under the hood.", "personality": "An inventor who was underestimated because of how she looked. Curious, quick, and a little glamorous, but most interested in how things actually work. She can tell a real product from a press release and enjoys a clever device. She is skeptical of femtech buzz and asks who the product is really for.", "how i write to adriana": "Lively and sharp, like a friend who reads the trade press so you do not have to. Picks out the launches and partnerships that signal a real shift, and says when something looks like marketing rather than innovation.", "avatar": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\" role=\"img\" aria-label=\"Portrait of Lamarr\">\n<title>Portrait of Lamarr<\/title>\n<rect width=\"200\" height=\"200\" fill=\"#E6DCF5\"/>\n\n<path d=\"M58 80 C54 40 146 40 142 80 C148 110 150 140 138 160 C120 150 80 150 62 160 C50 140 52 110 58 80 Z\" fill=\"#1E1614\"/>\n<path d=\"M28 200 C32 162 64 146 100 146 C136 146 168 162 172 200 Z\" fill=\"#6D3FB0\"/>\n<path d=\"M78 150 Q100 176 122 150 L122 146 L78 146 Z\" fill=\"#F1C7A8\"/>\n<rect x=\"88\" y=\"112\" width=\"24\" height=\"36\" rx=\"10\" fill=\"#CF9E80\"/>\n<ellipse cx=\"100\" cy=\"94\" rx=\"31\" ry=\"37\" fill=\"#F1C7A8\"/>\n<path d=\"M84 86 q6 -4 12 -1 M104 85 q6 -3 12 1\" stroke=\"#2A1A14\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\"/>\n<ellipse cx=\"89\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/><ellipse cx=\"111\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/>\n<path d=\"M100 99 q-3 9 1 11 q2 1 4 0\" stroke=\"#CF9E80\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/>\n<path d=\"M91 117 q9 4 18 0 q-9 7 -18 0 z\" fill=\"#B3262F\"/>\n<ellipse cx=\"80\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#B3262F\" opacity=\".18\"/><ellipse cx=\"120\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#B3262F\" opacity=\".18\"/>\n<path d=\"M69 94 C66 58 92 50 112 54 C132 58 138 76 132 92 C124 72 104 62 94 66 C80 70 74 82 69 94 Z\" fill=\"#1E1614\"/>\n<path d=\"M60 132 q-6 10 4 16 q10 4 6 -8 M140 132 q6 10 -4 16 q-10 4 -6 -8\" fill=\"#2E2220\"/>\n<path d=\"M150 40 q6 -6 12 0 t12 0 M150 50 q6 -6 12 0 t12 0\" stroke=\"#6D3FB0\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/>\n<\/svg>\n"}, "walker": {"name": "Walker", "role": "Money and funding", "namesake": "Maggie Lena Walker, the first woman to charter a bank in the United States", "color": "#9A6B00", "greeting": "Follow the money. I count it, and I notice who goes without.", "personality": "A banker and community builder. Steady, careful with numbers, and never dazzled by a big round. She reads filings as closely as headlines and cares where money flows and where it does not, especially public research funding for conditions that affect women.", "how i write to adriana": "Like a clear-eyed treasurer's report. Names the notable raises, deals, and grants using only the figures in the sources. Points out patterns, such as which areas are getting funded and which are being cut.", "avatar": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\" role=\"img\" aria-label=\"Portrait of Walker\">\n<title>Portrait of Walker<\/title>\n<rect width=\"200\" height=\"200\" fill=\"#F2E6C8\"/>\n\n<path d=\"M28 200 C32 162 64 146 100 146 C136 146 168 162 172 200 Z\" fill=\"#2F2A26\"/>\n<path d=\"M84 140 L116 140 L114 164 L100 176 L86 164 Z\" fill=\"#F7F3EA\"/>\n<rect x=\"88\" y=\"112\" width=\"24\" height=\"36\" rx=\"10\" fill=\"#6E4229\"/>\n<ellipse cx=\"100\" cy=\"94\" rx=\"31\" ry=\"37\" fill=\"#8D5A3B\"/>\n<path d=\"M84 86 q6 -4 12 -1 M104 85 q6 -3 12 1\" stroke=\"#1A120E\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\"/>\n<ellipse cx=\"89\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/><ellipse cx=\"111\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/>\n<path d=\"M100 99 q-3 9 1 11 q2 1 4 0\" stroke=\"#6E4229\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/>\n<path d=\"M91 117 q9 4 18 0 q-9 7 -18 0 z\" fill=\"#6A3328\"/>\n<ellipse cx=\"80\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#6A3328\" opacity=\".18\"/><ellipse cx=\"120\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#6A3328\" opacity=\".18\"/>\n<path d=\"M68 90 C62 56 84 40 100 40 C116 40 138 56 132 90 C128 72 116 60 100 60 C84 60 72 72 68 90 Z\" fill=\"#1A1412\"/>\n<ellipse cx=\"100\" cy=\"46\" rx=\"36\" ry=\"16\" fill=\"#1A1412\"/><ellipse cx=\"100\" cy=\"30\" rx=\"14\" ry=\"9\" fill=\"#1A1412\"/>\n<g fill=\"none\" stroke=\"#C9A24A\" stroke-width=\"1.8\"><circle cx=\"89\" cy=\"96\" r=\"7\"/><circle cx=\"111\" cy=\"96\" r=\"7\"/><path d=\"M96 95 q4 -3 8 0\"/><\/g>\n<circle cx=\"100\" cy=\"168\" r=\"5\" fill=\"#C9A24A\"/>\n<\/svg>\n"}, "wells": {"name": "Wells", "role": "Weekly digest", "namesake": "Ida B. Wells, investigative journalist who used data to expose injustice", "color": "#1F4E99", "greeting": "I read everything the others found. Here is the story of the week.", "personality": "An editor and investigative reporter. Fearless, direct, and focused on what matters to readers. She connects items across the other agents' desks, asks who is left out of the research and the money, and always wants the evidence behind a claim.", "how i write to adriana": "Like an editor's note at the top of the paper. Names the strongest thread of the week and one or two possible posts. Brief and confident, and honest when the week was thin.", "avatar": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\" role=\"img\" aria-label=\"Portrait of Wells\">\n<title>Portrait of Wells<\/title>\n<rect width=\"200\" height=\"200\" fill=\"#D9E3F4\"/>\n\n<path d=\"M28 200 C32 162 64 146 100 146 C136 146 168 162 172 200 Z\" fill=\"#1B2440\"/>\n<path d=\"M82 136 L118 136 L116 158 Q100 166 84 158 Z\" fill=\"#F4F1EA\"/>\n<path d=\"M82 158 q4 4 8 0 q4 4 8 0 q4 4 8 0 q4 4 8 0 q4 4 2 2\" stroke=\"#D6D0C2\" stroke-width=\"1.5\" fill=\"none\"/>\n<rect x=\"88\" y=\"112\" width=\"24\" height=\"36\" rx=\"10\" fill=\"#5E3620\"/>\n<ellipse cx=\"100\" cy=\"94\" rx=\"31\" ry=\"37\" fill=\"#7A4A30\"/>\n<path d=\"M84 86 q6 -4 12 -1 M104 85 q6 -3 12 1\" stroke=\"#140E0B\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\"/>\n<ellipse cx=\"89\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/><ellipse cx=\"111\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/>\n<path d=\"M100 99 q-3 9 1 11 q2 1 4 0\" stroke=\"#5E3620\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/>\n<path d=\"M91 117 q9 4 18 0 q-9 7 -18 0 z\" fill=\"#5E2C22\"/>\n<ellipse cx=\"80\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#5E2C22\" opacity=\".18\"/><ellipse cx=\"120\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#5E2C22\" opacity=\".18\"/>\n<path d=\"M68 92 C64 58 84 44 100 44 C116 44 136 58 132 92 C126 76 114 70 100 70 C86 70 74 76 68 92 Z\" fill=\"#17110F\"/>\n<ellipse cx=\"100\" cy=\"40\" rx=\"18\" ry=\"12\" fill=\"#17110F\"/>\n<g fill=\"#17110F\"><circle cx=\"82\" cy=\"74\" r=\"5\"/><circle cx=\"90\" cy=\"70\" r=\"5.5\"/><circle cx=\"99\" cy=\"69\" r=\"5.5\"/><circle cx=\"108\" cy=\"70\" r=\"5.5\"/><circle cx=\"117\" cy=\"74\" r=\"5\"/><\/g>\n<ellipse cx=\"100\" cy=\"164\" rx=\"6\" ry=\"5\" fill=\"#C9A24A\"/><ellipse cx=\"100\" cy=\"164\" rx=\"3\" ry=\"2.5\" fill=\"#1F4E99\"/>\n<path d=\"M144 150 l14 -26 l4 2 l-14 26 z\" fill=\"#E8E4DA\"/>\n<\/svg>\n"}}, "items": [{"date_found": "2026-09-27", "scout": "trota", "source": "Proceedings of the ACM on Human-Computer Interaction", "title": "Designing Sexual Communication Tools for and with Transgender and Queer Youth", "url": "https://doi.org/10.1145/3816922", "published": "2026-09-23", "tags": "sexual_health;HCI;design;digital_health;transgender_health;youth;participatory_design", "relevance": "4", "summary": "Researchers partnered with 18 transgender and queer youth over multiple years to design two technology tools for sexual communication: Desire Dialogues for discussing sexual boundaries and the Intimate Disclosure Toolkit for sharing personal information with partners. The work documents a community-based participatory design process and identifies design principles for future sexual communication tools.", "why_it_matters": "This HCI work demonstrates embodied, experience-centered design of health technology addressing a documented gap—sexual communication tools designed with and for marginalized youth rather than treating contraception as the default focus.", "flags": "HCI", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] AI-Assisted Euploid Embryo Selection for Single-Blastocyst Transfer in Women of Advanced Maternal Age", "url": "https://clinicaltrials.gov/study/NCT07833345", "published": "2026-09-22", "tags": "AI_machine_learning;fertility;assisted_reproduction;clinical_decision_support;digital_health", "relevance": "5", "summary": "Trial of AI-assisted embryo selection (EmbryoInsights™ Plus) combining morphological assessment with euploidy prediction for single-blastocyst transfer in women of advanced maternal age.", "why_it_matters": "Directly addresses AI/machine learning in fertility care with potential to improve outcomes in an underserved population; exemplifies clinical decision support in femtech.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[Recently updated, now COMPLETED] Supporting Transitions to Primary Care Among Under-resourced, Postpartum Women (STEP-UP)", "url": "https://clinicaltrials.gov/study/NCT05852054", "published": "2026-09-24", "tags": "postpartum;clinical_decision_support;digital_health;gestational_diabetes;hypertension_pregnancy;health_equity", "relevance": "5", "summary": "STEP-UP trial completed; combined clinical decision support (for both OB and primary care providers), patient education, text messaging, and patient outreach to support transitions to primary care in under-resourced postpartum women with gestational diabetes, hypertension, or dysglycemia.", "why_it_matters": "Exemplifies clinical decision support, digital health (text messaging), and structural support for a vulnerable postpartum population; directly addresses care gaps and evidence-based implementation in women's health.", "flags": "Recently updated, now COMPLETED", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] MH-Rx Study (Baby on Board: Check-in on You, Your Medication, & Your Blood Pressure)", "url": "https://clinicaltrials.gov/study/NCT07842341", "published": "2026-09-25", "tags": "hypertension_pregnancy;digital_health;remote_monitoring;clinical_decision_support;health_equity;behavioral_intervention", "relevance": "5", "summary": "MH-Rx Study testing a combination intervention of community health worker-led non-medical health needs support plus clinician-led medication therapy management with remote blood pressure monitoring for hypertensive disorders of pregnancy.", "why_it_matters": "Directly addresses structural inequities in pregnancy hypertension care through integrated digital health (remote BP monitoring) and social support; exemplifies evidence gaps in under-resourced populations.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[Recently updated, now COMPLETED] Feasibility Study and Pilot Hybrid Effectiveness-Implementation Trial for the Universal Prevention of Maternal Perinatal Mental Disorders as Normalized Routine Practice (e-Perinatal Pilot)", "url": "https://clinicaltrials.gov/study/NCT06640907", "published": "2026-09-23", "tags": "perinatal_mental_health;digital_health;femtech;mHealth;implementation_science;postpartum", "relevance": "5", "summary": "A completed pilot hybrid effectiveness-implementation trial at University of Seville tested e-Perinatal, a personalized mHealth intervention for universal prevention of maternal perinatal depression and anxiety integrated into routine care. Results are now available.", "why_it_matters": "Directly addresses digital health implementation for perinatal mental health—a major evidence gap—combining femtech, clinical decision support, and health equity angles with real-world care integration.", "flags": "Recently updated, now COMPLETED", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] Effects of Transcutaneous Tibial and Auricular Vagus Nerve Stimulation in Females With Primary Dysmenorrhea", "url": "https://clinicaltrials.gov/study/NCT07834658", "published": "2026-09-22", "tags": "menstrual_health;dysmenorrhea;device;wearable;neuromodulation;femtech", "relevance": "5", "summary": "A new trial of transcutaneous tibial and auricular vagus nerve stimulation (wearable neuromodulation devices) for primary dysmenorrhea. Novel device approach to menstrual pain.", "why_it_matters": "Directly combines femtech/wearable device innovation with menstrual health; explores non-drug neuromodulation—high editorial relevance on device and evidence gaps.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] The Effect of Structured Health Information-Seeking Training on Cyberchondria and E-Health Literacy in Menopausal Women: A Randomized Controlled Trial", "url": "https://clinicaltrials.gov/study/NCT07834216", "published": "2026-09-22", "tags": "menopause;digital health;e-health literacy;cyberchondria;health information-seeking", "relevance": "4", "summary": "A randomized controlled trial will test video-based and Pecha Kucha-based health information-seeking training to reduce cyberchondria and improve e-health literacy in menopausal women. The trial has not yet begun recruiting.", "why_it_matters": "Directly addresses digital health literacy and cyberchondria in menopausal women—an emerging gap in women's health and embodied digital experience design.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] On the Effect of a Hybrid Health Literacy Intervention on Sexual Function and Digital Health Literacy in Menopausal Women", "url": "https://clinicaltrials.gov/study/NCT07839416", "published": "2026-09-24", "tags": "postmenopause;sexual function;digital health literacy;health literacy", "relevance": "4", "summary": "A trial will test a hybrid health literacy intervention targeting sexual function and digital health literacy in postmenopausal women. The trial has not yet begun recruiting.", "why_it_matters": "Directly addresses digital health literacy and sexual function in menopause—aligns with embodied experience-centered design and evidence gaps in menopausal sexual health.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] Cyclic vs. Constant Estradiol: Regimens' Effects on Brain Health", "url": "https://clinicaltrials.gov/study/NCT07831499", "published": "2026-09-21", "tags": "menopause;drug_development;brain_health", "relevance": "4", "summary": "Phase 4 trial comparing cyclic versus continuous estradiol regimens and their effects on brain health in postmenopausal women. Currently recruiting at University of Colorado, Denver.", "why_it_matters": "Addresses menopause treatment optimization with potential implications for cognitive health outcomes, an understudied area in women's health.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] The WAIT Trial: Waiting Versus Active Induction at Term in Women With A1 Gestational Diabetes Mellitus", "url": "https://clinicaltrials.gov/study/NCT07831954", "published": "2026-09-22", "tags": "gestational_diabetes;pregnancy;clinical_decision_making", "relevance": "4", "summary": "The WAIT Trial comparing timing of planned delivery (waiting versus active induction at term) in women with A1 gestational diabetes mellitus.", "why_it_matters": "Addresses a clinical decision-making gap in mild GDM management with potential to reduce unnecessary intervention; directly supports evidence-based pregnancy care.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] Healthy Adaptation to Pregnancy, Postpartum and Parenthood", "url": "https://clinicaltrials.gov/study/NCT07837193", "published": "2026-09-23", "tags": "postpartum;perinatal_mental_health;digital_health;femtech;gestational_weight_gain", "relevance": "4", "summary": "A new trial from KU Leuven evaluates the HAP3 Family App, a behavioral intervention addressing perinatal mental health, gestational weight gain, postpartum weight retention, and child development. Trial is not yet recruiting.", "why_it_matters": "Digital health tool targeting perinatal mental health and postpartum recovery aligns with femtech and digital health editorial angles; addresses known evidence gaps in perinatal mental health support.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] The Effect of Digitally Enabled District (DED 2.0) Ecosystem on the Completeness and Timeliness of Maternal and Neonatal Services in Primary Health Care", "url": "https://clinicaltrials.gov/study/NCT07842224", "published": "2026-09-25", "tags": "pregnancy;postpartum;digital_health;maternal_health;health_equity", "relevance": "4", "summary": "A new trial in Indonesia tests the Digitally Enabled District (DED 2.0) ecosystem to improve completeness and timeliness of maternal and neonatal services across prenatal, intensive, and postnatal care. Trial is not yet recruiting.", "why_it_matters": "Examines digital health infrastructure for maternal and neonatal services in primary care, addressing access and equity; fits digital health and systems innovation angles.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] Empowered Relief for Severe Pain After Cesarean Delivery During the Inpatient Period", "url": "https://clinicaltrials.gov/study/NCT07832240", "published": "2026-09-24", "tags": "postpartum;cesarean_section;pain_management;behavioral_intervention", "relevance": "4", "summary": "A new trial from Stanford evaluates 'Empowered Relief,' a behavioral intervention for severe postoperative pain after cesarean delivery during the inpatient period. Trial is not yet recruiting.", "why_it_matters": "Targets postpartum pain management—a known gap in women's health care—using behavioral/clinical decision support; aligns with embodied experience-centered design angle.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] Smartphone-based Incentives Intervention to Increase Smoking Cessation During Pregnancy", "url": "https://clinicaltrials.gov/study/NCT07840118", "published": "2026-09-24", "tags": "pregnancy;postpartum;digital_health;smartphone_app;behavioral_intervention", "relevance": "4", "summary": "A new smartphone-based intervention using financial incentives to increase smoking cessation during pregnancy and postpartum. Combines digital health tool with behavioral economics approach.", "why_it_matters": "Directly hits digital health and femtech angles in pregnancy/postpartum; demonstrates technology-enabled behavioral intervention design.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[Recently updated, now COMPLETED] Exploring Patient Treatment Preferences for Chronic Pelvic Pain: A Mixed Methods Study", "url": "https://clinicaltrials.gov/study/NCT06540560", "published": "2026-09-21", "tags": "gynecologic;chronic_pelvic_pain;digital_health;patient_preferences;femtech", "relevance": "4", "summary": "A completed mixed-methods study on patient treatment preferences for chronic pelvic pain using the My Pelvic Plan website. Digital tool informed by patient preferences.", "why_it_matters": "Digital health platform designed around patient experience and preferences in gynecologic pain—directly aligns with experience-centered design angle.", "flags": "Recently updated, now COMPLETED", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[Results posted] Non-Steroidal Anti-Inflammatory Drug (NSAID) Response and Central Sensitization of Pain in Women With Dysmenorrhea", "url": "https://clinicaltrials.gov/study/NCT05900336", "published": "2026-09-22", "tags": "menstrual_health;dysmenorrhea;pain_mechanisms;drug_response", "relevance": "4", "summary": "Results posted from a phase 4 trial examining NSAID response and central sensitization mechanisms in dysmenorrhea. Mechanistic pain science in menstrual disorders.", "why_it_matters": "Addresses evidence gaps in dysmenorrhea pathophysiology and drug response variation—identifies structural gaps in menstrual pain research.", "flags": "Results posted", "status": "new"}, {"date_found": "2026-09-27", "scout": "lamarr", "source": "femtechworld.co.uk", "title": "Personalising women’s health with AI", "url": "https://news.google.com/rss/articles/CBMihwFBVV95cUxOMDJXVF9fV1ZiYTBzdFhneG5KN2Y2TGlSVUFVVDNCb2I1dG52VWJzMWlfcW5fTlphRnhSY0FvYXZjVlhrYjdCeU0yQnhHbk8xTEJ6VjMwd2lnVG9yeXBYeUpnRXlVUG1FSnJEWTk4RlRaLU54b2JFVzhRa1h1QUZYYjZYVjZaRUk?oc=5", "published": "2026-09-22", "tags": "AI;machine learning;digital health;femtech", "relevance": "5", "summary": "Coverage of personalizing women's health with AI. This directly addresses a core editorial angle on AI and machine learning in women's health.", "why_it_matters": "AI-driven personalization in women's health is a top editorial priority; the topic signals potential product innovation, clinical decision support, or market shifts.", "flags": "news", "status": "new"}, {"date_found": "2026-09-27", "scout": "lamarr", "source": "PR Newswire", "title": "Mira Launches Cortisol Pattern™ Kit To Redefine Stress Tracking in Women's Health", "url": "https://news.google.com/rss/articles/CBMi0A rt safety assessment during breastfeeding.", "why_it_matters": "This work directly tackles evidence gaps and underfunding in postpartum/lactation research using AI to enable systematic, quantitative drug safety assessment—a critical gap that affects medication decisions for millions of breastfeeding women.", "flags": "", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "Reproductive biomedicine online", "title": "An incomplete optimization: IVF directs AI at embryo laboratory while treatment discontinuation goes unmeasured.", "url": "https://pubmed.ncbi.nlm.nih.gov/42777534/", "published": "2026", "tags": "fertility;AI/ML;evidence_gaps;femtech", "relevance": "5", "summary": "An opinion piece argues that four decades of IVF laboratory optimization via AI has overlooked treatment discontinuation, which affects 36% of patients and has a demonstrably larger effect on outcomes than embryo selection. The author proposes redirecting AI to identify dropout-risk patients and calls for standardized measurement of patient-level discontinuation.", "why_it_matters": "This directly addresses a structural gap and underfunding issue in fertility research—the neglect of patient experience and dropout despite its outsized impact—and proposes AI as solution while critiquing misaligned innovation priorities.", "flags": "", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "Journal of medical Internet research", "title": "The Alignment Paradox of Medical Large Language Models in Infertility Care: Decoupling Algorithmic Improvement From Clinical Decision-Making Quality.", "url": "https://pubmed.ncbi.nlm.nih.gov/42766421/", "published": "2026", "tags": "fertility;AI/ML;femtech;evidence_gaps", "relevance": "5", "summary": "A study of 8,201 fertility clinic records evaluated whether alignment strategies (supervised fine-tuning, direct preference optimization, group relative policy optimization, and in-context learning) for medical large language models translate from algorithmic correctness to clinical reasoning quality in infertility diagnosis and ART treatment planning. Results revealed decoupling between automatic metrics and expert-reviewed clinical decision-making quality.", "why_it_matters": "This work directly exposes a critical gap in AI-for-women's-health: the misalignment between technical benchmarks and actual clinical utility, demonstrating that token-level accuracy does not ensure sound medical reasoning in fertility care.", "flags": "", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "Frontiers in cell and developmental biology", "title": "Multi-omics integration of the vaginal microbiome and inflammatory proteome for non-invasive prediction of infertility: a machine learning approach.", "url": "https://pubmed.ncbi.nlm.nih.gov/42798548/", "published": "2026", "tags": "infertility;fertility;AI;machine-learning;vaginal-microbiome;biomarkers;clinical-decision-support", "relevance": "5", "summary": "This machine-learning study integrated vaginal microbiome (16S rRNA) and inflammatory proteomics data from 205 women (76 infertile, 129 controls) to develop non-invasive infertility diagnostic models, with microbiome-based SVM achieving AUC 0.815 vs. proteomics-only XGBoost AUC 0.629; SHAP analysis identified key microbial genera. Work directly addresses AI for reproductive diagnosis without invasive procedures.", "why_it_matters": "Exemplifies AI/machine-learning to solve evidence gaps (non-invasive infertility diagnosis) and reduce burden of invasive testing; demonstrates multi-omics integration and interpretability for women's health clinical decision support.", "flags": "", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "JMIR mental health", "title": "Perinatal Mental Health Detection and Prediction Using Mobile Sensing Data: Systematic Review.", "url": "https://pubmed.ncbi.nlm.nih.gov/42789770/", "published": "2026", "tags": "postpartum;perinatal-mental-health;digital-health;wearables;mobile-sensing;AI;systematic-review", "relevance": "5", "summary": "This PRISMA systematic review examined wearable devices and smartphones for detecting and predicting perinatal mental health outcomes across 10 studies, evaluating predictive performance, informative features, and methodological rigor using PROBAST+AI; review found fragmented evidence on continuous objective measurement via mobile sensing. Work directly addresses digital health and AI/mobile sensing in perinatal mental health.", "why_it_matters": "Substantive evidence synthesis on digital health and mobile sensing for perinatal mental health detection/prediction; highlights gap between technology capability and clinical adoption, key editorial angle.", "flags": "Systematic Review", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "Frontiers in endocrinology", "title": "Implementation readiness of artificial intelligence in in vitro fertilization: a multi-framework appraisal with special reference to advanced reproductive age patients.", "url": "https://pubmed.ncbi.nlm.nih.gov/42769651/", "published": "2026", "tags": "AI/machine_learning;fertility;IVF;implementation_science;clinical_decision_support;reproductive_age", "relevance": "5", "summary": "A multi-framework appraisal evaluated nine AI technologies across the IVF clinical workflow, stratifying them by deployment readiness using TRL, IDEAL, Rogers' Diffusion of Innovation, and NASSS frameworks. Three Wave 1 technologies (outcome prediction, stimulation dosing, RFID tracking) are immediately deployable as decision-support tools; notably, patients ≥40 years show the largest AI discriminatory advantage, though embryo selection—the highest-profile technology—is not the most deployment-ready.", "why_it_matters": "Directly assesses implementation readiness and clinical impact of AI in IVF with special attention to advanced reproductive age; reveals gap between hype (embryo selection) and near-term impact (outcome prediction).", "flags": "", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "Cureus", "title": "Evaluating Maternal and Fetal Risk in Preeclampsia Using Thyroid and Inflammatory Markers: A Naive Bayes and Network Analysis Approach.", "url": "https://pubmed.ncbi.nlm.nih.gov/42787565/", "published": "2026", "tags": "pregnancy;preeclampsia;AI_machine_learning;clinical_decision_support;biomarkers", "relevance": "5", "summary": "Machine learning study using Naive Bayes models to predict preeclampsia risk from maternal thyroid and inflammatory biomarkers (CRP, TSH, anti-TPO) with 92.5% accuracy, and a secondary model predicting fetal thyroid outcomes. The approach integrates maternal-fetal connections through network analysis.", "why_it_matters": "Strong example of AI/ML improving early prediction and risk stratification for a major pregnancy complication, with interpretable biomarkers and potential clinical decision support implications.", "flags": "", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "Journal of the American Medical Informatics Association : JAMIA", "title": "A co-learning framework for maternal and pediatric pharmacotherapy knowledge gap discovery.", "url": "https://pubmed.ncbi.nlm.nih.gov/42773747/", "published": "2026", "tags": "pregnancy;lactation;evidence_gaps;pharmacotherapy;AI_informatics;research_landscape", "relevance": "5", "summary": "Co-learning framework combining human annotation and large language models to map pharmacology research gaps in maternal and pediatric populations across 38 million PubMed abstracts. Identified 376,231 and 879,936 abstracts relevant to maternal and pediatric patients; found 22-66% of prescribed drugs lack pharmacokinetic data.", "why_it_matters": "Directly exposes evidence gaps in maternal pharmacotherapy via AI-driven literature analysis; demonstrates informatics approach to identifying structural underfunding in women's health research.", "flags": "", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "Frontiers in digital health", "title": "Maternal mHealth usability strengthened by trust, governance, and navigation.", "url": "https://pubmed.ncbi.nlm.nih.gov/42798485/", "published": "2026", "tags": "postpartum;pregnancy;mHealth;femtech;digital_health;health_equity;implementation_science", "relevance": "5", "summary": "Perspective arguing that maternal mHealth effectiveness depends on alignment with health system structures, governance, trust, and healthcare navigation—not just user-centered design. Reframes maternal mHealth as connective infrastructure rather than feature-driven products, linking digital activation to real-world care utilization.", "why_it_matters": "Critiques engagement-focused femtech design philosophy; centers equity, governance, and relational dimensions as foundational to meaningful maternal health impact.", "flags": "", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "Diagnostics (Basel, Switzerland)", "title": "Artificial Intelligence for the Prediction of Preeclampsia: Current Evidence, Comparison with Conventional Screening Models, and Future Perspectives.", "url": "https://pubmed.ncbi.nlm.nih.gov/42793748/", "published": "2026", "tags": "pregnancy;preeclampsia;AI_machine_learning;clinical_decision_support;screening;early_prediction", "relevance": "5", "summary": "Narrative review of AI/deep learning models for first-trimester preeclampsia prediction, comparing performance with conventional screening. High-performing models achieved AUC 0.84–0.92 by integrating maternal characteristics, hemodynamic variables, biochemical biomarkers, imaging, and multi-omics data. Discusses validation strategies and clinical implementation barriers.", "why_it_matters": "Synthesizes evidence on AI improving early risk stratification for major pregnancy complication; directly relevant to clinical decision support and evidence gaps in preeclampsia detection.", "flags": "", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "medRxiv", "title": "Associations of menopause hormone therapy with late-life cognition and brain health vary by formulation and APOEε4 presence", "url": "https://doi.org/10.64898/2026.09.16.26363120", "published": "2026-09-23", "tags": "menopause;AI/ML;evidence_gaps", "relevance": "4", "summary": "A study of 8,741 women examined how menopause hormone therapy (MHT) formulation and APOE genetic status together predict late-life cognition and brain health, finding estradiol-based MHT associated with better outcomes in APOE ε4 carriers compared to conjugated equine estrogens. Neuroimaging in a subset (N=930) confirmed more favorable brain structure in APOE ε4 carriers taking estradiol-based MHT.", "why_it_matters": "This research reframes mixed MHT evidence as an exposure-definition problem and demonstrates the value of precision medicine approaches—considering both drug formulation differences and genetic risk factors—in menopause care.", "flags": "preprint, not peer reviewed", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "Metabolites", "title": "A Hybrid and Comparative Machine Learning Framework for Predicting Gestational Diabetes Mellitus via a Prospective Case-Control Design: A Pilot Study Integrating Periodontal Health and Hematological Inflammatory Markers.", "url": "https://pubmed.ncbi.nlm.nih.gov/42783742/", "published": "2026", "tags": "pregnancy;AI/ML;digital_health", "relevance": "4", "summary": "A pilot study compared machine learning models (Bayesian-regularized artificial neural networks and transformer-enhanced physics-informed neural networks) to predict gestational diabetes mellitus by integrating periodontal health and inflammatory markers from 80 pregnant women. The ANN model achieved high predictive accuracy (R² 0.9872).", "why_it_matters": "This work demonstrates AI/ML applied to pregnancy complications using integrated biomarkers, exemplifying how digital health approaches can identify novel diagnostic pathways for understudied pregnancy outcomes.", "flags": "", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "medRxiv", "title": "Systematic Review and External Validation of Clinical Prediction Models for Adverse Pregnancy Outcomes Using Routinely Collected Pre-Conception and Early Pregnancy Data", "url": "https://doi.org/10.64898/2026.09.21.26363564", "published": "2026-09-22", "tags": "pregnancy;AI/ML;evidence_gaps", "relevance": "4", "summary": "A systematic review and external validation study assessed clinical prediction models for gestational diabetes, pre-eclampsia, stillbirth, and small-for-gestational-age using 1.58 million pregnancies from UK primary care data (2000-2020). Of 48 identified models, performance was evaluated via discrimination and calibration metrics across 20 imputations.", "why_it_matters": "This work exposes the evidence gap in model validation and real-world performance for pregnancy complications, demonstrating whether AI/ML-based prediction tools translate to clinical practice—a key question for femtech and clinical decision support.", "flags": "preprint, not peer reviewed", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "medRxiv", "title": "Validation of the Perimenopause Symptom Scale (Peri-SS) for Digital Self-Assessment: Psychometric Evaluation Among U.S. Women Aged 35 to 59 years", "url": "https://doi.org/10.1101/2025.07.16.25331654", "published": "2026-09-23", "tags": "menopause;digital_health;femtech;evidence_gaps", "relevance": "4", "summary": "Researchers developed and validated the Perimenopause Symptom Scale (Peri-SS), a concise digital self-assessment tool for 1,255 U.S. women aged 35-59, achieving strong psychometric properties (CFI 0.932, internal consistency α=0.90, test-retest ICC=0.82) with a four-domain structure (vasomotor, psychological, sexual, physical ZW1rOHhOWW9KaWlVZFlmT0Z3eg?oc=5", "published": "2026-09-23", "tags": "investment_landscape;underfunding", "relevance": "3", "summary": "Forbes article titled about $1 trillion women's health opportunity investors are missing. Headline suggests investment gap analysis but no substantive details in stub.", "why_it_matters": "Speaks to underfunding and market dynamics in women's health, a core editorial interest, but text is too thin to assess depth.", "flags": "news", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "PloS one", "title": "Artificial intelligence for women's reproductive health: A scoping review of global diagnostic trends, methodological gaps, and a translational research agenda for low-resource settings.", "url": "https://pubmed.ncbi.nlm.nih.gov/42789829/", "published": "2026", "tags": "AI;clinical_decision_support;evidence_gaps;gynecologic;fertility;pregnancy", "relevance": "5", "summary": "A PRISMA-ScR scoping review of 116 AI/ML studies (2021–2025) on women's reproductive and endocrine health (PCOS, endometriosis, thyroid, infertility, pregnancy complications) found 83.6% high risk of bias, 75.5% lacked external validation, and CNNs showed optimism bias. Ensemble methods (Random Forest, Gradient Boosting) performed more robustly.", "why_it_matters": "Directly maps the evidence gap in AI for women's reproductive health, exposing methodological weaknesses, validation failures, and translational barriers in LMICs—core to the newsletter's editorial mission.", "flags": "", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "Medicina (Kaunas, Lithuania)", "title": "Augmented Reality, Mixed Reality, Computer Vision, and Three-Dimensional Modeling in Fertility-Preserving Minimally Invasive Gynecologic Surgery: A Scoping Review with Narrative Synthesis.", "url": "https://pubmed.ncbi.nlm.nih.gov/42796396/", "published": "2026", "tags": "gynecologic;fertility;augmented_reality;mixed_reality;artificial_intelligence;3D_modeling;surgery;evidence_gap", "relevance": "5", "summary": "This scoping review maps evidence on augmented reality, mixed reality, computer vision, AI, and 3D modeling in fertility-preserving gynecologic surgery, including myomectomy, adenomyomectomy, and endometriosis care. Of 528 records screened, only 20 met inclusion criteria, with limited comparative evidence and most studies on enabling technologies rather than clinical application.", "why_it_matters": "Directly on editorial angles: AI and digital health in gynecologic care, femtech market and evidence gaps, and embodied design in fertility-preserving surgery—a nascent field with substantial unmet need for rigorous implementation research.", "flags": "", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "medRxiv", "title": "Differentiating benign from malignant adnexal masses by biomarker-agnostic plasma proteomics using adaptive machine learning", "url": "https://doi.org/10.64898/2026.09.23.26363813", "published": "2026-09-25", "tags": "gynecologic;AI_machine_learning;clinical_decision_support;digital_health;biomarkers", "relevance": "5", "summary": "A multicenter prospective study developed and validated ADAPT-MS, an AI classifier using plasma proteomics (>1,000 proteins per sample) via mass spectrometry to distinguish malignant from benign adnexal masses without relying on fixed biomarker panels, achieving AUC of 0.835 across five independent validation cohorts.", "why_it_matters": "Exemplifies cutting-edge AI-driven clinical decision support in gynecologic oncology using novel proteomics; directly addresses evidence gap in non-invasive preoperative triage of adnexal masses.", "flags": "preprint, not peer reviewed", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "medRxiv", "title": "A Structure-Aware Self-Supervised Framework for Transferable Fetal Ultrasound Screening", "url": "https://doi.org/10.64898/2026.09.21.26361576", "published": "2026-09-27", "tags": "pregnancy;AI_machine_learning;clinical_decision_support;ultrasound;prenatal_screening", "relevance": "5", "summary": "RadarMAE, a structure-aware self-supervised learning framework for fetal ultrasound, achieved AUC 0.99 for trisomy 21 screening on an internal cohort and maintained robust cross-institutional generalization with <0.04 performance degradation; integrated spatial registration with explainable AI to create the first population-level facial risk atlas for trisomy 21.", "why_it_matters": "Exemplifies AI and interpretability advances in pregnancy screening that address data scarcity and cross-site generalization; reveals underutilized diagnostic features through explainable machine learning.", "flags": "preprint, not peer reviewed", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "Irish journal of medical science", "title": "Menstrual tracking apps and cyberchondria in young women: a cross-sectional study of anxiety, menstrual impact, and dysmenorrhea.", "url": "https://pubmed.ncbi.nlm.nih.gov/42776457/", "published": "2026", "tags": "menstrual_health;femtech;digital_health;HCI;user_experience", "relevance": "4", "summary": "A cross-sectional study of 200 women aged 18–25 found menstrual tracking app users had significantly higher cyberchondria severity scores than non-users, with longer app use associated with both higher cyberchondria and, counterintuitively, lower menstruation impact. No differences in dysmenorrhea.", "why_it_matters": "Directly examines user experience and unintended psychological consequences of menstrual health technology, revealing a potential downside of femtech products.", "flags": "", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "Journal of primary health care", "title": "Adaptation of a maternal and child mHealth programme: an example from Aotearoa New Zealand.", "url": "https://pubmed.ncbi.nlm.nih.gov/42768737/", "published": "2026", "tags": "pregnancy;postpartum;digital_health;femtech;HCI;design", "relevance": "4", "summary": "Describes cultural adaptation of an existing mHealth text-messaging programme for maternal and child health in Aotearoa New Zealand, resulting in txtpēpi, available in Te Reo Māori and English. Notes that cultural adaptation is resource-intensive.", "why_it_matters": "Exemplifies embodied, culturally-grounded design of reproductive health technology and highlights structural gaps in how femtech is adapted for different populations.", "flags": "", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "Frontiers in global women's health", "title": "Contraceptive ever-use among women of reproductive age in Northern Ghana: a comparative analysis of logistic regression, LASSO penalised regression, and random forest machine learning approaches.", "url": "https://pubmed.ncbi.nlm.nih.gov/42780915/", "published": "2026", "tags": "contraception;AI;clinical_decision_support;evidence_gaps", "relevance": "4", "summary": "A facility-based cross-sectional study compared logistic regression, LASSO, and Random Forest to predict contraceptive ever-use among 414 women in Northern Ghana. Random Forest achieved AUC 0.865 vs. 0.727 for logistic regression, and identified knowledge as a high-importance non-linear predictor missed by standard regression.", "why_it_matters": "Demonstrates how ML outperforms traditional statistics in women's health prediction, revealing structural gaps in how standard methods miss important determinants of contraceptive adoption.", "flags": "", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "Psychological medicine", "title": "Acceptability and efficacy of a smartphone intervention informed by interpersonal psychotherapy for perinatal mental health: A randomized controlled trial.", "url": "https://pubmed.ncbi.nlm.nih.gov/42779472/", "published": "2026", "tags": "pregnancy;perinatal;digital_health;mental_health;mobile_app", "relevance": "4", "summary": "This RCT evaluates an IPT-informed smartphone app for perinatal depression in 350 pregnant women, finding high acceptability (90.2% satisfaction) but no significant efficacy advantage over usual care at 8 weeks. The work addresses scalability and digital access barriers to mental health support in pregnancy.", "why_it_matters": "Strong fit on digital health and perinatal mental health; demonstrates design and deployment of a femtech intervention, though efficacy gap raises questions about evidence and implementation.", "flags": "Randomized Controlled Trial", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "Arthritis care & research", "title": "Generative AI Utilization and Perspectives Among Reproductive-Age Women with Systemic Autoimmune and Rheumatic Diseases.", "url": "https://pubmed.ncbi.nlm.nih.gov/42788866/", "published": "2026", "tags": "pregnancy;reproductive_health;artificial_intelligence;generative_AI;digital_health;clinical_decision_support", "relevance": "4", "summary": "This survey of 190 reproductive-age women with systemic autoimmune and rheumatic diseases explores attitudes toward and use of generative AI for health information-seeking. Most (77.4%) were familiar with AI; 88% were willing to use physician-recommended AI tools, and about one-third were interested in AI for medication safety in pregnancy/lactation.", "why_it_matters": "Strong fit on AI and digital health design; reveals evidence gap in how women with chronic disease integrate AI into reproductive decision-making and identifies demand for personalized, pregnancy-specific clinical decision support.", "flags": "", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "medRxiv", "title": "Sex- and Menopause-Specific Hormone-Related ECG Signatures and Incident Cardiovascular Risk in UK Biobank", "url": "https://doi.org/10.64898/2026.09.11.26362818", "published": "2026-09-21", "tags": "menopause;cardiovascular;machine_learning;hormones;ECG;biomarkers", "relevance": "4", "summary": "This prospective UK Biobank study (N=8,056) identifies sex- and menopause-specific hormone-ECG signatures linked to incident cardiovascular disease, finding that hormone-predicted ECG components (e.g., FAI-predicted QRS amplitude) predict CVD risk differentially by sex and menopausal status. The work uses multivariate modeling to bridge hormonal biology and cardiac electrophysiology.", "why_it_matters": "Strong fit on menopause and AI/ML: demonstrates how machine learning can surface hormone-dependent cardiac phenotypes in women, potentially enabling personalized risk stratification and preventive strategies during menopause transition.", "flags": "preprint, not peer reviewed", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "Maternal & child nutrition", "title": "The Impact of Peer Support Through Mobile Health Applications on Breastfeeding Outcomes: A Systematic Review and Meta-Analysis.", "url": "https://pubmed.ncbi.nlm.nih.gov/42764805/", "published": "2026", "tags": "postpartum;digital_health;femtech;breastfeeding;mobile_health;evidence_gap", "relevance": "4", "summary": "A systematic review and meta-analysis of seven RCTs examining mobile health peer support for breastfeeding found no significant effect on overall breastfeeding rates, though interventions were delivered through apps, calls, chats, and messaging. The review highlights the limited effectiveness of digital peer support despite its scalability potential for addressing barriers to exclusive breastfeeding.", "why_it_matters": "Demonstrates an evidence gap in femtech for postpartum support—digital peer support doesn't yet improve outcomes despite widespread product development in this space.", "flags": "Systematic Review", "status": "new"}, {"date_found": "2026-09-27", "scout": "trota", "source": "medRxiv", "title": "Community-Delivered Antenatal Care to Address Access Barriers: Perspectives of Women and Healthcare Worke
