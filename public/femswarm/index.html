: "bioRxiv : the preprint server for biology", "title": "Predicting Endometriosis Status and Menstrual Cycle Phase Using DNA Methylation.", "url": "https://pubmed.ncbi.nlm.nih.gov/42818242/", "published": "2026", "tags": "endometriosis;AI/ML;biomarkers;digital health;menstrual_health", "relevance": "5", "summary": "This preprint develops a machine learning pipeline using DNA methylation from ~759,000 CpG sites to classify endometriosis and menstrual cycle phase, achieving strong performance (AUROC 0.989 for cycle phase, 0.875 for endometriosis). Ridge regression identified compact predictive CpG sets, suggesting epigenetic biomarkers could improve endometriosis diagnosis and inform mechanisms of disease.", "why_it_matters": "This directly combines AI/ML with epigenetic biomarkers to address delayed endometriosis diagnosis and pelvic pain—an evidence gap where current clinical tools fall short—and demonstrates how computational approaches can extract predictive signals from complex biological data.", "flags": "", "status": "new"}, {"date_found": "2026-10-05", "scout": "trota", "source": "medRxiv", "title": "Iron homeostasis and endometriosis risk: Genetic evidence for a shared biological link", "url": "https://doi.org/10.64898/2026.08.25.26361232", "published": "2026-09-29", "tags": "endometriosis;biomarkers;genetic analysis;inflammation", "relevance": "5", "summary": "This genetic study identifies 8 shared genome-wide significant loci between endometriosis and iron homeostasis biomarkers, finding evidence that reduced systemic iron status is associated with increased endometriosis risk but with inconsistent evidence for causal bidirectional effects. The work uses GWAS data to clarify whether observed lower ferritin in endometriosis patients reflects causation or secondary effects of inflammation and blood loss.", "why_it_matters": "Uncovers a previously unclear biological link between iron metabolism and endometriosis, filling an evidence gap by using computational genetics to distinguish causation from confounding in observational associations.", "flags": "preprint, not peer reviewed", "status": "new"}, {"date_found": "2026-10-05", "scout": "trota", "source": "BMC pregnancy and childbirth", "title": "Predicting of early miscarriage based on machine learning: a retrospective cohort study in China.", "url": "https://pubmed.ncbi.nlm.nih.gov/42823675/", "published": "2026", "tags": "pregnancy_loss;miscarriage;AI/ML;biomarkers;clinical decision support", "relevance": "5", "summary": "This retrospective cohort of 17,926 pregnancies (1,918 miscarriages) from China applied ten machine learning algorithms to serum hormone biomarkers (β-hCG, progesterone, estradiol) across gestational weeks to predict early miscarriage, comparing univariate and multivariate models to identify optimal timing and biomarkers. The work addresses inconsistent predictive value of current biomarkers across studies.", "why_it_matters": "Directly applies AI/ML to improve early miscarriage prediction using existing clinical biomarkers, closing an evidence gap where current hormonal markers show inconsistent predictive performance across populations.", "flags": "", "status": "new"}, {"date_found": "2026-10-05", "scout": "trota", "source": "PLoS medicine", "title": "The inverted pyramid of care in modern-day obstetrics.", "url": "https://pubmed.ncbi.nlm.nih.gov/42804724/", "published": "2026", "tags": "pregnancy;clinical_decision_support;machine_learning;AI;risk_stratification;antenatal_care;precision_medicine", "relevance": "5", "summary": "Policy Forum advocates for risk-stratified antenatal care pathways built around early prediction, prevention, and personalized surveillance, updating the 2011 'inverted pyramid of care' concept. Highlights advances in early screening, AI-assisted diagnostics, and integration of technologies for maternal, fetal, and uteroplacental prediction.", "why_it_matters": "Directly on editorial angles: articulates framework for AI/ML integration in pregnancy care, discusses clinical decision support, addresses evidence gaps in early prediction, and explicitly calls for AI-assisted technology development.", "flags": "", "status": "new"}, {"date_found": "2026-10-05", "scout": "trota", "source": "medRxiv", "title": "Time-aware machine learning enables early intrapartum identification of fetuses at risk of hypoxic-ischemic encephalopathy from cardiotocography", "url": "https://doi.org/10.64898/2026.09.28.26364144", "published": "2026-10-01", "tags": "pregnancy;intrapartum;fetal_monitoring;machine_learning;AI;clinical_prediction;cardiotocography", "relevance": "5", "summary": "Time-aware machine learning model trained on cardiotocography (CTG) data across full labor duration identified fetuses at risk of hypoxic-ischemic encephalopathy (HIE) 3–6 hours earlier than traditional last-hour-only models. Adding time-from-labor-onset as feature improved early warning performance; 40.3% of HIE cases identified ≥3 hours before delivery.", "why_it_matters": "AI + clinical decision support + evidence gap: addresses specificity problem of CTG with novel ML approach that learns temporal patterns; demonstrates how extended training windows and feature engineering improve intrapartum prediction and could reduce unnecessary intervention.", "flags": "preprint, not peer reviewed", "status": "new"}, {"date_found": "2026-10-05", "scout": "trota", "source": "JBRA assisted reproduction", "title": "Integrating Artificial Intelligence into Reproductive Medicine: A Predictive Algorithm for Noninvasive Live Birth Assessment.", "url": "https://pubmed.ncbi.nlm.nih.gov/42804684/", "published": "2026", "tags": "fertility;AI;machine_learning;clinical_decision_support", "relevance": "5", "summary": "Machine learning (XGBoost) model integrating morphokinetic, clinical, and semen variables predicted live birth after IVF with AUC 0.927, identifying transfer embryo class, second polar body timing, AMH, age, and BMI as top predictors.", "why_it_matters": "Directly on editorial angles: AI/ML clinical decision support for fertility; substantive evidence of model performance that could translate to fertility digital health tools and embryo selection support.", "flags": "", "status": "new"}, {"date_found": "2026-10-05", "scout": "trota", "source": "International journal of women's health", "title": "Artificial Intelligence and Machine Learning for predicting Major Obstetric Emergencies: Current Evidence, Clinical Translation, and Future Directions.", "url": "https://pubmed.ncbi.nlm.nih.gov/42812694/", "published": "2026", "tags": "pregnancy;AI;machine_learning;clinical_decision_support;evidence_gaps", "relevance": "5", "summary": "Narrative review synthesized evidence on AI/ML models (random forest, neural networks, XGBoost) for predicting postpartum hemorrhage, preeclampsia, and preterm birth; models showed promise but substantial heterogeneity in design, validation, and clinical implementation.", "why_it_matters": "Directly on editorial angles: comprehensive synthesis of AI/ML for obstetric emergencies; identifies evidence gaps in validation, interpretability, and clinical translation—key concerns for digital health adoption.", "flags": "", "status": "new"}, {"date_found": "2026-10-05", "scout": "trota", "source": "PLOS digital health", "title": "Foundation model-powered deep learning of endometrial histology for predicting the cumulative live birth of an in vitro fertilization cycle.", "url": "https://pubmed.ncbi.nlm.nih.gov/42804460/", "published": "2026", "tags": "fertility;AI;machine_learning;digital_health;clinical_decision_support", "relevance": "5", "summary": "A deep learning study using foundation models (UNI2-h) to predict cumulative live birth outcomes from endometrial histology images in IVF cycles, comparing end-to-end ResNet approaches with foundation model pipelines. The UNI2-h model achieved strong generalization (AUROC 0.90) in phase-based testing, suggesting robust clinical utility.", "why_it_matters": "Exemplifies AI and machine learning applied to a core women's health problem (fertility assessment), addressing observer variability in endometrial receptivity evaluation with a clinically deployable tool.", "flags": "", "status": "new"}, {"date_found": "2026-10-05", "scout": "trota", "source": "Psychiatry research", "title": "Clinical feature grouping-based FT-Transformer for postpartum depression risk prediction: a longitudinal cohort study in perinatal women.", "url": "https://pubmed.ncbi.nlm.nih.gov/42810281/", "published": "2026", "tags": "postpartum;depression;machine_learning;risk_prediction;clinical_decision_support", "relevance": "5", "summary": "Develops a Clinical-Group Feature Tokenizer + Transformer (FT-Transformer) model for postpartum depression risk prediction using clinical feature grouping, achieving F1 score of 0.734 on internal testing. Incorporates personality and psychological assessments (EPQ, BDI) alongside clinical data from 1,138 women.", "why_it_matters": "Demonstrates machine learning for PPD early identification with attention to interpretability through clinical grouping; directly supports clinical decision-making and risk stratification at scale.", "flags": "", "status": "new"}, {"date_found": "2026-10-05", "scout": "trota", "source": "Frontiers in psychiatry", "title": "Development and external validation of an explainable XGBoost model with a web-based calculator for risk prediction of postpartum depressive symptoms.", "url": "https://pubmed.ncbi.nlm.nih.gov/42812601/", "published": "2026", "tags": "postpartum;depression;machine_learning;risk_prediction;digital_health;clinical_tool", "relevance": "5", "summary": "Develops and externally validates an explainable XGBoost model with an accompanying web-based calculator for postpartum depressive symptom risk prediction using demographic, psychosocial, and obstetric variables from 553 women. Uses SHAP for interpretability; screening-positive rate 38% in development, 26% in external validation cohort.", "why_it_matters": "Directly exemplifies a deployed digital tool for PPD risk stratification with attention to explainability, external validation, and clinical accessibility—combining clinical decision support with user-facing technology.", "flags": "", "status": "new"}, {"date_found": "2026-10-05", "scout": "trota", "source": "medRxiv", "title": "Blood transcriptomic signature associated with hypertension in females across two human cohorts", "url": "https://doi.org/10.64898/2026.09.25.26364057", "published": "2026-09-28", "tags": "menopause;AI/ML;cardiovascular;sex differences", "relevance": "4", "summary": "This multi-cohort transcriptomic study identifies a female-specific hypertension signature in blood driven by ETS family transcription factors, showing sex-by-hypertension interaction absent in males and correlation with pro-inflammatory signatures in arterial and kidney tissues in women. The work reveals a biological mechanism explaining why hypertension prevalence rises sharply in postmenopausal women.", "why_it_matters": "Exposes how AI-driven transcriptomic analysis uncovers sex-specific pathophysiology in cardiovascular disease, highlighting structural underfunding of women's cardiovascular research and informing precision medicine approaches for postmenopausal hypertension.", "flags": "preprint, not peer reviewed", "status": "new"}, {"date_found": "2026-10-05", "scout": "trota", "source": "Frontiers in physiology", "title": "Wearable biosensors characterize Baguazhang exercise intensity, trunk acceleration, and cardiovascular autonomic adaptations in postmenopausal women.", "url": "https://pubmed.ncbi.nlm.nih.gov/42827681/", "published": "2026", "tags": "menopause;wearables;digital health;cardiovascular;embodied experience", "relevance": "4", "summary": "This RCT used chest-strap ECG and waist-mounted tri-axial accelerometry to quantify cardiovascular intensity and trunk acceleration during Baguazhang exercise in 46 sedentary postmenopausal women over 12 weeks, measuring systolic blood pressure, diastolic blood pressure, and autonomic adaptation (LnRMSSD). The study provides sensor-based characterization of a mind-body exercise intervention in a demographic with limited exercise research.", "why_it_matters": "Demonstrates embodied, sensor-based evaluation of exercise interventions for postmenopausal health, using wearables to characterize physiologic adaptations in an understudied population.", "flags": "", "status": "new"}, {"date_found": "2026-10-05", "scout": "trota", "source": "medRxiv", "title": "Early Pregnancy Glycosylated Hemoglobin in Relation to Gestational Diabetes Mellitus and Adverse Pregnancy Outcomes: Evidence from a Multisite Low- and Middle-Income Countries Cohort", "url": "https://doi.org/10.64898/2026.09.23.26362980", "published": "2026-09-29", "tags": "pregnancy;gestational diabetes;biomarkers;global health", "relevance": "4", "summary": "This multisite cohort study across Kenya, India, Pakistan, and Zambia evaluates whether early pregnancy HbA1c predicts gestational diabetes and adverse perinatal outcomes (hypertensive disorder, preterm birth, stillbirth, etc.), addressing implementation challenges of the OGTT gold standard in low- and middle-income settings. The work seeks alternative biomarkers for earlier GDM detection.", "why_it_matters": "Addresses evidence gaps in GDM diagnosis in resource-limited settings where the standard OGTT is difficult to implement, with potential to improve maternal and neonatal outcomes globally.", "flags": "preprint, not peer reviewed", "status": "new"}, {"date_found": "2026-10-05", "scout": "trota", "source": "Adjunct Proceedings of the 14th Nordic Conference on Human-Computer Interaction", "title": "\"Whenever a girl has a problem, we all go to the bathroom together\": Exploring Menstrual Health Care Ecosystems Through the Lived Experiences of Children and Adolescents", "url": "https://doi.org/10.1145/3821402.3830133", "published": "2026-09-30", "tags": "menstrual_health;HCI;embodied experience;adolescent health", "relevance": "4", "summary": "This HCI conference paper explores menstrual health care ecosystems through lived experiences of children and adolescents, with a quote illustrating how young people collectively navigate menstrual management in school settings. No abstract is available, limiting detail about methods and findings.", "why_it_matters": "HCI work on menstrual health that centers young people's embodied experiences and social practices, though the absence of an abstract makes it difficult to assess depth of contribution to design or care innovation.", "flags": "HCI; no abstract", "status": "new"}], "runs": [{"timestamp": "2026-09-27T02:39:09", "scout": "trota", "candidates": "1", "kept": "1", "note": ""}, {"timestamp": "2026-09-27T02:40:33", "scout": "elion", "candidates": "58", "kept": "15", "note": ""}, {"timestamp": "2026-09-27T02:41:53", "scout": "lamarr", "candidates": "174", "kept": "15", "note": "capped from 174"}, {"timestamp": "2026-09-27T02:43:14", "scout": "walker", "candidates": "139", "kept": "15", "note": "capped from 139"}, {"timestamp": "2026-09-27T20:21:05", "scout": "trota", "candidates": "88", "kept": "15", "note": "capped from 88"}, {"timestamp": "2026-09-27T20:21:10", "scout": "elion", "candidates": "0", "kept": "0", "note": ""}, {"timestamp": "2026-09-27T20:22:25", "scout": "lamarr", "candidates": "159", "kept": "10", "note": "capped from 159"}, {"timestamp": "2026-09-27T20:23:43", "scout": "walker", "candidates": "119", "kept": "15", "note": "capped from 119"}, {"timestamp": "2026-09-27T20:45:06", "scout": "trota", "candidates": "74", "kept": "15", "note": "capped from 74"}, {"timestamp": "2026-09-27T20:45:12", "scout": "elion", "candidates": "0", "kept": "0", "note": "no changes; 117 trials checked"}, {"timestamp": "2026-09-27T20:46:27", "scout": "lamarr", "candidates": "145", "kept": "9", "note": "capped from 145"}, {"timestamp": "2026-09-27T20:47:43", "scout": "walker", "candidates": "106", "kept": "6", "note": "capped from 106"}, {"timestamp": "2026-09-28T20:20:15", "scout": "trota", "candidates": "71", "kept": "15", "note": "capped from 71"}, {"timestamp": "2026-09-29T19:12:47", "scout": "elion", "candidates": "18", "kept": "10", "note": ""}, {"timestamp": "2026-09-30T18:49:50", "scout": "lamarr", "candidates": "155", "kept": "15", "note": "capped from 155"}, {"timestamp": "2026-10-01T19:20:51", "scout": "walker", "candidates": "136", "kept": "7", "note": "capped from 136"}, {"timestamp": "2026-10-05T21:18:52", "scout": "trota", "candidates": "93", "kept": "15", "note": "capped from 93"}], "notes": [{"timestamp": "2026-09-27T20:21:09", "agent": "trota", "note": "I found a strong week. The RISKmilk framework stands out as a direct answer to a real problem: we have almost no pharmacokinetic data on drugs in breast milk because lactating women were systematically excluded from trials. This AI tool uses molecular structure to predict drug transfer, was validated against clinical data, and is already applied to marketed drugs, that's the kind of practical evidence gap work that matters. The multi-omics infertility study is solid too, integrating vaginal microbiome and inflammatory proteomics in 205 women with reasonable predictive performance and interpretability.\n\nI should flag that three pieces are preprints without peer review yet: the MHT-cognition study, the pregnancy prediction model systematic review, and the perimenopause symptom scale. The scale work is interesting for digital phenotyping but early. The IVF AI opinion and the maternal mHealth perspective are both thoughtful but not data-driven studies, so they're more context than evidence.\n\nNothing failed this week, but you'll want to note the preprint status in your framing."}, {"timestamp": "2026-09-27T20:21:12", "agent": "elion", "note": "Nothing came through this week - the sources either went quiet or didn't post. Worth checking if there's a server issue on our end or if it's just a slow news cycle for trials. I'll run it again tomorrow before we go to print."}, {"timestamp": "2026-09-27T20:22:28", "agent": "lamarr", "note": "This week had real signal. WHOOP and ŌURA are both doing something interesting by backing into menstrual health through sleep and biometric data, which feels like a genuine discovery path rather than slapping \"for women\" on an existing tool. The FSH research is the kind of clinical shift that could actually change how doctors flag perimenopause earlier, not just how we talk about it. On the device side, Colpofix for HPV lesions and Marani Health's cleared Mcare System suggest some actual clinical work happening in gynecology, though I wish we had details on what Mcare actually does. The cortisol tracking from Mira is the one that made me pause, because it lands in that fuzzy space where we're not entirely sure if we're solving a problem or creating one. Blair Health's funding is noise without knowing their model, and the GLP-1 and hotline items don't tell us much about innovation or coverage shifts."}, {"timestamp": "2026-09-27T20:23:46", "agent": "walker", "note": "I found three raises with solid numbers this week. Teal Health closed $22M for at-home cervical cancer screening, Blair Health raised CAD $4.2M for a specialty women's healthcare platform targeting the specialist gap, and Epsilon Health landed $27.6M. I also saw Sun Pharma acquiring Organon for $11.75B, which includes women's health assets like contraception, though the deal structure details weren't clear from available text. The BCG report flagged a $350B longevity mismatch in women's health research funding, which points to a structural gap worth tracking. No problems in my sources this week, but several headlines lacked the investor names or product specifics that would let us map where the real dollars are flowing."}, {"timestamp": "2026-09-27T20:23:55", "agent": "wells", "note": "This week is unusually stro const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const agents = DATA.agents, keys = Object.keys(agents);
const DAY = 864e5;
const today = new Date(DATA.built + "T12:00:00");
const daysAgo = d => Math.round((today - new Date(d.slice(0, 10) + "T12:00:00")) / DAY);
const fmtDate = d => new Date(d.slice(0, 10) + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
const when = d => { const n = daysAgo(d); return n <= 0 ? "today" : n === 1 ? "yesterday" : n < 7 ? `${n} days ago` : fmtDate(d); };
const rel = i => parseInt(i.relevance, 10) || 0;
const runsFor = k => DATA.runs.filter(r => r.scout === k);
const noteFor = k => DATA.notes.filter(n => n.agent === k).at(-1);
const face = k => agents[k].avatar;
const agentStyle = k => `data-agent="${k}" style="--c:${agents[k].color}"`;

const state = { agent: "wells", scope: "week", min: 3, q: "" };
try { const s = JSON.parse(localStorage.getItem("femswarm-view") || "{}"); if (agents[s.agent]) Object.assign(state, s); } catch (e) {}
const save = () => { try { localStorage.setItem("femswarm-view", JSON.stringify(state)); } catch (e) {} };
if (agents[location.hash.slice(1)]) state.agent = location.hash.slice(1);

function lastRun(k) {
  if (k === "wells") return DATA.digest.date ? { timestamp: DATA.digest.date, kept: DATA.digest.count, note: "" } : null;
  return runsFor(k).at(-1);
}
function health(k) {
  const r = lastRun(k);
  if (!r) return { cls: "idle", text: "No runs yet" };
  const trouble = /failed|error/i.test(r.note || "") || (k !== "wells" && +r.candidates === 0 && !/no changes/.test(r.note || ""));
  const label = k === "wells" ? `${r.kept} in digest` : `${r.kept} kept`;
  return { cls: trouble ? "warn" : "", text: `${label} · ${when(r.timestamp)}`, trouble };
}

function renderLineup() {

      <span class="meta"><span class="dot ${h.cls}"></span><span class="num">${esc(h.text)}</span></span></span></button>`;
  }).join("");
}

function historyChart(k) {
  const runs = runsFor(k).slice(-8);
  if (!runs.length) return "";
  const W = 300, H = 110, pad = { l: 28, r: 6, t: 8, b: 20 };
  const max = Math.max(15, ...runs.map(r => +r.candidates || 0));
  const top = Math.ceil(max / 50) * 50 || 50;
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - v / top);
  const slot = (W - pad.l - pad.r) / 8, bw = Math.min(22, slot * 0.6);
  const grid = [0, top / 2, top].map(v => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${pad.l - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="10" font-family="var(--mono)" fill="var(--muted)">${v}</text>`).join("");
  const bars = runs.map((r, i) => {
    const x = pad.l + slot * i + (slot - bw) / 2, c = +r.candidates || 0, kept = +r.kept || 0;
    const bad = /failed|error/i.test(r.note || "");
    return `<g><title>${esc(fmtDate(r.timestamp))}: ${c} candidates, ${kept} kept${r.note ? ". " + esc(r.note) : ""}</title>
      <rect x="${x}" y="${y(c)}" width="${bw}" height="${y(0) - y(c)}" rx="2" fill="var(--sunk)"/>
      <rect x="${x}" y="${y(kept)}" width="${bw}" height="${y(0) - y(kept)}" rx="2" fill="var(--ac)"/>
      ${bad ? `<circle cx="${x + bw / 2}" cy="${y(c) - 6}" r="3" fill="var(--warn)"/>` : ""}
      <text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle" font-size="9.5" font-family="var(--mono)" fill="var(--muted)">${esc(fmtDate(r.timestamp))}</text></g>`;
  }).join("");
  const last = runs.at(-1);
  const problem = /failed|error/i.test(last.note || "") ? `<p class="problem">Last run: ${esc(last.note)}</p>` : "";
  return `<div class="history"><p class="panel-title">Recent runs</p>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Candidates found and items kept, last ${runs.length} runs">${grid}${bars}</svg>
    <div class="legend"><span><i style="background:var(--sunk)"></i>found</span><span><i style="background:var(--ac)"></i>kept</span><span><i style="background:var(--warn);border-radius:50%"></i>source trouble</span></div>${problem}</div>`;
}

}

function renderFinds() {
  const k = state.agent, q = state.q.trim().toLowerCase();
  let items = DATA.items.filter(i => (k === "wells" || i.scout === k) && rel(i) >= state.min);
  if (state.scope === "week") items = items.filter(i => daysAgo(i.date_found) <= 7);
  if (q) items = items.filter(i => [i.title, i.summary, i.source, i.tags].join(" ").toLowerCase().includes(q));
  items.sort((a, b) => b.date_found.localeCompare(a.date_found) || rel(b) - rel(a));

}
