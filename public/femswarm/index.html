<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>femswarm Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #F1F2F6;
  --surface: #FFFFFF;
  --sunk: #E6E8EF;
  --ink: #1C1F2E;
  --muted: #5B6078;
  --line: #D9DBE5;
  --ok: #2E7D4F;
  --warn: #A65B00;
  --display: "Gloock", "Iowan Old Style", Georgia, serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --tint: 100%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #12141C; --surface: #1A1D28; --sunk: #232735; --ink: #E8E9F0;
    --muted: #9CA1B8; --line: #2C3040; --ok: #6FCF97; --warn: #F2B35B; --tint: 55%;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #12141C; --surface: #1A1D28; --sunk: #232735; --ink: #E8E9F0;
  --muted: #9CA1B8; --line: #2C3040; --ok: #6FCF97; --warn: #F2B35B; --tint: 55%;
}
* { box-sizing: border-box; }
body {
  background: var(--ground); color: var(--ink); font: 15px/1.55 var(--body);
  padding-inline: 16px; padding-block: 0 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ac, var(--ink)); outline-offset: 2px; }
/* each agent's accent: her own color in light mode, lifted toward white in dark mode */
[data-agent] { --ac: color-mix(in oklab, var(--c) var(--tint), #FFFFFF); }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; padding-block: 28px 20px; }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 { font: 400 40px/1 var(--display); margin: 0; letter-spacing: -0.01em; }
.brand p { margin: 0; color: var(--muted); }
.brand em { font-style: italic; color: var(--ink); }
.stamp { font: 12px/1.4 var(--mono); color: var(--muted); }

/* the line-up */
.lineup { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.desk > *, .find, .find * { min-width: 0; overflow-wrap: anywhere; }
.agent {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 14px; padding: 0; text-align: left; cursor: pointer; overflow: hidden;
  display: flex; flex-direction: column; font: inherit; transition: transform .15s ease, border-color .15s ease;
}
.agent:hover { transform: translateY(-2px); border-color: var(--ac); }
.agent[aria-pressed="true"] { border-color: var(--ac); box-shadow: 0 0 0 2px var(--ac); }
.agent .portrait { display: block; aspect-ratio: 1; width: 100%; max-width: 100%; }
.agent .portrait svg { display: block; width: 100%; height: 100%; }
.agent .who { padding: 10px 12px 12px; display: grid; gap: 2px; }
.agent .name { font: 400 22px/1.1 var(--display); color: var(--ac); }
.agent .role { font-size: 13px; color: var(--muted); }
.agent .meta { display: flex; align-items: center; gap: 6px; font: 12px/1.3 var(--mono); color: var(--muted); margin-top: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.warn { background: var(--warn); }
.dot.idle { background: var(--line); }

/* the desk */
.desk { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 28px; margin-top: 28px; align-items: start; }
.profile { display: grid; gap: 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.id { display: grid; grid-template-columns: 88px 1fr; gap: 14px; align-items: center; }
.id .face { width: 88px; height: 88px; border-radius: 50%; overflow: hidden; border: 3px solid var(--ac); }
.id .face svg { width: 100%; height: 100%; display: block; }
.id h2 { font: 400 32px/1 var(--display); margin: 0; color: var(--ac); }
.id .role { color: var(--muted); font-size: 14px; }
.namesake { margin: 0; font-size: 14px; color: var(--muted); }
.namesake b { color: var(--ink); font-weight: 600; }
.letter { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 16px 16px 16px; padding: 16px 18px; }
.letter .label { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ac); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
.letter .label span:last-child { color: var(--muted); }
.letter p { margin: 0; font-size: 15.5px; }
.letter.greeting p { font-style: italic; color: var(--muted); }
details.about { font-size: 14px; color: var(--muted); }
details.about summary { cursor: pointer; color: var(--ink); font-weight: 500; }
details.about p { margin: 8px 0 0; }
.panel-title { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.history svg { width: 100%; height: auto; display: block; }
.history .legend { display: flex; gap: 14px; font: 11px/1 var(--mono); color: var(--muted); margin-top: 6px; }
.history .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.problem { font-size: 13px; color: var(--warn); margin: 8px 0 0; }

/* roundup (Wells) */
.roundup { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
.roundup section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.roundup h3 { font: 400 20px/1.2 var(--display); margin: 0 0 10px; }
.roundup ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 14px; }
.roundup .caveat { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
.team { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.team .chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
.team .chip span.mini { width: 26px; height: 26px; border-radius: 50%; overflow: hidden; display: block; }
.team .chip svg { width: 100%; height: 100%; display: block; }
.team .chip b { font: 500 13px var(--mono); color: var(--ac); }

/* finds */
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.tools h3 { font: 400 26px/1 var(--display); margin: 0 auto 0 0; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; }
.seg button { appearance: none; border: 0; background: none; font: 500 13px var(--body); color: var(--muted); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tools select, .tools input { font: 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.tools input { width: 200px; max-width: 100%; }
.finds { display: grid; gap: 12px; }
.find { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 8px; }
.find .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 12.5px; color: var(--muted); }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.pips i.on { background: var(--ac); }
.find .by { display: inline-flex; align-items: center; gap: 6px; color: var(--ac); font-weight: 600; }
.find .by span.mini { width: 20px; height: 20px; border-radius: 50%; overflow: hidden; display: block; }
.find .by svg { width: 100%; height: 100%; display: block; }
.find h4 { margin: 0; font: 600 16.5px/1.35 var(--body); text-wrap: balance; }
.find h4 a { text-decoration: none; }
.find h4 a:hover { text-decoration: underline; text-decoration-color: var(--ac); text-underline-offset: 3px; }
.find p { margin: 0; max-width: 72ch; }
.find .why { color: var(--muted); font-size: 14px; }
.find .why b { color: var(--ink); font-weight: 600; }
.flag { font: 500 11px/1 var(--mono); padding: 4px 7px; border-radius: 5px; background: var(--sunk); color: var(--ink); }
.flag.caution { background: color-mix(in oklab, var(--warn) 18%, transparent); color: var(--warn); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font: 11px/1 var(--mono); color: var(--muted); }
.tags span::before { content: "#"; opacity: .6; }
.status { font: 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.empty { padding: 28px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.num { font-variant-numeric: tabular-nums; }
footer { margin-top: 40px; font-size: 12px; color: var(--muted); }

@media (max-width: 900px) {
  .desk { grid-template-columns: minmax(0, 1fr); }
  .profile { position: static; }
  .roundup { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .lineup { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .agent { flex-direction: row; align-items: center; }
  .agent .portrait { width: 64px; flex: none; }
  .agent .who { padding: 8px 12px; }
  .agent .meta { margin-top: 2px; }
  .brand h1 { font-size: 32px; }
}
@media (prefers-reduced-motion: reduce) { .agent { transition: none; } .agent:hover { transform: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>femswarm</h1>
      <p>The research desk behind <em>Women's Health, Computed</em></p>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>
  <nav class="lineup" id="lineup" aria-label="Agents"></nav>
  <main class="desk" id="desk"></main>
  <footer id="foot"></footer>
</div>

<script>
const DATA = {"built": "2026-09-27", "agents": {"trota": {"name": "Trota", "role": "Literature", "namesake": "Trota of Salerno, 12th-century physician whose texts on women's medicine were copied across Europe for centuries", "color": "#8E2F3C", "greeting": "I have read the week's journals and preprints. Here is what holds up.", "personality": "A physician and teacher first. Patient, exact, and quietly unimpressed by hype. She has spent a lifetime watching women's complaints go unrecorded, so she notices what a study leaves out as much as what it finds. She respects a good randomized trial and says plainly when evidence is thin, early, or not yet peer reviewed.", "how i write to adriana": "Like a trusted senior colleague handing over a reading list. Warm but brief. Points to the one or two papers most worth her time and says why in plain words. Names the weak spots (small samples, preprints, missing abstracts) without lecturing.", "avatar": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\" role=\"img\" aria-label=\"Portrait of Trota\">\n<title>Portrait of Trota<\/title>\n<rect width=\"200\" height=\"200\" fill=\"#F3DDE0\"/>\n\n<path d=\"M28 200 C32 162 64 146 100 146 C136 146 168 162 172 200 Z\" fill=\"#6E2330\"/>\n<path d=\"M46 108 C40 44 160 44 154 108 L166 200 L34 200 Z\" fill=\"#8E2F3C\"/>\n<path d=\"M60 96 C58 50 142 50 140 96 L142 150 C128 164 72 164 58 150 Z\" fill=\"#F4EEE4\"/>\n<rect x=\"88\" y=\"112\" width=\"24\" height=\"36\" rx=\"10\" fill=\"#B7825A\"/>\n<ellipse cx=\"100\" cy=\"94\" rx=\"31\" ry=\"37\" fill=\"#D9A77C\"/>\n<path d=\"M84 86 q6 -4 12 -1 M104 85 q6 -3 12 1\" stroke=\"#2A1A14\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\"/>\n<ellipse cx=\"89\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/><ellipse cx=\"111\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/>\n<path d=\"M100 99 q-3 9 1 11 q2 1 4 0\" stroke=\"#B7825A\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/>\n<path d=\"M91 117 q9 4 18 0 q-9 7 -18 0 z\" fill=\"#9A4A45\"/>\n<ellipse cx=\"80\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#9A4A45\" opacity=\".18\"/><ellipse cx=\"120\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#9A4A45\" opacity=\".18\"/>\n<path d=\"M66 72 C74 50 126 50 134 72 C122 64 78 64 66 72 Z\" fill=\"#E6DDCF\"/>\n<path d=\"M78 170 L100 186 L122 170\" stroke=\"#C9A24A\" stroke-width=\"3\" fill=\"none\"/>\n<\/svg>\n"}, "elion": {"name": "Elion", "role": "Pharma and trials", "namesake": "Gertrude Elion, Nobel laureate who designed drugs for leukemia, herpes, and organ transplant rejection without ever finishing a PhD", "color": "#0F766E", "greeting": "New trials registered, old ones finished. I keep the lab notebook.", "personality": "A bench scientist who learned by doing. Methodical, practical, and dryly funny. She treats every trial like an experiment: what is being tested, on whom, and when will we know. She is interested in results, not announcements, and tracks what changed since last week.", "how i write to adriana": "Like a lab notebook entry with a bit of personality. Leads with what changed (new, completed, results posted). Short sentences. Flags which trials are worth watching and why.", "avatar": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\" role=\"img\" aria-label=\"Portrait of Elion\">\n<title>Portrait of Elion<\/title>\n<rect width=\"200\" height=\"200\" fill=\"#D5EEEA\"/>\n\n<path d=\"M28 200 C32 162 64 146 100 146 C136 146 168 162 172 200 Z\" fill=\"#F7F7F4\"/>\n<path d=\"M84 148 L100 178 L116 148 Z\" fill=\"#1F3A3A\"/>\n<path d=\"M72 150 L100 200 L64 200 L56 158 Z M128 150 L100 200 L136 200 L144 158 Z\" fill=\"#E4E6E2\"/>\n<rect x=\"88\" y=\"112\" width=\"24\" height=\"36\" rx=\"10\" fill=\"#C99A76\"/>\n<ellipse cx=\"100\" cy=\"94\" rx=\"31\" ry=\"37\" fill=\"#EDC3A0\"/>\n<path d=\"M84 86 q6 -4 12 -1 M104 85 q6 -3 12 1\" stroke=\"#2A1A14\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\"/>\n<ellipse cx=\"89\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/><ellipse cx=\"111\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/>\n<path d=\"M100 99 q-3 9 1 11 q2 1 4 0\" stroke=\"#C99A76\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/>\n<path d=\"M91 117 q9 4 18 0 q-9 7 -18 0 z\" fill=\"#A4524E\"/>\n<ellipse cx=\"80\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#A4524E\" opacity=\".18\"/><ellipse cx=\"120\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#A4524E\" opacity=\".18\"/>\n<g fill=\"#2B211C\">\n<circle cx=\"74\" cy=\"72\" r=\"14\"/><circle cx=\"88\" cy=\"60\" r=\"15\"/><circle cx=\"104\" cy=\"57\" r=\"15\"/><circle cx=\"120\" cy=\"63\" r=\"14\"/>\n<circle cx=\"130\" cy=\"78\" r=\"12\"/><circle cx=\"69\" cy=\"88\" r=\"10\"/><circle cx=\"131\" cy=\"93\" r=\"9\"/><circle cx=\"96\" cy=\"66\" r=\"12\"/>\n<\/g>\n<g fill=\"#FFFFFF\" stroke=\"#D8D4CC\" stroke-width=\".8\">\n<circle cx=\"88\" cy=\"146\" r=\"3\"/><circle cx=\"94\" cy=\"149\" r=\"3\"/><circle cx=\"100\" cy=\"150\" r=\"3\"/><circle cx=\"106\" cy=\"149\" r=\"3\"/><circle cx=\"112\" cy=\"146\" r=\"3\"/>\n<\/g>\n<rect x=\"132\" y=\"170\" width=\"14\" height=\"4\" rx=\"2\" fill=\"#0F766E\"/>\n<\/svg>\n"}, "lamarr": {"name": "Lamarr", "role": "Commercial and innovation", "namesake": "Hedy Lamarr, film star who co-invented frequency hopping, a foundation of modern wireless technology", "color": "#6D3FB0", "greeting": "Everyone is launching something. I look at what is actually under the hood.", "personality": "An inventor who was underestimated because of how she looked. Curious, quick, and a little glamorous, but most interested in how things actually work. She can tell a real product from a press release and enjoys a clever device. She is skeptical of femtech buzz and asks who the product is really for.", "how i write to adriana": "Lively and sharp, like a friend who reads the trade press so you do not have to. Picks out the launches and partnerships that signal a real shift, and says when something looks like marketing rather than innovation.", "avatar": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\" role=\"img\" aria-label=\"Portrait of Lamarr\">\n<title>Portrait of Lamarr<\/title>\n<rect width=\"200\" height=\"200\" fill=\"#E6DCF5\"/>\n\n<path d=\"M58 80 C54 40 146 40 142 80 C148 110 150 140 138 160 C120 150 80 150 62 160 C50 140 52 110 58 80 Z\" fill=\"#1E1614\"/>\n<path d=\"M28 200 C32 162 64 146 100 146 C136 146 168 162 172 200 Z\" fill=\"#6D3FB0\"/>\n<path d=\"M78 150 Q100 176 122 150 L122 146 L78 146 Z\" fill=\"#F1C7A8\"/>\n<rect x=\"88\" y=\"112\" width=\"24\" height=\"36\" rx=\"10\" fill=\"#CF9E80\"/>\n<ellipse cx=\"100\" cy=\"94\" rx=\"31\" ry=\"37\" fill=\"#F1C7A8\"/>\n<path d=\"M84 86 q6 -4 12 -1 M104 85 q6 -3 12 1\" stroke=\"#2A1A14\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\"/>\n<ellipse cx=\"89\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/><ellipse cx=\"111\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/>\n<path d=\"M100 99 q-3 9 1 11 q2 1 4 0\" stroke=\"#CF9E80\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/>\n<path d=\"M91 117 q9 4 18 0 q-9 7 -18 0 z\" fill=\"#B3262F\"/>\n<ellipse cx=\"80\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#B3262F\" opacity=\".18\"/><ellipse cx=\"120\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#B3262F\" opacity=\".18\"/>\n<path d=\"M69 94 C66 58 92 50 112 54 C132 58 138 76 132 92 C124 72 104 62 94 66 C80 70 74 82 69 94 Z\" fill=\"#1E1614\"/>\n<path d=\"M60 132 q-6 10 4 16 q10 4 6 -8 M140 132 q6 10 -4 16 q-10 4 -6 -8\" fill=\"#2E2220\"/>\n<path d=\"M150 40 q6 -6 12 0 t12 0 M150 50 q6 -6 12 0 t12 0\" stroke=\"#6D3FB0\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/>\n<\/svg>\n"}, "walker": {"name": "Walker", "role": "Money and funding", "namesake": "Maggie Lena Walker, the first woman to charter a bank in the United States", "color": "#9A6B00", "greeting": "Follow the money. I count it, and I notice who goes without.", "personality": "A banker and community builder. Steady, careful with numbers, and never dazzled by a big round. She reads filings as closely as headlines and cares where money flows and where it does not, especially public research funding for conditions that affect women.", "how i write to adriana": "Like a clear-eyed treasurer's report. Names the notable raises, deals, and grants using only the figures in the sources. Points out patterns, such as which areas are getting funded and which are being cut.", "avatar": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\" role=\"img\" aria-label=\"Portrait of Walker\">\n<title>Portrait of Walker<\/title>\n<rect width=\"200\" height=\"200\" fill=\"#F2E6C8\"/>\n\n<path d=\"M28 200 C32 162 64 146 100 146 C136 146 168 162 172 200 Z\" fill=\"#2F2A26\"/>\n<path d=\"M84 140 L116 140 L114 164 L100 176 L86 164 Z\" fill=\"#F7F3EA\"/>\n<rect x=\"88\" y=\"112\" width=\"24\" height=\"36\" rx=\"10\" fill=\"#6E4229\"/>\n<ellipse cx=\"100\" cy=\"94\" rx=\"31\" ry=\"37\" fill=\"#8D5A3B\"/>\n<path d=\"M84 86 q6 -4 12 -1 M104 85 q6 -3 12 1\" stroke=\"#1A120E\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\"/>\n<ellipse cx=\"89\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/><ellipse cx=\"111\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/>\n<path d=\"M100 99 q-3 9 1 11 q2 1 4 0\" stroke=\"#6E4229\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/>\n<path d=\"M91 117 q9 4 18 0 q-9 7 -18 0 z\" fill=\"#6A3328\"/>\n<ellipse cx=\"80\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#6A3328\" opacity=\".18\"/><ellipse cx=\"120\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#6A3328\" opacity=\".18\"/>\n<path d=\"M68 90 C62 56 84 40 100 40 C116 40 138 56 132 90 C128 72 116 60 100 60 C84 60 72 72 68 90 Z\" fill=\"#1A1412\"/>\n<ellipse cx=\"100\" cy=\"46\" rx=\"36\" ry=\"16\" fill=\"#1A1412\"/><ellipse cx=\"100\" cy=\"30\" rx=\"14\" ry=\"9\" fill=\"#1A1412\"/>\n<g fill=\"none\" stroke=\"#C9A24A\" stroke-width=\"1.8\"><circle cx=\"89\" cy=\"96\" r=\"7\"/><circle cx=\"111\" cy=\"96\" r=\"7\"/><path d=\"M96 95 q4 -3 8 0\"/><\/g>\n<circle cx=\"100\" cy=\"168\" r=\"5\" fill=\"#C9A24A\"/>\n<\/svg>\n"}, "wells": {"name": "Wells", "role": "Weekly digest", "namesake": "Ida B. Wells, investigative journalist who used data to expose injustice", "color": "#1F4E99", "greeting": "I read everything the others found. Here is the story of the week.", "personality": "An editor and investigative reporter. Fearless, direct, and focused on what matters to readers. She connects items across the other agents' desks, asks who is left out of the research and the money, and always wants the evidence behind a claim.", "how i write to adriana": "Like an editor's note at the top of the paper. Names the strongest thread of the week and one or two possible posts. Brief and confident, and honest when the week was thin.", "avatar": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\" role=\"img\" aria-label=\"Portrait of Wells\">\n<title>Portrait of Wells<\/title>\n<rect width=\"200\" height=\"200\" fill=\"#D9E3F4\"/>\n\n<path d=\"M28 200 C32 162 64 146 100 146 C136 146 168 162 172 200 Z\" fill=\"#1B2440\"/>\n<path d=\"M82 136 L118 136 L116 158 Q100 166 84 158 Z\" fill=\"#F4F1EA\"/>\n<path d=\"M82 158 q4 4 8 0 q4 4 8 0 q4 4 8 0 q4 4 8 0 q4 4 2 2\" stroke=\"#D6D0C2\" stroke-width=\"1.5\" fill=\"none\"/>\n<rect x=\"88\" y=\"112\" width=\"24\" height=\"36\" rx=\"10\" fill=\"#5E3620\"/>\n<ellipse cx=\"100\" cy=\"94\" rx=\"31\" ry=\"37\" fill=\"#7A4A30\"/>\n<path d=\"M84 86 q6 -4 12 -1 M104 85 q6 -3 12 1\" stroke=\"#140E0B\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\"/>\n<ellipse cx=\"89\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/><ellipse cx=\"111\" cy=\"96\" rx=\"2.8\" ry=\"3.2\" fill=\"#1E1512\"/>\n<path d=\"M100 99 q-3 9 1 11 q2 1 4 0\" stroke=\"#5E3620\" stroke-width=\"2.2\" fill=\"none\" stroke-linecap=\"round\"/>\n<path d=\"M91 117 q9 4 18 0 q-9 7 -18 0 z\" fill=\"#5E2C22\"/>\n<ellipse cx=\"80\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#5E2C22\" opacity=\".18\"/><ellipse cx=\"120\" cy=\"108\" rx=\"6\" ry=\"3.5\" fill=\"#5E2C22\" opacity=\".18\"/>\n<path d=\"M68 92 C64 58 84 44 100 44 C116 44 136 58 132 92 C126 76 114 70 100 70 C86 70 74 76 68 92 Z\" fill=\"#17110F\"/>\n<ellipse cx=\"100\" cy=\"40\" rx=\"18\" ry=\"12\" fill=\"#17110F\"/>\n<g fill=\"#17110F\"><circle cx=\"82\" cy=\"74\" r=\"5\"/><circle cx=\"90\" cy=\"70\" r=\"5.5\"/><circle cx=\"99\" cy=\"69\" r=\"5.5\"/><circle cx=\"108\" cy=\"70\" r=\"5.5\"/><circle cx=\"117\" cy=\"74\" r=\"5\"/><\/g>\n<ellipse cx=\"100\" cy=\"164\" rx=\"6\" ry=\"5\" fill=\"#C9A24A\"/><ellipse cx=\"100\" cy=\"164\" rx=\"3\" ry=\"2.5\" fill=\"#1F4E99\"/>\n<path d=\"M144 150 l14 -26 l4 2 l-14 26 z\" fill=\"#E8E4DA\"/>\n<\/svg>\n"}}, "items": [{"date_found": "2026-09-27", "scout": "trota", "source": "Proceedings of the ACM on Human-Computer Interaction", "title": "Designing Sexual Communication Tools for and with Transgender and Queer Youth", "url": "https://doi.org/10.1145/3816922", "published": "2026-09-23", "tags": "sexual_health;HCI;design;digital_health;transgender_health;youth;participatory_design", "relevance": "4", "summary": "Researchers partnered with 18 transgender and queer youth over multiple years to design two technology tools for sexual communication: Desire Dialogues for discussing sexual boundaries and the Intimate Disclosure Toolkit for sharing personal information with partners. The work documents a community-based participatory design process and identifies design principles for future sexual communication tools.", "why_it_matters": "This HCI work demonstrates embodied, experience-centered design of health technology addressing a documented gap—sexual communication tools designed with and for marginalized youth rather than treating contraception as the default focus.", "flags": "HCI", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] AI-Assisted Euploid Embryo Selection for Single-Blastocyst Transfer in Women of Advanced Maternal Age", "url": "https://clinicaltrials.gov/study/NCT07833345", "published": "2026-09-22", "tags": "AI_machine_learning;fertility;assisted_reproduction;clinical_decision_support;digital_health", "relevance": "5", "summary": "Trial of AI-assisted embryo selection (EmbryoInsights™ Plus) combining morphological assessment with euploidy prediction for single-blastocyst transfer in women of advanced maternal age.", "why_it_matters": "Directly addresses AI/machine learning in fertility care with potential to improve outcomes in an underserved population; exemplifies clinical decision support in femtech.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[Recently updated, now COMPLETED] Supporting Transitions to Primary Care Among Under-resourced, Postpartum Women (STEP-UP)", "url": "https://clinicaltrials.gov/study/NCT05852054", "published": "2026-09-24", "tags": "postpartum;clinical_decision_support;digital_health;gestational_diabetes;hypertension_pregnancy;health_equity", "relevance": "5", "summary": "STEP-UP trial completed; combined clinical decision support (for both OB and primary care providers), patient education, text messaging, and patient outreach to support transitions to primary care in under-resourced postpartum women with gestational diabetes, hypertension, or dysglycemia.", "why_it_matters": "Exemplifies clinical decision support, digital health (text messaging), and structural support for a vulnerable postpartum population; directly addresses care gaps and evidence-based implementation in women's health.", "flags": "Recently updated, now COMPLETED", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] MH-Rx Study (Baby on Board: Check-in on You, Your Medication, & Your Blood Pressure)", "url": "https://clinicaltrials.gov/study/NCT07842341", "published": "2026-09-25", "tags": "hypertension_pregnancy;digital_health;remote_monitoring;clinical_decision_support;health_equity;behavioral_intervention", "relevance": "5", "summary": "MH-Rx Study testing a combination intervention of community health worker-led non-medical health needs support plus clinician-led medication therapy management with remote blood pressure monitoring for hypertensive disorders of pregnancy.", "why_it_matters": "Directly addresses structural inequities in pregnancy hypertension care through integrated digital health (remote BP monitoring) and social support; exemplifies evidence gaps in under-resourced populations.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[Recently updated, now COMPLETED] Feasibility Study and Pilot Hybrid Effectiveness-Implementation Trial for the Universal Prevention of Maternal Perinatal Mental Disorders as Normalized Routine Practice (e-Perinatal Pilot)", "url": "https://clinicaltrials.gov/study/NCT06640907", "published": "2026-09-23", "tags": "perinatal_mental_health;digital_health;femtech;mHealth;implementation_science;postpartum", "relevance": "5", "summary": "A completed pilot hybrid effectiveness-implementation trial at University of Seville tested e-Perinatal, a personalized mHealth intervention for universal prevention of maternal perinatal depression and anxiety integrated into routine care. Results are now available.", "why_it_matters": "Directly addresses digital health implementation for perinatal mental health—a major evidence gap—combining femtech, clinical decision support, and health equity angles with real-world care integration.", "flags": "Recently updated, now COMPLETED", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] Effects of Transcutaneous Tibial and Auricular Vagus Nerve Stimulation in Females With Primary Dysmenorrhea", "url": "https://clinicaltrials.gov/study/NCT07834658", "published": "2026-09-22", "tags": "menstrual_health;dysmenorrhea;device;wearable;neuromodulation;femtech", "relevance": "5", "summary": "A new trial of transcutaneous tibial and auricular vagus nerve stimulation (wearable neuromodulation devices) for primary dysmenorrhea. Novel device approach to menstrual pain.", "why_it_matters": "Directly combines femtech/wearable device innovation with menstrual health; explores non-drug neuromodulation—high editorial relevance on device and evidence gaps.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] The Effect of Structured Health Information-Seeking Training on Cyberchondria and E-Health Literacy in Menopausal Women: A Randomized Controlled Trial", "url": "https://clinicaltrials.gov/study/NCT07834216", "published": "2026-09-22", "tags": "menopause;digital health;e-health literacy;cyberchondria;health information-seeking", "relevance": "4", "summary": "A randomized controlled trial will test video-based and Pecha Kucha-based health information-seeking training to reduce cyberchondria and improve e-health literacy in menopausal women. The trial has not yet begun recruiting.", "why_it_matters": "Directly addresses digital health literacy and cyberchondria in menopausal women—an emerging gap in women's health and embodied digital experience design.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] On the Effect of a Hybrid Health Literacy Intervention on Sexual Function and Digital Health Literacy in Menopausal Women", "url": "https://clinicaltrials.gov/study/NCT07839416", "published": "2026-09-24", "tags": "postmenopause;sexual function;digital health literacy;health literacy", "relevance": "4", "summary": "A trial will test a hybrid health literacy intervention targeting sexual function and digital health literacy in postmenopausal women. The trial has not yet begun recruiting.", "why_it_matters": "Directly addresses digital health literacy and sexual function in menopause—aligns with embodied experience-centered design and evidence gaps in menopausal sexual health.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] Cyclic vs. Constant Estradiol: Regimens' Effects on Brain Health", "url": "https://clinicaltrials.gov/study/NCT07831499", "published": "2026-09-21", "tags": "menopause;drug_development;brain_health", "relevance": "4", "summary": "Phase 4 trial comparing cyclic versus continuous estradiol regimens and their effects on brain health in postmenopausal women. Currently recruiting at University of Colorado, Denver.", "why_it_matters": "Addresses menopause treatment optimization with potential implications for cognitive health outcomes, an understudied area in women's health.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] The WAIT Trial: Waiting Versus Active Induction at Term in Women With A1 Gestational Diabetes Mellitus", "url": "https://clinicaltrials.gov/study/NCT07831954", "published": "2026-09-22", "tags": "gestational_diabetes;pregnancy;clinical_decision_making", "relevance": "4", "summary": "The WAIT Trial comparing timing of planned delivery (waiting versus active induction at term) in women with A1 gestational diabetes mellitus.", "why_it_matters": "Addresses a clinical decision-making gap in mild GDM management with potential to reduce unnecessary intervention; directly supports evidence-based pregnancy care.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] Healthy Adaptation to Pregnancy, Postpartum and Parenthood", "url": "https://clinicaltrials.gov/study/NCT07837193", "published": "2026-09-23", "tags": "postpartum;perinatal_mental_health;digital_health;femtech;gestational_weight_gain", "relevance": "4", "summary": "A new trial from KU Leuven evaluates the HAP3 Family App, a behavioral intervention addressing perinatal mental health, gestational weight gain, postpartum weight retention, and child development. Trial is not yet recruiting.", "why_it_matters": "Digital health tool targeting perinatal mental health and postpartum recovery aligns with femtech and digital health editorial angles; addresses known evidence gaps in perinatal mental health support.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] The Effect of Digitally Enabled District (DED 2.0) Ecosystem on the Completeness and Timeliness of Maternal and Neonatal Services in Primary Health Care", "url": "https://clinicaltrials.gov/study/NCT07842224", "published": "2026-09-25", "tags": "pregnancy;postpartum;digital_health;maternal_health;health_equity", "relevance": "4", "summary": "A new trial in Indonesia tests the Digitally Enabled District (DED 2.0) ecosystem to improve completeness and timeliness of maternal and neonatal services across prenatal, intensive, and postnatal care. Trial is not yet recruiting.", "why_it_matters": "Examines digital health infrastructure for maternal and neonatal services in primary care, addressing access and equity; fits digital health and systems innovation angles.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] Empowered Relief for Severe Pain After Cesarean Delivery During the Inpatient Period", "url": "https://clinicaltrials.gov/study/NCT07832240", "published": "2026-09-24", "tags": "postpartum;cesarean_section;pain_management;behavioral_intervention", "relevance": "4", "summary": "A new trial from Stanford evaluates 'Empowered Relief,' a behavioral intervention for severe postoperative pain after cesarean delivery during the inpatient period. Trial is not yet recruiting.", "why_it_matters": "Targets postpartum pain management—a known gap in women's health care—using behavioral/clinical decision support; aligns with embodied experience-centered design angle.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[New trial registered] Smartphone-based Incentives Intervention to Increase Smoking Cessation During Pregnancy", "url": "https://clinicaltrials.gov/study/NCT07840118", "published": "2026-09-24", "tags": "pregnancy;postpartum;digital_health;smartphone_app;behavioral_intervention", "relevance": "4", "summary": "A new smartphone-based intervention using financial incentives to increase smoking cessation during pregnancy and postpartum. Combines digital health tool with behavioral economics approach.", "why_it_matters": "Directly hits digital health and femtech angles in pregnancy/postpartum; demonstrates technology-enabled behavioral intervention design.", "flags": "New trial registered", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[Recently updated, now COMPLETED] Exploring Patient Treatment Preferences for Chronic Pelvic Pain: A Mixed Methods Study", "url": "https://clinicaltrials.gov/study/NCT06540560", "published": "2026-09-21", "tags": "gynecologic;chronic_pelvic_pain;digital_health;patient_preferences;femtech", "relevance": "4", "summary": "A completed mixed-methods study on patient treatment preferences for chronic pelvic pain using the My Pelvic Plan website. Digital tool informed by patient preferences.", "why_it_matters": "Digital health platform designed around patient experience and preferences in gynecologic pain—directly aligns with experience-centered design angle.", "flags": "Recently updated, now COMPLETED", "status": "new"}, {"date_found": "2026-09-27", "scout": "elion", "source": "ClinicalTrials.gov", "title": "[Results posted] Non-Steroidal Anti-Inflammatory Drug (NSAID) Response and Central Sensitization of Pain in Women With Dysmenorrhea", "url": "https://clinicaltrials.gov/study/NCT05900336", "published": "2026-09-22", "tags": "menstrual_health;dysmenorrhea;pain_mechanisms;drug_response", "relevance": "4", "summary": "Results posted from a phase 4 trial examining NSAID response and central sensitization mechanisms in dysmenorrhea. Mechanistic pain science in menstrual disorders.", "why_it_matters": "Addresses evidence gaps in dysmenorrhea pathophysiology and drug response variation—identifies structural gaps in menstrual pain research.", "flags": "Results posted", "status": "new"}, {"date_found": "2026-09-27", "scout": "lamarr", "source": "femtechworld.co.uk", "title": "Personalising women’s health with AI", "url": "https://news.google.com/rss/articles/CBMihwFBVV95cUxOMDJXVF9fV1ZiYTBzdFhneG5KN2Y2TGlSVUFVVDNCb2I1dG52VWJzMWlfcW5fTlphRnhSY0FvYXZjVlhrYjdCeU0yQnhHbk8xTEJ6VjMwd2lnVG9yeXBYeUpnRXlVUG1FSnJEWTk4RlRaLU54b2JFVzhRa1h1QUZYYjZYVjZaRUk?oc=5", "published": "2026-09-22", "tags": "AI;machine learning;digital health;femtech", "relevance": "5", "summary": "Coverage of personalizing women's health with AI. This directly addresses a core editorial angle on AI and machine learning in women's health.", "why_it_matters": "AI-driven personalization in women's health is a top editorial priority; the topic signals potential product innovation, clinical decision support, or market shifts.", "flags": "news", "status": "new"}, {"date_found": "2026-09-27", "scout": "lamarr", "source": "PR Newswire", "title": "Mira Launches Cortisol Pattern™ Kit To Redefine Stress Tracking in Women's Health", "url": "https://news.google.com/rss/articles/CBMi0A function historyChart(k) {

  $("#desk").innerHTML = `${renderProfile(k)}
    <section ${agentStyle(k)}>
      ${k === "wells" ? roundup() : ""}
      <div class="tools">
        <h3>${k === "wells" ? "Everything this week" : esc(agents[k].name) + "'s finds"} <span class="stamp num" id="count"></span></h3>
        <div class="seg" role="group" aria-label="Time range">
          <button id="scope-week" aria-pressed="${state.scope === "week"}">This week</button>
          <button id="scope-all" aria-pressed="${state.scope === "all"}">All time</button>
        </div>
        <select id="min" aria-label="Minimum relevance">
          ${[3, 4, 5].map(n => `<option value="${n}" ${state.min === n ? "selected" : ""}>Relevance ${n}+</option>`).join("")}
        </select>
        <input id="q" type="search" placeholder="Search finds" value="${esc(state.q)}" aria-label="Search finds">
      </div>
      <div class="finds" id="finds"></div>
    </section>`;
  $("#scope-week").onclick = () => { state.scope = "week"; save(); renderDesk(); };
  $("#scope-all").onclick = () => { state.scope = "all"; save(); renderDesk(); };
  $("#min").onchange = e => { state.min = +e.target.value; save(); renderFinds(); };
  $("#q").oninput = e => { state.q = e.target.value; renderFinds(); };
  renderFinds();
}

function render() { renderLineup(); renderDesk(); }
$("#lineup").addEventListener("click", e => {
  const b = e.target.closest(".agent"); if (!b) return;
  state.agent = b.dataset.key; save(); render();
});
$("#stamp").textContent = `Updated ${fmtDate(DATA.built)} · ${DATA.items.length} finds on file`;
$("#foot").textContent = "Built from data/items.csv after every run. Every find links to its source; summaries are machine-written from the source text, so check the original before citing.";
render();
</script>

</html>
